const jaScripts = [
  { id:'p1', title:"①まくら", ssml:true, text:"<speak><prosody rate=\"105%\" pitch=\"0st\">え〜、一席申し上げますが。夏の暑い盛りには色々な商売がございますが、中でも一番辛いのは、この植木屋のような、外で体を使う仕事でございますね。<break time=\"500ms\"/>炎天下、汗水垂らして働くというのは、口で言うほど楽なものじゃございません。<break time=\"400ms\"/>そこへいくと、大きな屋敷にお住まいの旦那様というのは、涼しいお座敷でお酒など召し上がりながら、涼しい顔をしていらっしゃる。<break time=\"500ms\"/>同じ人間でも、住む世界が違うと、言葉遣いから物腰まで、まるで別物でございましてね。今日はそんな、庭師と、ある品のいいご隠居さんとの一幕を、一つお付き合い願いましょう。<break time=\"700ms\"/></prosody></speak>" },
  { id:'p2', title:"②庭師、招かれる", ssml:true, text:"<speak><prosody rate=\"108%\" pitch=\"0st\">夏の日、ある大きなお屋敷の庭で、植木屋が汗だくになって仕事をしております。そこへ、その家のご隠居が縁側から声をかけます。<break time=\"500ms\"/></prosody><prosody rate=\"92%\" pitch=\"-1st\">おい、精が出るね。今日はまた一段と暑いが、少し休んでいきなさい。<break time=\"500ms\"/></prosody><prosody rate=\"110%\" pitch=\"+1st\">植木屋は恐縮しながらも、ありがたく縁側に腰を下ろします。ご隠居は品よく微笑みながら、<break time=\"400ms\"/></prosody><prosody rate=\"90%\" pitch=\"-1st\">まあ、こう暑くては仕事にならないだろう。ちょいと、涼んでいきなさい。<break time=\"500ms\"/></prosody><prosody rate=\"108%\" pitch=\"0st\">と、家の中へと誘い入れます。<break time=\"600ms\"/></prosody></speak>" },
  { id:'p3', title:"③酒肴のもてなし", ssml:true, text:"<speak><prosody rate=\"108%\" pitch=\"0st\">座敷に上げてもらった植木屋の前に、ご隠居は冷たい酒と、鯉の洗いだの、気の利いた肴を並べさせます。植木屋はこんな上等なもてなしを受けたことがなく、恐縮しきり。<break time=\"500ms\"/></prosody><prosody rate=\"118%\" pitch=\"+1st\">いや旦那様、あたしのようなものには勿体のうございます。<break time=\"400ms\"/></prosody><prosody rate=\"90%\" pitch=\"-1st\">なに、遠慮はいらないよ。今日はゆっくりしていきなさい。<break time=\"500ms\"/></prosody><prosody rate=\"106%\" pitch=\"0st\">ご隠居の言葉遣いも、酒の出し方も、いちいち品があって、植木屋はすっかり感心してしまいます。<break time=\"600ms\"/></prosody></speak>" },
  { id:'p4', title:"④青菜を所望", ssml:true, text:"<speak><prosody rate=\"105%\" pitch=\"0st\">ひとしきり酒を酌み交わした後、ご隠居はふと思い出したように、奥にいる女房へ声をかけます。<break time=\"400ms\"/></prosody><prosody rate=\"90%\" pitch=\"-1st\">おい、あれをこれへ持っておいで。ほら、青菜を茹でたのがあったろう。<break time=\"500ms\"/></prosody><prosody rate=\"104%\" pitch=\"0st\">すると奥から出てきた女房、亭主の傍まで来て、そっと耳打ちをする。実は、その青菜はもう無くなっていて、家にはもう一切れも残っていない。<break time=\"500ms\"/>だが、それをそのまま「もうございません」と言ってしまっては、あまりに色気がない。植木屋の手前もある、さあ、ここでこの女房、どう切り抜けるか。<break time=\"700ms\"/></prosody></speak>" },
  { id:'p5', title:"⑤判じ物の趣向", ssml:true, text:"<speak><prosody rate=\"100%\" pitch=\"0st\">そこで女房は、澄まし顔でこう申し上げます。<break time=\"400ms\"/></prosody><prosody rate=\"95%\" pitch=\"-1st\">旦那様、その青菜はゆうべ、義経にしてしまいました。<break time=\"500ms\"/></prosody><prosody rate=\"105%\" pitch=\"0st\">植木屋はきょとんとしますが、ご隠居はにっこり笑って、<break time=\"350ms\"/></prosody><prosody rate=\"92%\" pitch=\"-1st\">ああ、義経ならば、鞍馬へ、お帰りか。<break time=\"450ms\"/></prosody><prosody rate=\"95%\" pitch=\"-1st\">はい、弁慶もお供をして、跡形もなく。<break time=\"500ms\"/></prosody><prosody rate=\"106%\" pitch=\"0st\">要するに、青菜は義経のように姿を消して跡形もございません。つまりもう、ございませんということを、義経が奥州へ落ち延びて行方をくらました故事にかけて、上品に伝えているのでございます。<break time=\"500ms\"/>ご隠居はこれはうまいことを言うと大喜び。植木屋はこの気の利いたやり取りに、すっかり感心してしまいます。<break time=\"400ms\"/></prosody><prosody rate=\"120%\" pitch=\"+1st\">はあ〜、これはいい。あたしも今度、家でひとつやってみよう。<break time=\"700ms\"/></prosody></speak>" },
  { id:'p6', title:"⑥植木屋、我が家で真似する", ssml:true, text:"<speak><prosody rate=\"110%\" pitch=\"0st\">すっかり感心した植木屋、そそくさと家へ帰ると、女房をつかまえて、<break time=\"400ms\"/></prosody><prosody rate=\"120%\" pitch=\"+2st\">おい、今夜、友達を呼ぶから、お前、さっきの旦那の家のようにやってくれ。<break time=\"400ms\"/></prosody><prosody rate=\"110%\" pitch=\"0st\">と、あの気の利いたやり取りを、一から仕込み始めます。<break time=\"400ms\"/></prosody><prosody rate=\"122%\" pitch=\"+2st\">いいか、おれが『おい、あれをこれへ持っておいで、青菜があったろう』と言ったら、お前は奥の四畳半にでも隠れていて、『旦那様、その青菜は義経にしてしまいました』と言うんだ。<break time=\"450ms\"/></prosody><prosody rate=\"115%\" pitch=\"-1st\">へえ？何のことだかさっぱりわかりませんよ。<break time=\"400ms\"/></prosody><prosody rate=\"108%\" pitch=\"0st\">と首をかしげますが、亭主に急かされて仕方なく、狭い押し入れの中に押し込まれ、出番を待つことになります。折悪しく、その日は輪をかけて蒸し暑い一日でございました。<break time=\"600ms\"/></prosody></speak>" },
  { id:'p7', title:"⑦サゲ", ssml:true, text:"<speak><prosody rate=\"110%\" pitch=\"0st\">やがて友達が訪ねてきて、植木屋は見よう見まねの酒宴を始めます。ところが、いざその青菜の件を切り出そうにも、酒に酔った勢いもあって、肝心の掛け声をすっかり忘れてしまう始末。<break time=\"500ms\"/></prosody><prosody rate=\"125%\" pitch=\"+2st\">え〜っと、なんだったかな…おい、あれだ、あれを持ってこい、あの…義経ぁ!<break time=\"400ms\"/></prosody><prosody rate=\"108%\" pitch=\"0st\">と、しどろもどろになりながら、ようやく大声で叫びます。すると、狭い押し入れの中で、あまりの暑さと待ちくたびれとで、すっかり逆上せ上がっていた女房、襖をがらりと開けて、汗だくの顔を突き出すと、こう怒鳴ります。<break time=\"500ms\"/></prosody><prosody rate=\"130%\" pitch=\"+2st\">旦那様、その義経も弁慶も、この暑さでとうに音を上げて、とっくに逃げ出しちまいましたよ! それより早く、あたしを此処から出しておくれよ!<break time=\"600ms\"/></prosody><prosody rate=\"100%\" pitch=\"-1st\">というわけで、色気も何もあったものではございません。<break time=\"800ms\"/></prosody></speak>" }
];

const otherScripts = {
  'en': [
    { id:'p1', title:"①まくら", ssml:false, text:"Well now, let me tell you a story. In the heat of summer there are all sorts of trades, but among the hardest is surely that of the gardener — out under the blazing sun, working up a sweat with nothing but his own two hands. It's no small thing to labor like that in the beating sun. And then there's the master of some grand house, sipping cool sake in a shaded room, looking perfectly composed. Same species, different worlds — their speech, their bearing, everything about them is like night and day. Today let's follow one such scene: a gardener, and a refined old master of a fine house." },
    { id:'p2', title:"②庭師、招かれる", ssml:false, text:"On a summer day, a gardener is drenched in sweat, working away in the garden of a grand house. From the veranda, the old master of the house calls out to him. \"Well now, you're really putting your back into it. It's especially hot today — come rest a while.\" The gardener, feeling rather embarrassed, gratefully sits down on the veranda step. The master smiles with quiet elegance. \"Now really, it's too hot to get anything done. Come in and cool off a bit.\" And with that, he invites the gardener inside." },
    { id:'p3', title:"③酒肴のもてなし", ssml:false, text:"Once seated in the parlor, the gardener finds cold sake, sliced carp, and all manner of tasty little dishes laid out before him by the master's order. He's never received such fine hospitality in his life and can hardly contain his embarrassment. \"Oh no, sir, this is far too much for someone like me.\" \"Nonsense, no need to be shy. Take your time today.\" Everything about the master — his choice of words, the way he pours the sake — carries such refinement that the gardener is thoroughly impressed." },
    { id:'p4', title:"④青菜を所望", ssml:false, text:"After they'd shared cup after cup of sake, the master suddenly seemed to remember something and called toward the back of the house, where his wife was. \"Say, bring that out here, would you? You know, we had some greens boiled up.\" His wife came out, walked over close to her husband, and quietly whispered in his ear. The truth was, the greens were long gone — not a single leaf left in the house. But simply saying \"there aren't any left\" would be far too plain, too graceless, especially with the gardener right there watching. So now — how will this wife manage to slip out of it?" },
    { id:'p5', title:"⑤判じ物の趣向", ssml:false, text:"So the wife, with a perfectly composed face, announces: \"My dear, those greens turned into Yoshitsune last night.\" The gardener is baffled, but the master breaks into a delighted smile. \"Ah, if it's Yoshitsune, I suppose he's gone home to Kurama, has he?\" \"Yes, and Benkei went along with him — not a trace left behind.\" In other words: \"the greens have vanished without a trace, just like Yoshitsune,\" a graceful way of saying \"there are none left,\" borrowing the old legend of the fugitive general Yoshitsune fleeing north and disappearing entirely. The master claps with delight at the clever wordplay, and the gardener is utterly won over by it. \"Ohh, now that's marvelous. I've got to try that at home myself sometime.\"" },
    { id:'p6', title:"⑥植木屋、我が家で真似する", ssml:false, text:"Thoroughly impressed, the gardener hurries home and grabs hold of his wife. \"Listen, I'm having a friend over tonight, and you're going to do just what that master's house did.\" And he starts drilling her, from scratch, in that clever little exchange. \"Now listen close: when I say, 'Hey, bring that out here, we had some greens, didn't we?' — you're going to hide in the back room, and say, 'My dear, those greens turned into Yoshitsune.'\" \"Huh? I haven't the foggiest idea what you're talking about,\" she says, tilting her head — but hurried along by her husband, she has no choice but to be shoved into the cramped closet to wait for her cue. As bad luck would have it, that day was even more stifling and humid than the one before." },
    { id:'p7', title:"⑦サゲ", ssml:false, text:"Before long the friend arrives, and the gardener starts up his own clumsy imitation of a drinking party. But when the moment comes to bring up the matter of the \"greens,\" the drink has gone to his head, and he completely forgets the crucial cue line. \"Er... what was it again... hey, that thing, bring me that thing, that... Yoshitsune-uh!\" he finally blurts out at the top of his lungs, tripping over his own words. And at that, from inside the cramped closet — utterly overheated from the stifling air and worn out from waiting so long — his wife flings the sliding door open, thrusts out her sweat-drenched face, and bellows: \"Sir! Both that Yoshitsune and that Benkei gave up from the heat ages ago and ran off already! Now quit stalling and let me out of here!\" And so, needless to say, there wasn't a shred of refinement left in the whole affair. And that, ladies and gentlemen, is the punchline." }
  ],
  'fr': [
    { id:'p1', title:"①まくら", ssml:false, text:"Eh bien, laissez-moi vous conter une histoire. En plein été, il existe mille métiers, mais l'un des plus rudes reste celui du jardinier, dehors sous le soleil brûlant, suant à grosses gouttes. Ce n'est pas rien de trimer ainsi sous un ciel de feu. Et pendant ce temps, le maître d'une grande demeure sirote son saké bien frais dans une pièce fraîche, l'air parfaitement serein. Même espèce humaine, mais des mondes différents — jusque dans les manières de parler et de se tenir, tout les sépare. Aujourd'hui, suivons donc un jardinier et un vieux maître raffiné." },
    { id:'p2', title:"②庭師、招かれる", ssml:false, text:"Un jour d'été, un jardinier, trempé de sueur, s'active dans le jardin d'une grande demeure. Depuis la véranda, le vieux maître de maison l'interpelle. « Eh bien, tu y mets du cœur. Il fait particulièrement chaud aujourd'hui, viens donc te reposer un peu. » Le jardinier, un peu gêné, s'assoit avec gratitude sur le rebord de la véranda. Le maître sourit avec une élégance tranquille. « Franchement, il fait trop chaud pour travailler. Viens donc te rafraîchir à l'intérieur. » Et il l'invite ainsi à entrer." },
    { id:'p3', title:"③酒肴のもてなし", ssml:false, text:"Une fois installé dans le salon, le jardinier découvre du saké bien frais, de la carpe tranchée et toutes sortes de bons petits plats disposés devant lui sur ordre du maître. Il n'a jamais reçu pareil accueil de sa vie et peine à cacher sa gêne. « Oh non, monsieur, c'est bien trop pour quelqu'un comme moi. » « Allons, pas de gêne. Prends ton temps aujourd'hui. » Tout, chez le maître — le choix des mots, la façon de servir le saké — respire un tel raffinement que le jardinier en reste tout impressionné." },
    { id:'p4', title:"④青菜を所望", ssml:false, text:"Après avoir partagé coupe sur coupe de saké, le maître sembla soudain se souvenir de quelque chose et appela vers le fond de la maison, où se trouvait son épouse. « Dis donc, apporte-moi cela, tu veux ? Tu sais, les légumes verts qu'on avait fait bouillir. » Son épouse sortit, s'approcha tout près de son mari et lui chuchota quelque chose à l'oreille. En vérité, il n'y avait plus une seule feuille de légume dans la maison. Mais dire simplement « il n'y en a plus » manquerait cruellement d'élégance, surtout devant le jardinier. Alors, comment cette épouse va-t-elle se tirer d'affaire ?" },

const otherLangs = ['en','fr','es'];
const allAudio = {};
let otherDone = 0;
const OTHER_TOTAL = 21;

function initJaUI() {
  const container = document.getElementById('ja-parts');
  jaScripts.forEach((p, i) => {
    container.innerHTML += `
      <div class="part-row">
        <div class="part-title">${p.title}</div>
        <div>
          <div class="part-status" id="ja-status-${p.id}">未生成</div>
          <audio id="ja-audio-${p.id}"></audio>
        </div>
        <button class="btn btn-blue" onclick="generateJaPart(${i})">▶ 生成</button>
        <button class="btn btn-red" id="ja-play-${p.id}" onclick="playJaPart('${p.id}')" disabled>▷ 再生</button>
        <button class="btn btn-green" id="ja-dl-${p.id}" onclick="downloadJaPart(${i})" disabled>⬇ DL</button>
      </div>`;
  });
}

function initOtherUI() {
  const container = document.getElementById('lang-blocks');
  otherLangs.forEach(lang => {
    const parts = otherScripts[lang];
    const badges = parts.map(p => `<span class="part-badge" id="badge-${lang}-${p.id}" onclick="retryOtherPart('${lang}','${p.id}')" title="クリックで生成/再試行">${p.title}</span>`).join('');
    container.innerHTML += `
      <div class="lang-block">
        <div class="lang-title">${langConfig[lang].name} <span style="font-size:11px;color:#888;font-weight:normal;">${langConfig[lang].voice}</span></div>
        <div class="lang-progress">${badges}</div>
        <div class="lang-status" id="lang-status-${lang}">待機中</div>
      </div>`;
  });
}

async function callTTS(langCode, voiceName, text, isSSML) {
  const key = document.getElementById('apiKey').value.trim();
  if (!key) { throw new Error('APIキーが未入力です'); }
  const body = {
    input: isSSML ? { ssml: text } : { text },
    voice: { languageCode: langCode, name: voiceName },
    audioConfig: { audioEncoding: 'MP3' }
  };
  const res = await fetch(
    `https://texttospeech.googleapis.com/v1/text:synthesize?key=${key}`,
    { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
  );
  const data = await res.json();
  if (!data.audioContent) {
    const msg = (data.error && data.error.message) ? `[${data.error.status || res.status}] ${data.error.message}` : `HTTPエラー ${res.status}: ${JSON.stringify(data)}`;
    throw new Error(msg);
  }
  return data.audioContent;
}

async function generateJaPart(idx) {
  const p = jaScripts[idx];
  const status = document.getElementById(`ja-status-${p.id}`);
  status.textContent = '生成中...';
  status.className = 'part-status active';
  try {
    const b64 = await callTTS('ja-JP', 'ja-JP-Chirp3-HD-Charon', p.text, p.ssml);
    allAudio[`ja-${p.id}`] = b64;
    const audio = document.getElementById(`ja-audio-${p.id}`);
    audio.src = 'data:audio/mp3;base64,' + b64;
    status.textContent = '✅ 完成！';
    status.className = 'part-status done';
    document.getElementById(`ja-play-${p.id}`).disabled = false;
    document.getElementById(`ja-dl-${p.id}`).disabled = false;
    updateJaProgress();
  } catch (e) {
    status.textContent = '❌ ' + e.message;
    status.className = 'part-status error';
    status.title = e.message;
  }
}

function playJaPart(id) {
  document.getElementById(`ja-audio-${id}`).play();
}

function downloadJaPart(idx) {
  const p = jaScripts[idx];
  const key = `ja-${p.id}`;
  if (!allAudio[key]) return;
  const a = document.createElement('a');
  a.href = 'data:audio/mp3;base64,' + allAudio[key];
  a.download = `ja_p${idx+1}.mp3`;
  a.click();
}

async function generateAllJa() {
  for (let i = 0; i < jaScripts.length; i++) {
    await generateJaPart(i);
    await new Promise(r => setTimeout(r, 300));
  }
}

async function downloadAllJa() {
  for (let i = 0; i < jaScripts.length; i++) {
    const key = `ja-${jaScripts[i].id}`;
    if (!allAudio[key]) continue;
    const a = document.createElement('a');
    a.href = 'data:audio/mp3;base64,' + allAudio[key];
    a.download = `ja_p${i+1}.mp3`;
    a.click();
    await new Promise(r => setTimeout(r, 200));
  }
}

function updateJaProgress() {
  const done = jaScripts.filter(p => allAudio[`ja-${p.id}`]).length;
  document.getElementById('ja-bar').style.width = (done / jaScripts.length * 100) + '%';
  document.getElementById('ja-label').textContent = `${done} / ${jaScripts.length} パート完了`;
  if (done === jaScripts.length) {
    document.getElementById('dl-all-ja').disabled = false;
    document.getElementById('ja-label').textContent = `✅ 日本語 全${jaScripts.length}パート完成！`;
  }
}

async function startAll() {
  const key = document.getElementById('apiKey').value.trim();
  if (!key) { alert('APIキーを入力してください'); return; }
  document.getElementById('start-all').disabled = true;
  otherDone = 0;
  let lastError = '';
  for (const lang of otherLangs) {
    const parts = otherScripts[lang];
    document.getElementById(`lang-status-${lang}`).textContent = '生成中...';
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      const badge = document.getElementById(`badge-${lang}-${p.id}`);
      badge.className = 'part-badge active';
      try {
        const b64 = await callTTS(langConfig[lang].langCode, langConfig[lang].voice, p.text, p.ssml);
        allAudio[`${lang}-${p.id}`] = b64;
        badge.className = 'part-badge done';
        badge.title = '✅ 生成済み（クリックで再生成）';
        otherDone++;
        document.getElementById('all-bar').style.width = (otherDone / OTHER_TOTAL * 100) + '%';
        document.getElementById('all-label').textContent = `生成中... (${otherDone} / ${OTHER_TOTAL})`;
      } catch(e) {
        badge.className = 'part-badge error';
        badge.title = e.message + '（クリックで再試行）';
        lastError = `${langConfig[lang].name} ${p.title}: ${e.message}`;
      }
      await new Promise(r => setTimeout(r, 300));
    }
    document.getElementById(`lang-status-${lang}`).textContent = '✅ 完了';
  }
  document.getElementById('all-label').textContent = lastError
    ? `⚠️ ${otherDone} / ${OTHER_TOTAL} 件成功。失敗あり（赤いバッジをクリックで再試行）。最後のエラー: ${lastError}`
    : `✅ 全${otherDone}ファイル生成完了！`;
  document.getElementById('start-all').disabled = false;
  document.getElementById('dl-all').disabled = false;
}

async function retryOtherPart(lang, id) {
  const parts = otherScripts[lang];
  const idx = parts.findIndex(p => p.id === id);
  if (idx === -1) return;
  const p = parts[idx];
  const badge = document.getElementById(`badge-${lang}-${id}`);
  badge.className = 'part-badge active';
  try {
    const b64 = await callTTS(langConfig[lang].langCode, langConfig[lang].voice, p.text, p.ssml);
    allAudio[`${lang}-${id}`] = b64;
    badge.className = 'part-badge done';
    badge.title = '✅ 生成済み（クリックで再生成）';
    document.getElementById('dl-all').disabled = false;
    const a = document.createElement('a');
    a.href = 'data:audio/mp3;base64,' + b64;
    a.download = `${lang}_p${idx+1}.mp3`;
    a.click();
  } catch(e) {
    badge.className = 'part-badge error';
    badge.title = e.message + '（クリックで再試行）';
    alert(`${langConfig[lang].name} ${p.title} の生成に失敗しました。

${e.message}`);
  }
}

async function downloadAll() {
  const langs = ['ja', ...otherLangs];
  const allScripts = { ja: jaScripts, ...otherScripts };
  for (const lang of langs) {
    const parts = allScripts[lang];
    for (let i = 0; i < parts.length; i++) {
      const key = `${lang}-${parts[i].id}`;
      if (!allAudio[key]) continue;
      const a = document.createElement('a');
      a.href = 'data:audio/mp3;base64,' + allAudio[key];
      a.download = `${lang}_p${i+1}.mp3`;
      a.click();
      await new Promise(r => setTimeout(r, 200));
    }
  }
}

initJaUI();
initOtherUI();
</script>
