    { id:'p1', title:"①まくら", ssml:false, text:"Laissez-moi vous raconter une histoire. Dans le commerce des antiquités, avoir l'œil est primordial. Selon qu'on sait repérer une perle rare ou non, on fait fortune ou on fait faillite, un métier plutôt impitoyable. Et pourtant, de temps en temps, quelqu'un tombe sur un coup de chance extraordinaire, par pure veine. Voici aujourd'hui l'histoire d'un tel homme, un antiquaire sans le moindre talent pour juger la qualité, mais béni d'une chance à revendre." },

    { id:'p2', title:"②汚い太鼓", ssml:false, text:"Había un hombre llamado Jinbei que tenía una tienda de antigüedades. La verdad es que el negocio iba fatal, no paraba de comprar chatarra sin ningún valor, y su esposa, Otaki, siempre lo regañaba por traer más basura sucia. Un día, a un vendedor ambulante de artículos usados que pasaba por la puerta, le compró, por casi nada, un viejo tambor cubierto de polvo. En cuanto Otaki lo vio, montó en cólera. Otaki: ¡Otra vez comprando cosas inútiles! Apenas podemos comprar arroz, ¿y crees que alguien va a comprar un tambor tan mugriento? Jinbei, bastante desanimado, respondió. Jinbei: Bueno, una vez que lo limpie, tal vez se vea presentable. Y se puso a limpiar el tambor frente a la tienda." },
    { id:'p3', title:"③殿様の行列", ssml:false, text:"Mientras Jinbei sacudía el polvo y frotaba con un paño, una comitiva señorial pasó justo por delante de la tienda. Uno de los samuráis del cortejo se detuvo de pronto, mirando fijamente el tambor frente a la tienda. El samurái: Esto es, me gustaría examinar ese tambor más de cerca. Se acercó con los ojos muy abiertos. Y en efecto, al mirarlo bien, resultó ser una pieza de una manufactura magnífica, un tambor verdaderamente raro, con una exquisita talla de llamas. El samurái: Esta debe ser precisamente la pieza que mi señor ha estado buscando. Llévalo a la mansión mañana. Y con eso, se marchó de vuelta con la comitiva." },
    { id:'p4', title:"④お屋敷に呼ばれて", ssml:false, text:"Al escuchar esto, Jinbei no se alegró en absoluto, en cambio, tembló de miedo. Jinbei: Debo de haber hecho algo mal, ¡seguro que van a cortarme la cabeza por esto! Corrió hacia Otaki, pálido como un fantasma, entre lágrimas. Otaki: ¿No habrás hecho alguna tontería, verdad? Ella también se preocupó, pero no había forma de evitarlo. Al día siguiente, Jinbei, temblando como una hoja, llevó el tambor hasta la mansión. Conducido a un gran salón donde esperaba un señor de porte imponente, Jinbei pegó la frente al tatami. Jinbei: Yo, le juro que no sabía nada! No hizo más que postrarse y disculparse una y otra vez." },
    { id:'p5', title:"⑤値段交渉", ssml:false, text:"Pero el señor, lejos de enojarse, estaba de excelente humor. El señor: Vaya pieza tan fina que tienes ahí. Esto se llama tambor de llamas, no existe otro igual en todo el reino. Fija tu precio. Jinbei casi se cae de la impresión. Tartamudeando y buscando las palabras, armó valor y dijo una cifra. Y para su total incredulidad, el trato se cerró así, sin más, por una suma muy superior a todo lo que Jinbei jamás hubiera imaginado. Pellizcándose la mejilla para comprobar que no soñaba, Jinbei se guardó la pequeña fortuna entre la ropa y volvió a casa con una sonrisa de oreja a oreja." },
    { id:'p6', title:"⑥女房豹変", ssml:false, text:"Cuando Jinbei llegó a casa y le contó a Otaki lo sucedido, toda su actitud cambió al instante. Como si nunca lo hubiera llamado un inútil apenas unas horas antes, exclamó efusivamente. Otaki: Vaya, vaya, no tenía idea de que tuvieras tan buen ojo para la calidad! Ese es mi marido, después de todo, un verdadero talento para los negocios. Un cambio tan radical que resultaba casi cómico. Jinbei, por supuesto, no se molestó en absoluto, y disfrutó encantado de los elogios." },
    { id:'p7', title:"⑦サゲ", ssml:false, text:"Bastante satisfecho de sí mismo, Jinbei se puso a contemplar fijamente el montón de trastos apilados en un rincón de su tienda. Jinbei: Oye, Otaki, ahora que lo pienso, quizás ese mortero mugriento, o ese brasero desportillado de allá, también podrían resultar ser tesoros increíbles. Desde la trastienda, Otaki, levantando una vieja taza polvorienta, dijo. Otaki: Pues entonces, ya que estamos, ¿por qué no llevas también a la mansión ese futón hecho jirones que anda tirado en el terreno baldío de al lado? Jinbei se rascó la cabeza, sin saber qué decir. Jinbei: No, no, me temo que ese no va a sonar tan bien como el tambor." }
  ]
};

const otherLangs = ['en','fr','es'];
const allAudio = {};
let otherDone = 0;
const OTHER_TOTAL = 21;

function initJaUI() {
  const container = document.getElementById('ja-parts');
  jaScripts.forEach((p, i) => {
    container.innerHTML += `
      <div class="part-row">
        <div class="part-title">${p.title}</div>
        <div>
          <div class="part-status" id="ja-status-${p.id}">未生成</div>
          <audio id="ja-audio-${p.id}"></audio>
        </div>
        <button class="btn btn-blue" onclick="generateJaPart(${i})">▶ 生成</button>
        <button class="btn btn-red" id="ja-play-${p.id}" onclick="playJaPart('${p.id}')" disabled>▷ 再生</button>
        <button class="btn btn-green" id="ja-dl-${p.id}" onclick="downloadJaPart(${i})" disabled>⬇ DL</button>
      </div>`;
  });
}

function initOtherUI() {
  const container = document.getElementById('lang-blocks');
  otherLangs.forEach(lang => {
    const parts = otherScripts[lang];
    const badges = parts.map(p => `<span class="part-badge" id="badge-${lang}-${p.id}" onclick="retryOtherPart('${lang}','${p.id}')" title="クリックで生成/再試行">${p.title}</span>`).join('');
    container.innerHTML += `
      <div class="lang-block">
        <div class="lang-title">${langConfig[lang].name} <span style="font-size:11px;color:#888;font-weight:normal;">${langConfig[lang].voice}</span></div>
        <div class="lang-progress">${badges}</div>
        <div class="lang-status" id="lang-status-${lang}">待機中</div>
      </div>`;
  });
}

async function callTTS(langCode, voiceName, text, isSSML) {
  const key = document.getElementById('apiKey').value.trim();
  if (!key) { throw new Error('APIキーが未入力です'); }
  const body = {
    input: isSSML ? { ssml: text } : { text },
    voice: { languageCode: langCode, name: voiceName },
    audioConfig: { audioEncoding: 'MP3' }
  };
  const res = await fetch(
    `https://texttospeech.googleapis.com/v1/text:synthesize?key=${key}`,
    { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
  );
  const data = await res.json();
  if (!data.audioContent) {
    const msg = (data.error && data.error.message) ? `[${data.error.status || res.status}] ${data.error.message}` : `HTTPエラー ${res.status}: ${JSON.stringify(data)}`;
    throw new Error(msg);
  }
  return data.audioContent;
}

async function generateJaPart(idx) {
  const p = jaScripts[idx];
  const status = document.getElementById(`ja-status-${p.id}`);
  status.textContent = '生成中...';
  status.className = 'part-status active';
  try {
    const b64 = await callTTS('ja-JP', 'ja-JP-Chirp3-HD-Charon', p.text, p.ssml);
    allAudio[`ja-${p.id}`] = b64;
    const audio = document.getElementById(`ja-audio-${p.id}`);
    audio.src = 'data:audio/mp3;base64,' + b64;
    status.textContent = '✅ 完成！';
    status.className = 'part-status done';
    document.getElementById(`ja-play-${p.id}`).disabled = false;
    document.getElementById(`ja-dl-${p.id}`).disabled = false;
    updateJaProgress();
  } catch (e) {
    status.textContent = '❌ ' + e.message;
    status.className = 'part-status error';
    status.title = e.message;
  }
}

function playJaPart(id) {
  document.getElementById(`ja-audio-${id}`).play();
}

function downloadJaPart(idx) {
  const p = jaScripts[idx];
  const key = `ja-${p.id}`;
  if (!allAudio[key]) return;
  const a = document.createElement('a');
  a.href = 'data:audio/mp3;base64,' + allAudio[key];
  a.download = `ja_p${idx+1}.mp3`;
  a.click();
}

async function generateAllJa() {
  for (let i = 0; i < jaScripts.length; i++) {
    await generateJaPart(i);
    await new Promise(r => setTimeout(r, 300));
  }
}

async function downloadAllJa() {
  for (let i = 0; i < jaScripts.length; i++) {
    const key = `ja-${jaScripts[i].id}`;
    if (!allAudio[key]) continue;
    const a = document.createElement('a');
    a.href = 'data:audio/mp3;base64,' + allAudio[key];
    a.download = `ja_p${i+1}.mp3`;
    a.click();
    await new Promise(r => setTimeout(r, 200));
  }
}

function updateJaProgress() {
  const done = jaScripts.filter(p => allAudio[`ja-${p.id}`]).length;
  document.getElementById('ja-bar').style.width = (done / jaScripts.length * 100) + '%';
  document.getElementById('ja-label').textContent = `${done} / ${jaScripts.length} パート完了`;
  if (done === jaScripts.length) {
    document.getElementById('dl-all-ja').disabled = false;
    document.getElementById('ja-label').textContent = `✅ 日本語 全${jaScripts.length}パート完成！`;
  }
}

async function startAll() {
  const key = document.getElementById('apiKey').value.trim();
  if (!key) { alert('APIキーを入力してください'); return; }
  document.getElementById('start-all').disabled = true;
  otherDone = 0;
  let lastError = '';
  for (const lang of otherLangs) {
    const parts = otherScripts[lang];
    document.getElementById(`lang-status-${lang}`).textContent = '生成中...';
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      const badge = document.getElementById(`badge-${lang}-${p.id}`);
      badge.className = 'part-badge active';
      try {
        const b64 = await callTTS(langConfig[lang].langCode, langConfig[lang].voice, p.text, p.ssml);
        allAudio[`${lang}-${p.id}`] = b64;
        badge.className = 'part-badge done';
        badge.title = '✅ 生成済み（クリックで再生成）';
        otherDone++;
        document.getElementById('all-bar').style.width = (otherDone / OTHER_TOTAL * 100) + '%';
        document.getElementById('all-label').textContent = `生成中... (${otherDone} / ${OTHER_TOTAL})`;
      } catch(e) {
        badge.className = 'part-badge error';
        badge.title = e.message + '（クリックで再試行）';
        lastError = `${langConfig[lang].name} ${p.title}: ${e.message}`;
      }
      await new Promise(r => setTimeout(r, 300));
    }
    document.getElementById(`lang-status-${lang}`).textContent = '✅ 完了';
  }
  document.getElementById('all-label').textContent = lastError
    ? `⚠️ ${otherDone} / ${OTHER_TOTAL} 件成功。失敗あり（赤いバッジをクリックで再試行）。最後のエラー: ${lastError}`
    : `✅ 全${otherDone}ファイル生成完了！`;
  document.getElementById('start-all').disabled = false;
  document.getElementById('dl-all').disabled = false;
}

async function retryOtherPart(lang, id) {
  const parts = otherScripts[lang];
  const idx = parts.findIndex(p => p.id === id);
  if (idx === -1) return;
  const p = parts[idx];
  const badge = document.getElementById(`badge-${lang}-${id}`);
  badge.className = 'part-badge active';
  try {
    const b64 = await callTTS(langConfig[lang].langCode, langConfig[lang].voice, p.text, p.ssml);
    allAudio[`${lang}-${id}`] = b64;
    badge.className = 'part-badge done';
    badge.title = '✅ 生成済み（クリックで再生成）';
    document.getElementById('dl-all').disabled = false;
    const a = document.createElement('a');
    a.href = 'data:audio/mp3;base64,' + b64;
    a.download = `${lang}_p${idx+1}.mp3`;
    a.click();
  } catch(e) {
    badge.className = 'part-badge error';
    badge.title = e.message + '（クリックで再試行）';
    alert(`${langConfig[lang].name} ${p.title} の生成に失敗しました。

${e.message}`);
  }
}

async function downloadAll() {
  const langs = ['ja', ...otherLangs];
  const allScripts = { ja: jaScripts, ...otherScripts };
  for (const lang of langs) {
    const parts = allScripts[lang];
    for (let i = 0; i < parts.length; i++) {
      const key = `${lang}-${parts[i].id}`;
      if (!allAudio[key]) continue;
      const a = document.createElement('a');
      a.href = 'data:audio/mp3;base64,' + allAudio[key];
      a.download = `${lang}_p${i+1}.mp3`;
      a.click();
      await new Promise(r => setTimeout(r, 200));
    }
  }
}

initJaUI();
initOtherUI();
</script>
