const jaScripts = [
  { id:'p1', title:"①まくら", ssml:true, text:"<speak><prosody rate='103%' pitch='0st'>え〜、よく「子は鎹」なんて申しますが、これはどんなに夫婦の仲がこじれてしまっても、間に子供が一人いるだけで、また元通りに結びつくことがある、という意味の言葉でございます。<break time='500ms'/>今日はそんな、酒と女に溺れてしまった一人の職人が、我が子のおかげで、もう一度やり直すことになる、そんな人情噺を一席申し上げます。<break time='700ms'/></prosody></speak>" },
  { id:'p2', title:"②熊五郎の乱れ", ssml:true, text:"<speak><prosody rate='108%' pitch='0st'>腕はいいが酒癖の悪い大工がおりました。名を熊五郎と申します。<break time='400ms'/>女房のお徳との間には、亀吉という五つになる可愛い息子がおりまして、貧しいながらも仲睦まじく暮らしておりました。<break time='500ms'/>ところがこの熊五郎、ある時から夜な夜な飲み歩くようになり、そのうち近所の酌婦とねんごろになってしまいます。<break time='400ms'/>仕事にも身が入らず、稼いだ金はすっかり女のところへ。家に帰れば、お徳や亀吉に当たり散らす始末でございます。<break time='500ms'/></prosody><prosody rate='100%' pitch='+1st'>おまえさん、いい加減にしておくれよ。亀吉がどれだけ寂しい思いをしてるか<break time='400ms'/></prosody><prosody rate='118%' pitch='-2st'>うるせえ、亭主のやることに口を出すんじゃねえ<break time='600ms'/></prosody></speak>" },
  { id:'p3', title:"③お徳の決意", ssml:true, text:"<speak><prosody rate='105%' pitch='0st'>そんな日が続いたある晩、熊五郎は酔った勢いで、とうとうお徳に手を上げてしまいました。それを見た亀吉が、火がついたように泣き出します。<break time='500ms'/>お徳はその夜、じっと考えた末に、心を決めました。<break time='500ms'/></prosody><prosody rate='95%' pitch='0st'>おまえさんとは、もうやっていけません。亀吉と二人で、出て行かせてもらいます<break time='500ms'/></prosody><prosody rate='115%' pitch='-1st'>な、何を言い出すんだ。お前ら、俺なしでどうやって食っていくんだ<break time='400ms'/></prosody><prosody rate='95%' pitch='0st'>亀吉の手を引いて、どんなに苦労しようと、こんな暮らしを続けるよりよほどましです<break time='500ms'/></prosody><prosody rate='103%' pitch='0st'>お徳は亀吉の手を引いて、その日のうちに家を出てしまいました。長屋の連中も、みな陰でお徳に同情したということでございます。<break time='700ms'/></prosody></speak>" },
  { id:'p4', title:"④独りぼっちの後悔", ssml:true, text:"<speak><prosody rate='100%' pitch='-1st'>女房子供に出て行かれた熊五郎、はじめのうちは強がっておりましたが、独りぼっちの部屋に帰るたび、亀吉の小さな下駄が置いてあった場所や、お徳の作った味噌汁の匂いを思い出しては、涙がこぼれる始末。<break time='500ms'/>仕事も手につかず、酒はますます増えるばかり。<break time='500ms'/>しかしある朝、二日酔いの頭で鏡を覗き込んだ熊五郎は、やつれ果てた自分の顔にはっといたしました。<break time='500ms'/></prosody><prosody rate='85%' pitch='-2st'>俺は一体、何をやっているんだ<break time='500ms'/></prosody><prosody rate='102%' pitch='0st'>その日を境に、熊五郎はぴたりと酒をやめ、大工道具を取り出して、もう一度真面目に仕事へ向かうようになったのでございます。<break time='700ms'/></prosody></speak>" },
  { id:'p5', title:"⑤腕を取り戻して", ssml:true, text:"<speak><prosody rate='105%' pitch='0st'>それから三年の月日が流れました。熊五郎はすっかり酒を断ち、真面目に仕事に打ち込んだおかげで、以前にも増して腕のいい大工として評判を取り戻しておりました。<break time='400ms'/>棟梁からも頼りにされ、近頃では弟子まで持つようになったと申します。<break time='400ms'/>しかし、心の中には、いつもお徳と亀吉のことがございました。<break time='500ms'/></prosody><prosody rate='90%' pitch='-1st'>あいつらは今頃、どうしているだろうか。せめて亀吉だけでも、一目会いたいもんだ<break time='500ms'/></prosody><prosody rate='98%' pitch='0st'>そんなことを思いながら、独り身の熊五郎は、真面目に、しかしどこか寂しく、日々を過ごしておりました。<break time='700ms'/></prosody></speak>" },
  { id:'p6', title:"⑥亀吉との再会", ssml:true, text:"<speak><prosody rate='105%' pitch='0st'>ある日のこと、仕事の帰り道、熊五郎はふと、あるお店の前で凧を売っている一人の男の子に目を留めました。よく見れば、その顔立ち、背格好、どこか見覚えがある。<break time='500ms'/>おそるおそる声をかけてみますと、<break time='300ms'/></prosody><prosody rate='95%' pitch='0st'>坊主、お前さん、名は何てんだい<break time='400ms'/></prosody><prosody rate='105%' pitch='+2st'>亀吉って言います<break time='400ms'/></prosody><prosody rate='100%' pitch='0st'>熊五郎は心の臓が飛び出るかと思うほど驚きました。目の前にいるのは、紛れもなく我が子、あの亀吉でございます。三年前は五つだった子が、もう八つ、すっかり大きくなっておりました。<break time='500ms'/>熊五郎は込み上げる想いを抑えながら、そっと尋ねます。<break time='400ms'/></prosody><prosody rate='90%' pitch='-1st'>お前、母ちゃんは元気にしているかい<break time='400ms'/></prosody><prosody rate='108%' pitch='+2st'>うん、元気だよ。おいら、お店の手伝いをしてるんだ<break time='600ms'/></prosody></speak>" },
  { id:'p7', title:"⑦小遣いと言い付け", ssml:true, text:"<speak><prosody rate='100%' pitch='0st'>熊五郎は懐から財布を取り出し、有り金をそっくり亀吉の手に握らせました。<break time='400ms'/></prosody><prosody rate='90%' pitch='-1st'>これで何か美味い物でも買いな。母ちゃんにも、何か買ってあげるといい<break time='400ms'/></prosody><prosody rate='112%' pitch='+2st'>え、こんなに。おじさん、誰なの<break time='400ms'/></prosody><prosody rate='85%' pitch='-1st'>誰でもいいさ。ただな、坊主、このことは母ちゃんに黙っといておくれ。誰にもらったとか、そういうのは、言わなくていいから<break time='500ms'/></prosody><prosody rate='102%' pitch='0st'>亀吉は不思議そうな顔をしながらも、ぺこりと頭を下げて、嬉しそうに駆けていきました。<break time='400ms'/></prosody><prosody rate='85%' pitch='-1st'>熊五郎はその後ろ姿をいつまでも見送りながら、込み上げる涙を拭ったのでございます。<break time='700ms'/></prosody></speak>" },
  { id:'p8', title:"⑧母への告白と再会", ssml:true, text:"<speak><prosody rate='108%' pitch='+1st'>家に帰った亀吉は、大喜びで、もらったばかりの小遣いをお徳の前にどさりと出しました。<break time='400ms'/></prosody><prosody rate='115%' pitch='+2st'>母ちゃん、見て。これでうまい物、買おう<break time='400ms'/></prosody><prosody rate='100%' pitch='0st'>まあ、大変なお金じゃないか。一体誰にもらったんだい<break time='400ms'/></prosody><prosody rate='105%' pitch='+1st'>それが、言っちゃいけないって言われたんだけど……なんだか、おいらのこと、じっと見て、優しい声で母ちゃんは元気かって聞いてきたんだ<break time='500ms'/></prosody><prosody rate='95%' pitch='0st'>その様子を聞くうちに、お徳の胸に、ある予感がよぎりました。目の色、声の調子、それはまさしく、忘れもしない熊五郎のものでございます。<break time='500ms'/>お徳の目から、堪えきれない涙がほろほろとこぼれ落ちました。<break time='600ms'/></prosody><prosody rate='90%' pitch='0st'>亀吉、その人にもう一度会ったら、教えておくれ。母ちゃんも、会いたいと伝えておくれ<break time='500ms'/></prosody><prosody rate='98%' pitch='0st'>数日後、亀吉に連れられて、熊五郎はとうとうお徳と顔を合わせることになりました。三年ぶりに向き合った二人は、しばらく何も言えず、ただ黙って涙を流すばかり。<break time='500ms'/>それを見た亀吉は、きょとんとしながらも、なんだか嬉しそうに、二人の間を行ったり来たりしております。<break time='500ms'/></prosody><prosody rate='85%' pitch='-1st'>すまなかった。もう一度、やり直させてくれないか<break time='500ms'/></prosody><prosody rate='90%' pitch='+1st'>亀吉のためにも……ええ、やり直しましょう<break time='600ms'/></prosody><prosody rate='95%' pitch='0st'>かくして、鎹となった一人の子供のおかげで、離れ離れになっていた親子三人は、めでたく元の鞘に収まったのでございます。<break time='800ms'/></prosody></speak>" }
];

const otherScripts = {
  'en': [
    { id:'p1', title:"①まくら", ssml:false, text:"Well now, there’s a saying, ‘a child is the clamp that holds a family together.’ It means that no matter how badly a marriage falls apart, having just one child between a couple can sometimes bring them back together again. Today I’ll tell you a heartfelt human-interest tale about a craftsman who fell into drink and another woman’s arms, only to be given a second chance thanks to his own son." },
    { id:'p2', title:"②熊五郎の乱れ", ssml:false, text:"There once was a carpenter, skilled with his hands but cursed with a weakness for drink. His name was Kumagoro. He and his wife Otoku had a sweet little five-year-old son named Kamekichi, and though poor, the family lived happily together. But at some point, Kumagoro took to drinking every single night, and before long he grew intimate with a barmaid from the neighborhood. He stopped putting his heart into his work, and whatever money he earned went straight to the woman. When he did come home, he took it out on Otoku and Kamekichi. Otoku: “Won’t you please stop this? Do you have any idea how lonely Kamekichi feels?” Kumagoro: “Shut up. Don’t go poking your nose into a husband’s business.”" },
    { id:'p3', title:"③お徳の決意", ssml:false, text:"One night, after this had gone on for some time, Kumagoro, drunk, finally raised his hand against Otoku. Seeing this, little Kamekichi burst into tears as if something inside him had caught fire. That night, after much silent thought, Otoku made up her mind. Otoku: “I can’t go on with you any longer. Kamekichi and I are leaving.” Kumagoro: “Wh-what are you saying? How are the two of you going to eat without me?” Otoku: “However hard it may be, taking Kamekichi’s hand and struggling on our own is far better than continuing this life.” Otoku took Kamekichi by the hand and left the house that very day. It’s said that everyone in the tenement quietly sympathized with her." },
    { id:'p4', title:"④独りぼっちの後悔", ssml:false, text:"Once his wife and child were gone, Kumagoro at first put on a brave face, but every time he came home to his empty room, the sight of where Kamekichi’s little sandals used to sit, or the remembered smell of Otoku’s miso soup, would bring tears to his eyes. He couldn’t focus on his work, and his drinking only grew worse. But one morning, looking into the mirror with a pounding hangover, Kumagoro was struck by the sight of his own haggard face. Kumagoro: “What in the world am I doing…” From that day on, he quit drinking cold turkey, took his carpentry tools back out, and began working seriously once again." },
    { id:'p5', title:"⑤腕を取り戻して", ssml:false, text:"Three years passed. Having sworn off drink completely and thrown himself into honest work, Kumagoro had regained his reputation as an even better carpenter than before. His master craftsman relied on him, and it’s said he’d even taken on an apprentice of his own by then. But in his heart, Otoku and Kamekichi were never far from his thoughts. Kumagoro: “I wonder how those two are getting along these days. If only I could see Kamekichi, just once…” Thinking such thoughts, Kumagoro, still living alone, passed his days honestly, if with a quiet loneliness that never quite left him." },
    { id:'p6', title:"⑥亀吉との再会", ssml:false, text:"One day, on his way home from work, Kumagoro’s eye happened to land on a young boy selling kites in front of a shop. Looking closer — that face, that build — something about him seemed familiar. Hesitantly, he called out. Kumagoro: “Hey there, kid. What’s your name?” Boy: “I’m Kamekichi.” Kumagoro’s heart nearly leapt out of his chest. Standing before him was, without question, his own son — that very Kamekichi. The boy who had been five three years ago was now eight, and quite grown. Holding back the surge of emotion welling up inside him, Kumagoro asked gently. Kumagoro: “Is your mother doing well?” Kamekichi: “Yeah, she’s fine. I help out at a shop now.”" },
    { id:'p7', title:"⑦小遣いと言い付け", ssml:false, text:"Kumagoro pulled out his wallet and pressed every bit of money he had into Kamekichi’s hand. Kumagoro: “Here — buy yourself something good to eat with this. And get something nice for your mother too.” Kamekichi: “Whoa, this much? Mister, who are you?” Kumagoro: “Doesn’t matter who I am. But listen, kid — don’t tell your mother about this, alright? You don’t need to say who gave it to you or anything like that.” Kamekichi, looking a little puzzled, bowed his head politely and ran off happily. Kumagoro stood there watching his son’s small back for a long while, wiping away the tears that welled up in his eyes." },
    { id:'p8', title:"⑧母への告白と再会", ssml:false, text:"When Kamekichi got home, overjoyed, he dumped the money he’d just been given right in front of Otoku. Kamekichi: “Mom, look! Let’s buy something delicious with this!” Otoku: “Goodness, that’s an awful lot of money. Just who gave you this?” Kamekichi: “Well, he told me not to say… but he looked at me for the longest time, and then asked, real gently, whether Mom was doing well.” As she listened, a certain feeling began to stir in Otoku’s chest. That look in his eyes, that tone of voice — it was unmistakably Kumagoro’s, the man she could never quite forget. Tears she could no longer hold back spilled from Otoku’s eyes. Otoku: “Kamekichi, if you see that person again, let me know. Tell him… tell him your mother would like to see him too.” A few days later, led by Kamekichi, Kumagoro finally came face to face with Otoku again. Standing before each other for the first time in three years, neither could speak for a long while — they simply stood in silence, tears falling. Watching this, Kamekichi, looking a little bewildered but somehow happy, kept glancing back and forth between the two of them. Kumagoro: “I’m sorry. Would you let me try again, one more time?” Otoku: “For Kamekichi’s sake too… yes. Let’s start over.” And so, thanks to the one small child who had become their clamp, the three members of that separated family were happily reunited, back where they belonged." }

  'fr': [
    { id:'p1', title:"①まくら", ssml:false, text:"Eh bien, on dit souvent qu’« un enfant est l’agrafe qui tient une famille ensemble ». Cela signifie que, peu importe à quel point un mariage se brise, un seul enfant entre deux époux peut parfois les réunir à nouveau. Aujourd’hui, je vais vous conter une histoire humaine et touchante, celle d’un artisan tombé dans la boisson et dans les bras d’une autre femme, à qui son propre fils offrira une seconde chance." },
    { id:'p2', title:"②熊五郎の乱れ", ssml:false, text:"Il était une fois un charpentier, habile de ses mains mais maudit par un penchant pour la boisson. Il s’appelait Kumagoro. Lui et sa femme Otoku avaient un doux petit garçon de cinq ans nommé Kamekichi, et bien que pauvre, la famille vivait heureuse. Mais à un moment donné, Kumagoro se mit à boire chaque soir, et bientôt il se lia intimement avec une serveuse du quartier. Il cessa de mettre du cœur à l’ouvrage, et le peu d’argent qu’il gagnait filait tout droit chez cette femme. Quand il rentrait, c’est sur Otoku et Kamekichi qu’il passait ses nerfs. Otoku : « Tu ne veux pas arrêter, s’il te plaît ? Sais-tu seulement à quel point Kamekichi se sent seul ? » Kumagoro : « Tais-toi. Ne te mêle pas des affaires d’un mari. »" },
    { id:'p3', title:"③お徳の決意", ssml:false, text:"Un soir, après que cela eut duré un certain temps, Kumagoro, ivre, finit par lever la main sur Otoku. En voyant cela, le petit Kamekichi éclata en sanglots comme si quelque chose s’était enflammé en lui. Cette nuit-là, après une longue réflexion silencieuse, Otoku prit sa décision. Otoku : « Je ne peux plus continuer avec toi. Kamekichi et moi, nous partons. » Kumagoro : « Qu... qu’est-ce que tu racontes ? Comment allez-vous manger sans moi ? » Otoku : « Aussi difficile que ce soit, prendre la main de Kamekichi et nous débrouiller seuls vaut bien mieux que de continuer cette vie. » Otoku prit Kamekichi par la main et quitta la maison ce jour-là même. On dit que tous les habitants de l’immeuble compatissaient discrètement avec elle." },

    { id:'p5', title:"⑤腕を取り戻して", ssml:false, text:"Pasaron tres años. Habiendo dejado por completo la bebida y entregándose a un trabajo honesto, Kumagoro había recuperado su reputación como un carpintero aún mejor que antes. Su maestro artesano confiaba en él, y se dice que incluso había tomado un aprendiz propio. Pero en su corazón, Otoku y Kamekichi nunca estaban lejos de sus pensamientos. Kumagoro: «Me pregunto cómo estarán esos dos por estos días. Si al menos pudiera ver a Kamekichi, aunque fuera una vez…» Pensando así, Kumagoro, todavía solo, pasaba sus días con honestidad, aunque con una soledad callada que nunca lo abandonaba del todo." },
    { id:'p6', title:"⑥亀吉との再会", ssml:false, text:"Un día, de camino a casa desde el trabajo, la mirada de Kumagoro se posó en un niño que vendía cometas frente a una tienda. Mirando más de cerca, ese rostro, esa complexión, algo le resultaba familiar. Vacilante, lo llamó. Kumagoro: «Oye, muchacho. ¿Cómo te llamas?» Niño: «Me llamo Kamekichi.» El corazón de Kumagoro casi se le sale del pecho. El que estaba frente a él era, sin duda alguna, su propio hijo, ese mismo Kamekichi. El niño que tenía cinco años tres años atrás ahora tenía ocho, y había crecido bastante. Conteniendo la ola de emoción que crecía dentro de él, Kumagoro preguntó con suavidad. Kumagoro: «¿Tu madre está bien?» Kamekichi: «Sí, está bien. Ahora ayudo en una tienda.»" },

const otherLangs = ['en','fr','es'];
const allAudio = {};
let otherDone = 0;
const OTHER_TOTAL = 24;

function initJaUI() {
  const container = document.getElementById('ja-parts');
  jaScripts.forEach((p, i) => {
    container.innerHTML += `
      <div class="part-row">
        <div class="part-title">${p.title}</div>
        <div>
          <div class="part-status" id="ja-status-${p.id}">未生成</div>
          <audio id="ja-audio-${p.id}"></audio>
        </div>
        <button class="btn btn-blue" onclick="generateJaPart(${i})">▶ 生成</button>
        <button class="btn btn-red" id="ja-play-${p.id}" onclick="playJaPart('${p.id}')" disabled>▷ 再生</button>
        <button class="btn btn-green" id="ja-dl-${p.id}" onclick="downloadJaPart(${i})" disabled>⬇ DL</button>
      </div>`;
  });
}

function initOtherUI() {
  const container = document.getElementById('lang-blocks');
  otherLangs.forEach(lang => {
    const parts = otherScripts[lang];
    const badges = parts.map(p => `<span class="part-badge" id="badge-${lang}-${p.id}" onclick="retryOtherPart('${lang}','${p.id}')" title="クリックで生成/再試行">${p.title}</span>`).join('');
    container.innerHTML += `
      <div class="lang-block">
        <div class="lang-title">${langConfig[lang].name} <span style="font-size:11px;color:#888;font-weight:normal;">${langConfig[lang].voice}</span></div>
        <div class="lang-progress">${badges}</div>
        <div class="lang-status" id="lang-status-${lang}">待機中</div>
      </div>`;
  });
}

async function callTTS(langCode, voiceName, text, isSSML) {
  const key = document.getElementById('apiKey').value.trim();
  if (!key) { throw new Error('APIキーが未入力です'); }
  const body = {
    input: isSSML ? { ssml: text } : { text },
    voice: { languageCode: langCode, name: voiceName },
    audioConfig: { audioEncoding: 'MP3' }
  };
  const res = await fetch(
    `https://texttospeech.googleapis.com/v1/text:synthesize?key=${key}`,
    { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
  );
  const data = await res.json();
  if (!data.audioContent) {
    const msg = (data.error && data.error.message) ? `[${data.error.status || res.status}] ${data.error.message}` : `HTTPエラー ${res.status}: ${JSON.stringify(data)}`;
    throw new Error(msg);
  }
  return data.audioContent;
}

async function generateJaPart(idx) {
  const p = jaScripts[idx];
  const status = document.getElementById(`ja-status-${p.id}`);
  status.textContent = '生成中...';
  status.className = 'part-status active';
  try {
    const b64 = await callTTS('ja-JP', 'ja-JP-Chirp3-HD-Charon', p.text, p.ssml);
    allAudio[`ja-${p.id}`] = b64;
    const audio = document.getElementById(`ja-audio-${p.id}`);
    audio.src = 'data:audio/mp3;base64,' + b64;
    status.textContent = '✅ 完成！';
    status.className = 'part-status done';
    document.getElementById(`ja-play-${p.id}`).disabled = false;
    document.getElementById(`ja-dl-${p.id}`).disabled = false;
    updateJaProgress();
  } catch (e) {
    status.textContent = '❌ ' + e.message;
    status.className = 'part-status error';
    status.title = e.message;
  }
}

function playJaPart(id) {
  document.getElementById(`ja-audio-${id}`).play();
}

function downloadJaPart(idx) {
  const p = jaScripts[idx];
  const key = `ja-${p.id}`;
  if (!allAudio[key]) return;
  const a = document.createElement('a');
  a.href = 'data:audio/mp3;base64,' + allAudio[key];
  a.download = `ja_p${idx+1}.mp3`;
  a.click();
}

async function generateAllJa() {
  for (let i = 0; i < jaScripts.length; i++) {
    await generateJaPart(i);
    await new Promise(r => setTimeout(r, 300));
  }
}

async function downloadAllJa() {
  for (let i = 0; i < jaScripts.length; i++) {
    const key = `ja-${jaScripts[i].id}`;
    if (!allAudio[key]) continue;
    const a = document.createElement('a');
    a.href = 'data:audio/mp3;base64,' + allAudio[key];
    a.download = `ja_p${i+1}.mp3`;
    a.click();
    await new Promise(r => setTimeout(r, 200));
  }
}

function updateJaProgress() {
  const done = jaScripts.filter(p => allAudio[`ja-${p.id}`]).length;
  document.getElementById('ja-bar').style.width = (done / jaScripts.length * 100) + '%';
  document.getElementById('ja-label').textContent = `${done} / ${jaScripts.length} パート完了`;
  if (done === jaScripts.length) {
    document.getElementById('dl-all-ja').disabled = false;
    document.getElementById('ja-label').textContent = `✅ 日本語 全${jaScripts.length}パート完成！`;
  }
}

async function startAll() {
  const key = document.getElementById('apiKey').value.trim();
  if (!key) { alert('APIキーを入力してください'); return; }
  document.getElementById('start-all').disabled = true;
  otherDone = 0;
  let lastError = '';
  for (const lang of otherLangs) {
    const parts = otherScripts[lang];
    document.getElementById(`lang-status-${lang}`).textContent = '生成中...';
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      const badge = document.getElementById(`badge-${lang}-${p.id}`);
      badge.className = 'part-badge active';
      try {
        const b64 = await callTTS(langConfig[lang].langCode, langConfig[lang].voice, p.text, p.ssml);
        allAudio[`${lang}-${p.id}`] = b64;
        badge.className = 'part-badge done';
        badge.title = '✅ 生成済み（クリックで再生成）';
        otherDone++;
        document.getElementById('all-bar').style.width = (otherDone / OTHER_TOTAL * 100) + '%';
        document.getElementById('all-label').textContent = `生成中... (${otherDone} / ${OTHER_TOTAL})`;
      } catch(e) {
        badge.className = 'part-badge error';
        badge.title = e.message + '（クリックで再試行）';
        lastError = `${langConfig[lang].name} ${p.title}: ${e.message}`;
      }
      await new Promise(r => setTimeout(r, 300));
    }
    document.getElementById(`lang-status-${lang}`).textContent = '✅ 完了';
  }
  document.getElementById('all-label').textContent = lastError
    ? `⚠️ ${otherDone} / ${OTHER_TOTAL} 件成功。失敗あり（赤いバッジをクリックで再試行）。最後のエラー: ${lastError}`
    : `✅ 全${otherDone}ファイル生成完了！`;
  document.getElementById('start-all').disabled = false;
  document.getElementById('dl-all').disabled = false;
}

async function retryOtherPart(lang, id) {
  const parts = otherScripts[lang];
  const idx = parts.findIndex(p => p.id === id);
  if (idx === -1) return;
  const p = parts[idx];
  const badge = document.getElementById(`badge-${lang}-${id}`);
  badge.className = 'part-badge active';
  try {
    const b64 = await callTTS(langConfig[lang].langCode, langConfig[lang].voice, p.text, p.ssml);
    allAudio[`${lang}-${id}`] = b64;
    badge.className = 'part-badge done';
    badge.title = '✅ 生成済み（クリックで再生成）';
    document.getElementById('dl-all').disabled = false;
    const a = document.createElement('a');
    a.href = 'data:audio/mp3;base64,' + b64;
    a.download = `${lang}_p${idx+1}.mp3`;
    a.click();
  } catch(e) {
    badge.className = 'part-badge error';
    badge.title = e.message + '（クリックで再試行）';
    alert(`${langConfig[lang].name} ${p.title} の生成に失敗しました。

${e.message}`);
  }
}

async function downloadAll() {
  const langs = ['ja', ...otherLangs];
  const allScripts = { ja: jaScripts, ...otherScripts };
  for (const lang of langs) {
    const parts = allScripts[lang];
    for (let i = 0; i < parts.length; i++) {
      const key = `${lang}-${parts[i].id}`;
      if (!allAudio[key]) continue;
      const a = document.createElement('a');
      a.href = 'data:audio/mp3;base64,' + allAudio[key];
      a.download = `${lang}_p${i+1}.mp3`;
      a.click();
      await new Promise(r => setTimeout(r, 200));
    }
  }
}

initJaUI();
initOtherUI();
</script>
