  { id:'p2', title:"②和尚さんへ相談", ssml:true, text:"<speak><prosody rate=\"105%\" pitch=\"0st\">さる長屋に、待ちに待った男の子が生まれましてね。父親は嬉しくて嬉しくて、いい名前を付けてやろうと、近所の和尚さんのところへ飛んでいきました。<break time=\"500ms\"/></prosody><prosody rate=\"120%\" pitch=\"+1st\">和尚さん、和尚さん、ゆんべ、にょうぼうが男の子を産みましてね、何か縁起のいい名前を付けてやりたいんで、一つ考えちゃもらえませんか。<break time=\"400ms\"/></prosody><prosody rate=\"90%\" pitch=\"-2st\">そりゃあおめでたい。よし、それなら一緒に考えてやろう。<break time=\"400ms\"/></prosody><prosody rate=\"105%\" pitch=\"0st\">てんで、二人して頭をひねり始めました。<break time=\"600ms\"/></prosody></speak>" },
  { id:'p3', title:"③候補が次々と", ssml:true, text:"<speak><prosody rate=\"90%\" pitch=\"-2st\">まず寿限無、というのはどうだ。寿命に限りが無い、つまり長生きするというめでたい意味だ。<break time=\"400ms\"/></prosody><prosody rate=\"115%\" pitch=\"+1st\">そりゃあいい、それにしましょう。<break time=\"400ms\"/></prosody><prosody rate=\"90%\" pitch=\"-2st\">いや待て、五劫の擦り切れ、というのもある。天女が三千年に一度、羽衣で岩をなでて、その岩が擦り切れてなくなるほどの、気の遠くなるようなとしつきという意味だ。<break time=\"400ms\"/></prosody><prosody rate=\"115%\" pitch=\"+1st\">おお、それもめでたい、それも付けましょう。<break time=\"400ms\"/></prosody><prosody rate=\"90%\" pitch=\"-2st\">まだあるぞ。海砂利水魚、すいぎょうまつ雲来末風来末、これは水や雲や風のように尽きることのない、という意味合いだ。<break time=\"400ms\"/></prosody><prosody rate=\"115%\" pitch=\"+1st\">そりゃもう、どれも捨てがたい、みんなめでたい、みんな気に入りました。<break time=\"600ms\"/></prosody></speak>" },

  { id:'p5', title:"⑤大きくなって", ssml:true, text:"<speak><prosody rate=\"108%\" pitch=\"0st\">さて、その寿限無くんも大きくなりまして、近所の子供たちと遊ぶようになりました。<break time=\"400ms\"/>ところがこの名前が長いもんだから、呼ぶのもひとくろうで。<break time=\"500ms\"/>ある日のこと、寿限無くんが友達の頭を、棒っきれでポカーンと殴っちまいましてね、その友達、たんこぶをこさえて大泣き。<break time=\"400ms\"/>泣かされた子の親が、寿限無くんの家まで怒鳴り込んで来たまではよかったんですが。<break time=\"600ms\"/></prosody></speak>" },
  { id:'p6', title:"⑥サゲ", ssml:true, text:"<speak><prosody rate=\"120%\" pitch=\"-1st\">おい、寿限無<break time=\"200ms\"/>寿限無、五劫の擦り切れ、海砂利水魚の、すいぎょうまつ雲来末風来末。<break time=\"150ms\"/>くうねるところにすむところ、藪柑子の藪柑子、パイポパイポ、パイポのシューリンガン、シューリンガンのグーリンダイ、グーリンダイのポンポコピーのポンポコナーの、長久命の長助のバカ野郎！うちの子供を、なんてぇことしてくれたんだ！<break time=\"400ms\"/></prosody><prosody rate=\"95%\" pitch=\"-2st\">まあまあ、そう怒らずに。一体うちの寿限無<break time=\"200ms\"/>寿限無、五劫の擦り切れ、海砂利水魚の、すいぎょうまつ雲来末風来末。<break time=\"150ms\"/>くうねるところにすむところ、藪柑子の藪柑子、パイポパイポ、パイポのシューリンガン、シューリンガンのグーリンダイ、グーリンダイのポンポコピーのポンポコナーの、長久命の長助が、何をしたんです？<break time=\"400ms\"/></prosody><prosody rate=\"120%\" pitch=\"-1st\">それが、寿限無<break time=\"200ms\"/>寿限無、五劫の擦り切れ、海砂利水魚の、すいぎょうまつ雲来末風来末。<break time=\"150ms\"/>くうねるところにすむところ、藪柑子の藪柑子、パイポパイポ、パイポのシューリンガン、シューリンガンのグーリンダイ、グーリンダイのポンポコピーのポンポコナーの、長久命の長助が、うちの子の頭を棒で殴りやがって、たんこぶが……<break time=\"500ms\"/></prosody><prosody rate=\"105%\" pitch=\"0st\">と、そこまで名前を言い続けているうちに、あんまり時間がかかったもんですから。<break time=\"500ms\"/></prosody><prosody rate=\"110%\" pitch=\"+1st\">あれ？そういやたんこぶ、もう引っ込んじまったな。<break time=\"700ms\"/></prosody><prosody rate=\"100%\" pitch=\"0st\">名前が長すぎたおかげで、たんこぶの方がすっかり治っちまった、というのがこのお噺の落ちでございます。<break time=\"800ms\"/></prosody></speak>" }

  'en': [
    { id:'p1', title:"①まくら", ssml:false, text:"Let me tell you a story. Since ancient times, a child's name has been a matter of the utmost importance to a parent. \"May this child grow up strong and fine\" — that greedy hope, wanting every good blessing at once, is simply what it means to be a parent. Today I'd like to share with you a delightfully silly tale about just such a name." },
    { id:'p2', title:"②和尚さんへ相談", ssml:false, text:"In a certain tenement, a long-awaited baby boy was born. The overjoyed father, wanting to give his son a fine name, rushed off to the neighborhood priest. \"Priest, priest, my wife gave birth to a boy last night, and I want to give him a name with good fortune in it — could you think of one for me?\" The priest replied, \"Well, congratulations! All right, let's think it over together.\" And so the two of them put their heads together." },
    { id:'p3', title:"③候補が次々と", ssml:false, text:"\"First, how about Jugemu — 'life without limit,' meaning he'll live a long, blessed life?\" \"That's wonderful, let's use that one.\" \"Wait, there's also 'gokou no surikire' — the impossibly long span of time it would take for a heavenly maiden, once every three thousand years, to wear an entire boulder down to nothing with the brush of her feathered robe.\" \"Oh, that's auspicious too, let's add that one as well.\" \"There's more still — kaijarisuigyo, suigyoumatsu unraimatsu fuuraimatsu, meaning something as endless as water, clouds, and wind.\" \"Well, none of them can be given up — they're all wonderful, I love every single one.\"" },

  'fr': [
    { id:'p1', title:"①まくら", ssml:false, text:"Laissez-moi vous raconter une histoire. Depuis toujours, le nom d'un enfant est une affaire de la plus haute importance pour ses parents. « Puisse-t-il grandir fort et bien » — cet espoir un peu gourmand, vouloir toutes les bénédictions à la fois, voilà bien ce que c'est qu'être parent. Aujourd'hui, je vais vous conter une histoire bien cocasse à propos d'un nom pas comme les autres." },
    { id:'p2', title:"②和尚さんへ相談", ssml:false, text:"Dans un certain quartier, un garçon tant attendu venait de naître. Le père, fou de joie, voulant donner à son fils un beau nom, courut aussitôt chez le bonze du voisinage. « Bonze, bonze, ma femme a accouché d'un garçon cette nuit, et je voudrais lui donner un nom porte-bonheur — pourriez-vous m'en trouver un ? » Le bonze répondit : « Eh bien, félicitations ! D'accord, réfléchissons-y ensemble. » Et les voilà tous deux à se creuser la tête." },
    { id:'p3', title:"③候補が次々と", ssml:false, text:"« D'abord, que dis-tu de Jugemu — 'vie sans limite', pour qu'il vive longtemps et soit béni ? » « C'est magnifique, prenons celui-là. » « Attends, il y a aussi 'gokou no surikire' — le temps incroyablement long qu'il faudrait à une fée céleste, une fois tous les trois mille ans, pour user un rocher entier jusqu'à rien avec le frôlement de sa robe de plumes. » « Oh, c'est aussi de bon augure, ajoutons celui-là également. » « Il y en a encore — kaijarisuigyo, suigyoumatsu unraimatsu fuuraimatsu, qui signifie quelque chose d'aussi inépuisable que l'eau, les nuages et le vent. » « Eh bien, aucun ne peut être abandonné — ils sont tous merveilleux, je les aime tous. »" },

  'es': [
    { id:'p1', title:"①まくら", ssml:false, text:"Déjenme contarles una historia. Desde la antigüedad, el nombre de un niño ha sido un asunto de suma importancia para los padres. «Que crezca fuerte y bien» — ese deseo un tanto ambicioso de querer todas las bendiciones a la vez, no es sino lo que significa ser padre. Hoy quiero compartirles un cuento de lo más disparatado sobre un nombre así." },
    { id:'p2', title:"②和尚さんへ相談", ssml:false, text:"En cierto vecindario había nacido un niño largamente esperado. El padre, loco de alegría, queriendo darle a su hijo un buen nombre, corrió hacia el sacerdote del barrio. «Sacerdote, sacerdote, mi esposa dio a luz a un varón anoche, y quiero darle un nombre de buena fortuna, ¿podría pensar uno para mí?» El sacerdote respondió: «Vaya, felicidades. Está bien, pensémoslo juntos.» Y ambos se pusieron a cavilar." },
    { id:'p3', title:"③候補が次々と", ssml:false, text:"«Primero, ¿qué tal Jugemu, 'vida sin límite', para que viva una vida larga y bendecida?» «Eso es maravilloso, usemos ese.» «Espera, también está 'gokou no surikire', el tiempo increíblemente largo que le tomaría a una doncella celestial, una vez cada tres mil años, desgastar una roca entera hasta la nada con el roce de su manto de plumas.» «Oh, eso también es auspicioso, añadamos ese también.» «Todavía hay más: kaijarisuigyo, suigyoumatsu unraimatsu fuuraimatsu, que significa algo tan inagotable como el agua, las nubes y el viento.» «Bueno, ninguno se puede desechar, todos son maravillosos, me encantan todos.»" },
    { id:'p4', title:"④全部つなげろ", ssml:false, text:"«Espera un momento, si te gustan todos tanto, nunca lo vas a reducir a uno solo.» «No, no, sería una lástima desechar cualquiera de ellos. Sacerdote, ¿y si simplemente los unimos todos en un solo nombre?» «¿Q-qué? ¿Unirlos todos? ¡Eso es demasiado largo, se mire como se mire!» «Bueno, no importa que sea largo, mientras sean todas palabras de buena fortuna, solo puede traerle suerte a mi hijo.» Y así, el nombre que finalmente registró en la oficina municipal fue este enorme bocado: «Jugemu Jugemu, Gokou-no-surikire, Kaijarisuigyo-no, Suigyoumatsu Unraimatsu Fuuraimatsu, Kuunerutokoro-ni-sumutokoro, Yaburakouji-no-Yaburakouji, Paipo-Paipo, Paipo-no-Shuuringan, Shuuringan-no-Guurindai, Guurindai-no-Ponpokopii-no-Ponpokonaa-no, Choukyuumei-no-Chousuke» — un nombre absurda y tremendamente largo." },
    { id:'p5', title:"⑤大きくなって", ssml:false, text:"Pues bien, el pequeño Jugemu creció y empezó a jugar con los niños del vecindario. Pero como su nombre era absurdamente largo, hasta llamarlo ya era todo un esfuerzo. Un día, Jugemu golpeó a un amigo en la cabeza con un palo, y el pobre amigo se hizo un chichón y rompió a llorar. Hasta ahí todo bien: el padre del niño que lloraba fue hasta la casa de Jugemu hecho una furia para quejarse." },
    { id:'p6', title:"⑥サゲ", ssml:false, text:"«¡Oye, tú, [nombre entero imposiblemente largo], idiota! ¡Qué le has hecho a mi hijo!» «Vamos, vamos, no te enojes así. ¿Qué fue exactamente lo que hizo nuestro [nombre entero imposiblemente largo]?» «Pues bien, tu [nombre entero imposiblemente largo] le pegó a mi hijo en la cabeza con un palo, y ahora tiene un chichón...» Pero decir ese nombre completo tomó tanto tiempo que para cuando terminó: «¿Eh? Ahora que lo pienso, ese chichón ya se bajó.» Y así, gracias a que el nombre era ridículamente largo, el chichón tuvo tiempo de sanar por completo antes de que nadie terminara siquiera de quejarse — y esa es la gracia de este cuento." }
  ]
};

const otherLangs = ['en','fr','es'];
const allAudio = {};
let otherDone = 0;
const OTHER_TOTAL = 18;

function initJaUI() {
  const container = document.getElementById('ja-parts');
  jaScripts.forEach((p, i) => {
    container.innerHTML += `
      <div class="part-row">
        <div class="part-title">${p.title}</div>
        <div>
          <div class="part-status" id="ja-status-${p.id}">未生成</div>
          <audio id="ja-audio-${p.id}"></audio>
        </div>
        <button class="btn btn-blue" onclick="generateJaPart(${i})">▶ 生成</button>
        <button class="btn btn-red" id="ja-play-${p.id}" onclick="playJaPart('${p.id}')" disabled>▷ 再生</button>
        <button class="btn btn-green" id="ja-dl-${p.id}" onclick="downloadJaPart(${i})" disabled>⬇ DL</button>
      </div>`;
  });
}

function initOtherUI() {
  const container = document.getElementById('lang-blocks');
  otherLangs.forEach(lang => {
    const parts = otherScripts[lang];
    const badges = parts.map(p => `<span class="part-badge" id="badge-${lang}-${p.id}" onclick="retryOtherPart('${lang}','${p.id}')" title="クリックで生成/再試行">${p.title}</span>`).join('');
    container.innerHTML += `
      <div class="lang-block">
        <div class="lang-title">${langConfig[lang].name} <span style="font-size:11px;color:#888;font-weight:normal;">${langConfig[lang].voice}</span></div>
        <div class="lang-progress">${badges}</div>
        <div class="lang-status" id="lang-status-${lang}">待機中</div>
      </div>`;
  });
}

async function callTTS(langCode, voiceName, text, isSSML) {
  const key = document.getElementById('apiKey').value.trim();
  if (!key) { throw new Error('APIキーが未入力です'); }
  const body = {
    input: isSSML ? { ssml: text } : { text },
    voice: { languageCode: langCode, name: voiceName },
    audioConfig: { audioEncoding: 'MP3' }
  };
  const res = await fetch(
    `https://texttospeech.googleapis.com/v1/text:synthesize?key=${key}`,
    { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
  );
  const data = await res.json();
  if (!data.audioContent) {
    const msg = (data.error && data.error.message) ? `[${data.error.status || res.status}] ${data.error.message}` : `HTTPエラー ${res.status}: ${JSON.stringify(data)}`;
    throw new Error(msg);
  }
  return data.audioContent;
}

async function generateJaPart(idx) {
  const p = jaScripts[idx];
  const status = document.getElementById(`ja-status-${p.id}`);
  status.textContent = '生成中...';
  status.className = 'part-status active';
  try {
    const b64 = await callTTS('ja-JP', 'ja-JP-Chirp3-HD-Charon', p.text, p.ssml);
    allAudio[`ja-${p.id}`] = b64;
    const audio = document.getElementById(`ja-audio-${p.id}`);
    audio.src = 'data:audio/mp3;base64,' + b64;
    status.textContent = '✅ 完成！';
    status.className = 'part-status done';
    document.getElementById(`ja-play-${p.id}`).disabled = false;
    document.getElementById(`ja-dl-${p.id}`).disabled = false;
    updateJaProgress();
  } catch (e) {
    status.textContent = '❌ ' + e.message;
    status.className = 'part-status error';
    status.title = e.message;
  }
}

function playJaPart(id) {
  document.getElementById(`ja-audio-${id}`).play();
}

function downloadJaPart(idx) {
  const p = jaScripts[idx];
  const key = `ja-${p.id}`;
  if (!allAudio[key]) return;
  const a = document.createElement('a');
  a.href = 'data:audio/mp3;base64,' + allAudio[key];
  a.download = `ja_p${idx+1}.mp3`;
  a.click();
}

async function generateAllJa() {
  for (let i = 0; i < jaScripts.length; i++) {
    await generateJaPart(i);
    await new Promise(r => setTimeout(r, 300));
  }
}

async function downloadAllJa() {
  for (let i = 0; i < jaScripts.length; i++) {
    const key = `ja-${jaScripts[i].id}`;
    if (!allAudio[key]) continue;
    const a = document.createElement('a');
    a.href = 'data:audio/mp3;base64,' + allAudio[key];
    a.download = `ja_p${i+1}.mp3`;
    a.click();
    await new Promise(r => setTimeout(r, 200));
  }
}

function updateJaProgress() {
  const done = jaScripts.filter(p => allAudio[`ja-${p.id}`]).length;
  document.getElementById('ja-bar').style.width = (done / jaScripts.length * 100) + '%';
  document.getElementById('ja-label').textContent = `${done} / ${jaScripts.length} パート完了`;
  if (done === jaScripts.length) {
    document.getElementById('dl-all-ja').disabled = false;
    document.getElementById('ja-label').textContent = `✅ 日本語 全${jaScripts.length}パート完成！`;
  }
}

async function startAll() {
  const key = document.getElementById('apiKey').value.trim();
  if (!key) { alert('APIキーを入力してください'); return; }
  document.getElementById('start-all').disabled = true;
  otherDone = 0;
  let lastError = '';
  for (const lang of otherLangs) {
    const parts = otherScripts[lang];
    document.getElementById(`lang-status-${lang}`).textContent = '生成中...';
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      const badge = document.getElementById(`badge-${lang}-${p.id}`);
      badge.className = 'part-badge active';
      try {
        const b64 = await callTTS(langConfig[lang].langCode, langConfig[lang].voice, p.text, p.ssml);
        allAudio[`${lang}-${p.id}`] = b64;
        badge.className = 'part-badge done';
        badge.title = '✅ 生成済み（クリックで再生成）';
        otherDone++;
        document.getElementById('all-bar').style.width = (otherDone / OTHER_TOTAL * 100) + '%';
        document.getElementById('all-label').textContent = `生成中... (${otherDone} / ${OTHER_TOTAL})`;
      } catch(e) {
        badge.className = 'part-badge error';
        badge.title = e.message + '（クリックで再試行）';
        lastError = `${langConfig[lang].name} ${p.title}: ${e.message}`;
      }
      await new Promise(r => setTimeout(r, 300));
    }
    document.getElementById(`lang-status-${lang}`).textContent = '✅ 完了';
  }
  document.getElementById('all-label').textContent = lastError
    ? `⚠️ ${otherDone} / ${OTHER_TOTAL} 件成功。失敗あり（赤いバッジをクリックで再試行）。最後のエラー: ${lastError}`
    : `✅ 全${otherDone}ファイル生成完了！`;
  document.getElementById('start-all').disabled = false;
  document.getElementById('dl-all').disabled = false;
}

async function retryOtherPart(lang, id) {
  const parts = otherScripts[lang];
  const idx = parts.findIndex(p => p.id === id);
  if (idx === -1) return;
  const p = parts[idx];
  const badge = document.getElementById(`badge-${lang}-${id}`);
  badge.className = 'part-badge active';
  try {
    const b64 = await callTTS(langConfig[lang].langCode, langConfig[lang].voice, p.text, p.ssml);
    allAudio[`${lang}-${id}`] = b64;
    badge.className = 'part-badge done';
    badge.title = '✅ 生成済み（クリックで再生成）';
    document.getElementById('dl-all').disabled = false;
    const a = document.createElement('a');
    a.href = 'data:audio/mp3;base64,' + b64;
    a.download = `${lang}_p${idx+1}.mp3`;
    a.click();
  } catch(e) {
    badge.className = 'part-badge error';
    badge.title = e.message + '（クリックで再試行）';
    alert(`${langConfig[lang].name} ${p.title} の生成に失敗しました。

${e.message}`);
  }
}

async function downloadAll() {
  const langs = ['ja', ...otherLangs];
  const allScripts = { ja: jaScripts, ...otherScripts };
  for (const lang of langs) {
    const parts = allScripts[lang];
    for (let i = 0; i < parts.length; i++) {
      const key = `${lang}-${parts[i].id}`;
      if (!allAudio[key]) continue;
      const a = document.createElement('a');
      a.href = 'data:audio/mp3;base64,' + allAudio[key];
      a.download = `${lang}_p${i+1}.mp3`;
      a.click();
      await new Promise(r => setTimeout(r, 200));
    }
  }
}

initJaUI();
initOtherUI();
</script>
