const jaScripts = [
  { id:'p1', title:"①まくら", ssml:true, text:"<speak><prosody rate=\"105%\" pitch=\"0st\">え〜、世の中には、粗忽という、なんとも困った性分の人がおりましてね。傘を差したまま「あれ、傘がねぇ」と探し回ったり、足袋を左右あべこべに履いて一日中それに気づかなかったり。<break time=\"500ms\"/>まぁ、この手の粗忽者は、どこの町にも一人や二人はいるもので。とある長屋にも、輪を掛けて粗忽な熊五郎という男が住んでおりまして、これがまぁ、今日のお話の主人公でございます。<break time=\"700ms\"/></prosody></speak>" },
  { id:'p2', title:"②行き倒れ", ssml:true, text:"<speak><prosody rate=\"105%\" pitch=\"0st\">さて、ある朝のこと、神田の川端で行き倒れの死体が一つ、見つかりましてね。身元がわからないというので、近所の者たちが大勢集まって取り囲んでおりました。そこへ、熊五郎がふらりと通りかかりましてね。<break time=\"400ms\"/></prosody><prosody rate=\"112%\" pitch=\"0st\">おや、なんの騒ぎだい？<break time=\"300ms\"/></prosody><prosody rate=\"100%\" pitch=\"-1st\">なんでも、身元のわからない仏さんが上がったんだと。<break time=\"400ms\"/></prosody><prosody rate=\"103%\" pitch=\"0st\">熊五郎は別に興味もなかったんですが、なんとなく人だかりに押されて、死体の顔をのぞき込むことになりました。<break time=\"600ms\"/></prosody></speak>" },
  { id:'p3', title:"③「これはお前だ」", ssml:true, text:"<speak><prosody rate=\"103%\" pitch=\"0st\">すると野次馬の一人が、死体の顔をしげしげと見て、こう言い出しましてね。<break time=\"350ms\"/></prosody><prosody rate=\"100%\" pitch=\"-1st\">おや、これは長屋の八五郎さんじゃねぇか。<break time=\"350ms\"/></prosody><prosody rate=\"100%\" pitch=\"-1st\">なるほど、言われてみりゃ、たしかに八五郎さんだ。<break time=\"400ms\"/></prosody><prosody rate=\"105%\" pitch=\"0st\">熊五郎も釣られて死体を見ますと、たしかに仲の良い八五郎に似ていなくもない。<break time=\"400ms\"/></prosody><prosody rate=\"115%\" pitch=\"+1st\">そう言われてみりゃ……こいつぁ八五郎だ！俺の友達の八五郎に間違いねぇ！<break time=\"500ms\"/></prosody><prosody rate=\"103%\" pitch=\"0st\">大勢が口々に「そうだそうだ」と言うものだから、熊五郎もすっかりその気になって、これは大変だと、青くなってしまいました。<break time=\"700ms\"/></prosody></speak>" },
  { id:'p4', title:"④八五郎を呼びに行く", ssml:true, text:"<speak><prosody rate=\"115%\" pitch=\"+1st\">熊五郎はいてもたってもいられず、「これは大変だ、本人に知らせなきゃ」と、当の八五郎の長屋へ飛んでいきました。<break time=\"400ms\"/></prosody><prosody rate=\"103%\" pitch=\"0st\">当然、八五郎はぴんぴんしておりまして、呑気に朝飯を食っておりました。<break time=\"400ms\"/></prosody><prosody rate=\"122%\" pitch=\"+1st\">八っつぁん！大変だ大変だ！お前が神田の川端で死んでるんだよ！<break time=\"400ms\"/></prosody><prosody rate=\"100%\" pitch=\"-1st\">なに言ってやがる、俺はこの通りぴんぴんしてらぁ。<break time=\"400ms\"/></prosody><prosody rate=\"103%\" pitch=\"0st\">と、当の八五郎は笑って取り合いませんでしたが、熊五郎は真剣そのもので、なおも言い募ります。<break time=\"400ms\"/></prosody><prosody rate=\"118%\" pitch=\"+1st\">いいから来い！大勢の者が見て、みんなお前だって言ってるんだ！<break time=\"600ms\"/></prosody></speak>" },
  { id:'p5', title:"⑤問答", ssml:true, text:"<speak><prosody rate=\"103%\" pitch=\"0st\">八五郎も初めは笑っておりましたが、熊五郎があんまり真剣な顔で言い張るものだから、だんだん怪しくなってまいりました。<break time=\"400ms\"/></prosody><prosody rate=\"100%\" pitch=\"0st\">だがおかしいじゃねぇか。死んだのがこの俺だってんなら、こうして生きてしゃべってる俺は、いったい何者なんだ？<break time=\"400ms\"/></prosody><prosody rate=\"108%\" pitch=\"0st\">そんなこたぁ、俺にわかるかい。だがな、あれだけ大勢の人が、口を揃えてお前だって言うんだ。あれだけの人数が揃いも揃って間違えるわけがねぇ。<break time=\"400ms\"/></prosody><prosody rate=\"95%\" pitch=\"-1st\">う〜ん……言われてみりゃそうだ。俺ぁゆうべ酒を飲んで、そのまま寝ちまったが……もしかして、あれから知らねぇうちに死んじまったのかもしれねぇな。<break time=\"500ms\"/></prosody><prosody rate=\"112%\" pitch=\"0st\">そうともよ！自分で死んだこともわからねぇなんてのは、いかにもお前らしいや。<break time=\"500ms\"/></prosody><prosody rate=\"103%\" pitch=\"0st\">と、粗忽者二人の妙な問答の末、とうとう八五郎は「自分は死んだのだ」とすっかり信じ込んでしまいました。<break time=\"700ms\"/></prosody></speak>" },
  { id:'p6', title:"⑥死体を抱く", ssml:true, text:"<speak><prosody rate=\"103%\" pitch=\"0st\">すっかりその気になった八五郎は、熊五郎に連れられて、神田の川端まで戻ってまいりました。死体の前に立ちますと、八五郎はしみじみと涙ぐみましてね。<break time=\"500ms\"/></prosody><prosody rate=\"92%\" pitch=\"-1st\">ああ……こいつぁたしかに俺だ。かわいそうに、冷たくなっちまって。<break time=\"500ms\"/></prosody><prosody rate=\"100%\" pitch=\"0st\">と、両手で死体をぐいっと抱き起こしましてね。<break time=\"300ms\"/></prosody><prosody rate=\"92%\" pitch=\"-1st\">おい、しっかりしろ！かわいそうに、早く仏にしてやらなきゃな……<break time=\"500ms\"/></prosody><prosody rate=\"98%\" pitch=\"0st\">と、自分の「遺体」をひしと抱きしめて、しくしくと泣き出す始末でございます。周りの者たちも、なんだか妙な光景に呆気にとられて見ておりました。<break time=\"700ms\"/></prosody></speak>" },
  { id:'p7', title:"⑦サゲ", ssml:true, text:"<speak><prosody rate=\"100%\" pitch=\"0st\">死体を抱きかかえたまま、八五郎はふと、なにか大きな疑問にぶつかったような顔になりましてね。<break time=\"500ms\"/></prosody><prosody rate=\"95%\" pitch=\"-1st\">まてよ……熊さん。ここで死んでるのが、たしかに俺だとするな。<break time=\"400ms\"/></prosody><prosody rate=\"108%\" pitch=\"0st\">おう、そうだそうだ。<break time=\"350ms\"/></prosody><prosody rate=\"90%\" pitch=\"-1st\">だったら……こうして今、この俺を抱いているのは、いってぇ誰なんだろうなぁ？<break time=\"800ms\"/></prosody><prosody rate=\"98%\" pitch=\"0st\">という、なんとも奇妙な一言を残しまして。粗忽には粗忽を重ねた末の、なんとも頓珍漢なオチでございます。粗忽長屋、これにて一席。<break time=\"800ms\"/></prosody></speak>" }
];

const otherScripts = {
  'en': [
    { id:'p1', title:"①まくら", ssml:false, text:"Now, there are certain unfortunate souls in this world cursed with what we call 'sokotsu' — chronic absent-mindedness. Some hold an open umbrella overhead while frantically searching for their umbrella. Others wear their socks on the wrong feet all day without ever noticing. Every neighborhood has at least one or two of this sort wandering around. And in a certain row house lived a man even more scatterbrained than most, named Kumagorou — and he happens to be the hero of today's tale." },
    { id:'p2', title:"②行き倒れ", ssml:false, text:"One morning, a body was found collapsed by the riverbank in Kanda. Since no one could identify who it was, a large crowd of neighbors gathered around to gawk. Kumagorou happened to wander by. Kumagorou: \"Oh? What's all the commotion?\" Bystander: \"Apparently they found some poor soul who drowned, and nobody knows who he is.\" Kumagorou wasn't particularly interested, but caught up in the crush of the crowd, he found himself peering down at the dead man's face." },
    { id:'p3', title:"③「これはお前だ」", ssml:false, text:"Then one of the onlookers, studying the dead man's face closely, spoke up. Bystander: \"Wait, isn't this Hachigorou from the tenement?\" Another bystander: \"Now that you mention it, yeah, that's definitely Hachigorou.\" Kumagorou, swept along, took another look at the body — and sure enough, it did resemble his good friend Hachigorou. Kumagorou: \"Now that you say it... this IS Hachigorou! No doubt about it, this is my friend Hachigorou!\" With everyone chiming in, \"That's right, that's right,\" Kumagorou became completely convinced, and turned pale, thinking, this is terrible." },
    { id:'p4', title:"④八五郎を呼びに行く", ssml:false, text:"Kumagorou couldn't sit still. \"This is terrible, I have to tell him myself,\" he thought, and dashed off to Hachigorou's own tenement. Naturally, Hachigorou was alive and well, calmly eating his breakfast. Kumagorou: \"Hacchan! Terrible news, terrible news! You're lying dead by the riverbank in Kanda!\" Hachigorou: \"What are you talking about? I'm right here, fit as a fiddle.\" The real Hachigorou just laughed it off, but Kumagorou was dead serious, and kept pressing the point. Kumagorou: \"Just come with me! A whole crowd of people saw the body and every one of them says it's you!\"" },
    { id:'p5', title:"⑤問答", ssml:false, text:"At first Hachigorou just laughed it off, but Kumagorou insisted so earnestly that he began to feel unsettled. Hachigorou: \"But wait, that doesn't make sense. If I'm the one who died, then who exactly is this person alive and talking right now?\" Kumagorou: \"How should I know? But look — that many people, all agreeing it's you. That many people couldn't all be wrong.\" Hachigorou: \"Hmm... now that you put it that way. I did drink last night and just passed out... maybe, without realizing it, I really did die sometime after that.\" Kumagorou: \"That's it exactly! Not even noticing your own death — that's so like you.\" And so, after this bizarre exchange between two scatterbrains, Hachigorou finally became completely convinced that he himself had died." },
    { id:'p6', title:"⑥死体を抱く", ssml:false, text:"Now fully convinced, Hachigorou let Kumagorou lead him back to the riverbank in Kanda. Standing before the body, Hachigorou grew genuinely tearful. Hachigorou: \"Ahh... this really is me. Poor thing, gone cold like this.\" He gathered the body up in both arms. Hachigorou: \"Hey, hang in there! Poor fellow, we'd better give you a proper send-off soon...\" And with that, he clutched his own \"remains\" tightly to his chest and began to sob. The onlookers stood by, utterly dumbfounded by the bizarre scene unfolding before them." },
    { id:'p7', title:"⑦サゲ", ssml:false, text:"Still clutching the body, Hachigorou's face suddenly took on the look of a man confronting some enormous, unanswerable question. Hachigorou: \"Wait a moment... Kuma. Let's say the one who died here really is me.\" Kumagorou: \"Right, right, that's the one.\" Hachigorou: \"Then... just who exactly is it that's holding me right now?\" And with that thoroughly baffling remark, he left everyone speechless. Two scatterbrains, stacking one absurdity atop another, arrived at this wonderfully nonsensical punchline. And that concludes our tale of the Absent-Minded Duo." }
  ],
  'fr': [
    { id:'p1', title:"①まくら", ssml:false, text:"Voyez-vous, il existe en ce monde des âmes malheureuses affligées de ce qu'on appelle le « sokotsu » — une étourderie chronique. Certains tiennent un parapluie ouvert au-dessus de leur tête tout en le cherchant frénétiquement. D'autres portent leurs chaussettes à l'envers toute la journée sans jamais s'en apercevoir. Chaque quartier compte au moins un ou deux individus de cette espèce. Et dans une certaine maison à loyer vivait un homme encore plus étourdi que la moyenne, nommé Kumagorou — et c'est justement le héros de notre histoire du jour." },
    { id:'p2', title:"②行き倒れ", ssml:false, text:"Un matin, on trouva un corps effondré au bord de la rivière à Kanda. Comme personne ne pouvait l'identifier, une foule nombreuse de voisins s'était rassemblée pour regarder. Kumagorou passait justement par là. Kumagorou : « Tiens, quel est ce raffut ? » Badaud : « Il paraît qu'on a repêché un pauvre bougre noyé, et personne ne sait qui c'est. » Kumagorou n'était pas particulièrement intéressé, mais entraîné par la cohue, il se retrouva à scruter le visage du défunt." },
    { id:'p3', title:"③「これはお前だ」", ssml:false, text:"Alors l'un des badauds, examinant attentivement le visage du mort, prit la parole. Badaud : « Attends, n'est-ce pas Hachigorou du logement ? » Un autre badaud : « Maintenant que tu le dis, oui, c'est bien Hachigorou. » Kumagorou, entraîné par le mouvement, regarda de nouveau le corps — et effectivement, cela ressemblait bien à son bon ami Hachigorou. Kumagorou : « Maintenant que tu le dis... c'est bien Hachigorou ! Aucun doute, c'est mon ami Hachigorou ! » Avec tout le monde répétant en chœur « C'est vrai, c'est vrai », Kumagorou en devint totalement convaincu, et pâlit, se disant que c'était terrible." },
    { id:'p4', title:"④八五郎を呼びに行く", ssml:false, text:"Kumagorou ne tenait plus en place. « C'est terrible, il faut que je le prévienne moi-même », pensa-t-il, et il courut jusqu'au logement d'Hachigorou. Naturellement, Hachigorou était bien vivant, en train de manger tranquillement son petit-déjeuner. Kumagorou : « Hacchan ! Terrible nouvelle, terrible nouvelle ! Tu es mort au bord de la rivière à Kanda ! » Hachigorou : « De quoi tu parles ? Je suis là, en pleine forme. » Le vrai Hachigorou prit ça à la légère en riant, mais Kumagorou était on ne peut plus sérieux, et insistait de plus belle. Kumagorou : « Viens avec moi, un point c'est tout ! Toute une foule a vu le corps et tout le monde dit que c'est toi ! »" },
    { id:'p5', title:"⑤問答", ssml:false, text:"Au début, Hachigorou en riait, mais Kumagorou insistait avec un tel sérieux qu'il commença à se sentir troublé. Hachigorou : « Mais attends, ça n'a pas de sens. Si c'est moi qui suis mort, alors qui est cette personne bien vivante en train de te parler ? » Kumagorou : « Comment veux-tu que je le sache ? Mais regarde — autant de gens, tous d'accord que c'est toi. Autant de monde ne peut pas se tromper. » Hachigorou : « Hmm... vu sous cet angle. J'ai bu hier soir et je me suis endormi comme ça... peut-être que, sans m'en rendre compte, je suis vraiment mort après ça. » Kumagorou : « Voilà, exactement ! Ne même pas remarquer sa propre mort, ça te ressemble tellement. » Et ainsi, après cet échange bizarre entre deux étourdis, Hachigorou finit par être totalement convaincu qu'il était lui-même mort." },
    { id:'p6', title:"⑥死体を抱く", ssml:false, text:"Désormais pleinement convaincu, Hachigorou se laissa ramener par Kumagorou jusqu'au bord de la rivière à Kanda. Debout devant le corps, Hachigorou fut pris de larmes sincères. Hachigorou : « Ah... c'est vraiment moi. Pauvre de moi, tout froid comme ça. » Il souleva le corps dans ses deux bras. Hachigorou : « Allez, tiens bon ! Pauvre de toi, il faut vite t'organiser de belles funérailles... » Et sur ce, il serra étroitement sa propre « dépouille » contre lui et se mit à sangloter. Les badauds, complètement abasourdis par cette scène insolite, restaient plantés là à regarder." },

const otherLangs = ['en','fr','es'];
const allAudio = {};
let otherDone = 0;
const OTHER_TOTAL = 21;

function initJaUI() {
  const container = document.getElementById('ja-parts');
  jaScripts.forEach((p, i) => {
    container.innerHTML += `
      <div class="part-row">
        <div class="part-title">${p.title}</div>
        <div>
          <div class="part-status" id="ja-status-${p.id}">未生成</div>
          <audio id="ja-audio-${p.id}"></audio>
        </div>
        <button class="btn btn-blue" onclick="generateJaPart(${i})">▶ 生成</button>
        <button class="btn btn-red" id="ja-play-${p.id}" onclick="playJaPart('${p.id}')" disabled>▷ 再生</button>
        <button class="btn btn-green" id="ja-dl-${p.id}" onclick="downloadJaPart(${i})" disabled>⬇ DL</button>
      </div>`;
  });
}

function initOtherUI() {
  const container = document.getElementById('lang-blocks');
  otherLangs.forEach(lang => {
    const parts = otherScripts[lang];
    const badges = parts.map(p => `<span class="part-badge" id="badge-${lang}-${p.id}" onclick="retryOtherPart('${lang}','${p.id}')" title="クリックで生成/再試行">${p.title}</span>`).join('');
    container.innerHTML += `
      <div class="lang-block">
        <div class="lang-title">${langConfig[lang].name} <span style="font-size:11px;color:#888;font-weight:normal;">${langConfig[lang].voice}</span></div>
        <div class="lang-progress">${badges}</div>
        <div class="lang-status" id="lang-status-${lang}">待機中</div>
      </div>`;
  });
}

async function callTTS(langCode, voiceName, text, isSSML) {
  const key = document.getElementById('apiKey').value.trim();
  if (!key) { throw new Error('APIキーが未入力です'); }
  const body = {
    input: isSSML ? { ssml: text } : { text },
    voice: { languageCode: langCode, name: voiceName },
    audioConfig: { audioEncoding: 'MP3' }
  };
  const res = await fetch(
    `https://texttospeech.googleapis.com/v1/text:synthesize?key=${key}`,
    { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
  );
  const data = await res.json();
  if (!data.audioContent) {
    const msg = (data.error && data.error.message) ? `[${data.error.status || res.status}] ${data.error.message}` : `HTTPエラー ${res.status}: ${JSON.stringify(data)}`;
    throw new Error(msg);
  }
  return data.audioContent;
}

async function generateJaPart(idx) {
  const p = jaScripts[idx];
  const status = document.getElementById(`ja-status-${p.id}`);
  status.textContent = '生成中...';
  status.className = 'part-status active';
  try {
    const b64 = await callTTS('ja-JP', 'ja-JP-Chirp3-HD-Charon', p.text, p.ssml);
    allAudio[`ja-${p.id}`] = b64;
    const audio = document.getElementById(`ja-audio-${p.id}`);
    audio.src = 'data:audio/mp3;base64,' + b64;
    status.textContent = '✅ 完成！';
    status.className = 'part-status done';
    document.getElementById(`ja-play-${p.id}`).disabled = false;
    document.getElementById(`ja-dl-${p.id}`).disabled = false;
    updateJaProgress();
  } catch (e) {
    status.textContent = '❌ ' + e.message;
    status.className = 'part-status error';
    status.title = e.message;
  }
}

function playJaPart(id) {
  document.getElementById(`ja-audio-${id}`).play();
}

function downloadJaPart(idx) {
  const p = jaScripts[idx];
  const key = `ja-${p.id}`;
  if (!allAudio[key]) return;
  const a = document.createElement('a');
  a.href = 'data:audio/mp3;base64,' + allAudio[key];
  a.download = `ja_p${idx+1}.mp3`;
  a.click();
}

async function generateAllJa() {
  for (let i = 0; i < jaScripts.length; i++) {
    await generateJaPart(i);
    await new Promise(r => setTimeout(r, 300));
  }
}

async function downloadAllJa() {
  for (let i = 0; i < jaScripts.length; i++) {
    const key = `ja-${jaScripts[i].id}`;
    if (!allAudio[key]) continue;
    const a = document.createElement('a');
    a.href = 'data:audio/mp3;base64,' + allAudio[key];
    a.download = `ja_p${i+1}.mp3`;
    a.click();
    await new Promise(r => setTimeout(r, 200));
  }
}

function updateJaProgress() {
  const done = jaScripts.filter(p => allAudio[`ja-${p.id}`]).length;
  document.getElementById('ja-bar').style.width = (done / jaScripts.length * 100) + '%';
  document.getElementById('ja-label').textContent = `${done} / ${jaScripts.length} パート完了`;
  if (done === jaScripts.length) {
    document.getElementById('dl-all-ja').disabled = false;
    document.getElementById('ja-label').textContent = `✅ 日本語 全${jaScripts.length}パート完成！`;
  }
}

async function startAll() {
  const key = document.getElementById('apiKey').value.trim();
  if (!key) { alert('APIキーを入力してください'); return; }
  document.getElementById('start-all').disabled = true;
  otherDone = 0;
  let lastError = '';
  for (const lang of otherLangs) {
    const parts = otherScripts[lang];
    document.getElementById(`lang-status-${lang}`).textContent = '生成中...';
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      const badge = document.getElementById(`badge-${lang}-${p.id}`);
      badge.className = 'part-badge active';
      try {
        const b64 = await callTTS(langConfig[lang].langCode, langConfig[lang].voice, p.text, p.ssml);
        allAudio[`${lang}-${p.id}`] = b64;
        badge.className = 'part-badge done';
        badge.title = '✅ 生成済み（クリックで再生成）';
        otherDone++;
        document.getElementById('all-bar').style.width = (otherDone / OTHER_TOTAL * 100) + '%';
        document.getElementById('all-label').textContent = `生成中... (${otherDone} / ${OTHER_TOTAL})`;
      } catch(e) {
        badge.className = 'part-badge error';
        badge.title = e.message + '（クリックで再試行）';
        lastError = `${langConfig[lang].name} ${p.title}: ${e.message}`;
      }
      await new Promise(r => setTimeout(r, 300));
    }
    document.getElementById(`lang-status-${lang}`).textContent = '✅ 完了';
  }
  document.getElementById('all-label').textContent = lastError
    ? `⚠️ ${otherDone} / ${OTHER_TOTAL} 件成功。失敗あり（赤いバッジをクリックで再試行）。最後のエラー: ${lastError}`
    : `✅ 全${otherDone}ファイル生成完了！`;
  document.getElementById('start-all').disabled = false;
  document.getElementById('dl-all').disabled = false;
}

async function retryOtherPart(lang, id) {
  const parts = otherScripts[lang];
  const idx = parts.findIndex(p => p.id === id);
  if (idx === -1) return;
  const p = parts[idx];
  const badge = document.getElementById(`badge-${lang}-${id}`);
  badge.className = 'part-badge active';
  try {
    const b64 = await callTTS(langConfig[lang].langCode, langConfig[lang].voice, p.text, p.ssml);
    allAudio[`${lang}-${id}`] = b64;
    badge.className = 'part-badge done';
    badge.title = '✅ 生成済み（クリックで再生成）';
    document.getElementById('dl-all').disabled = false;
    const a = document.createElement('a');
    a.href = 'data:audio/mp3;base64,' + b64;
    a.download = `${lang}_p${idx+1}.mp3`;
    a.click();
  } catch(e) {
    badge.className = 'part-badge error';
    badge.title = e.message + '（クリックで再試行）';
    alert(`${langConfig[lang].name} ${p.title} の生成に失敗しました。

${e.message}`);
  }
}

async function downloadAll() {
  const langs = ['ja', ...otherLangs];
  const allScripts = { ja: jaScripts, ...otherScripts };
  for (const lang of langs) {
    const parts = allScripts[lang];
    for (let i = 0; i < parts.length; i++) {
      const key = `${lang}-${parts[i].id}`;
      if (!allAudio[key]) continue;
      const a = document.createElement('a');
      a.href = 'data:audio/mp3;base64,' + allAudio[key];
      a.download = `${lang}_p${i+1}.mp3`;
      a.click();
      await new Promise(r => setTimeout(r, 200));
    }
  }
}

initJaUI();
initOtherUI();
</script>
