const jaScripts = [
  { id:'p1', title:"①まくら", ssml:true, text:"<speak><prosody rate='105%' pitch='0st'>え〜、一席申し上げます。<break time='400ms'/>明烏という噺は、堅物のお坊ちゃんが、生まれて初めて吉原へ足を踏み入れる一席でございます。<break time='500ms'/>世の中には、本ばかり読んで育って、世間知らずのまま大人になってしまう若旦那というのがいるもので。親から見れば頼もしくもあり、また少々心配の種でもある。<break time='500ms'/>今日はそんな若旦那が、とんだところで一皮も二皮もむける、という愉快な噺を一つ。<break time='700ms'/></prosody></speak>" },
  { id:'p2', title:"②若旦那と父の心配", ssml:true, text:"<speak><prosody rate='108%' pitch='0st'>日本橋の大店のご子息、時次郎さんという若旦那がございます。この時次郎さん、生まれてこの方、吉原はおろか芝居見物すら行ったことがないという、大変な堅物。<break time='450ms'/>朝から晩まで論語だ孟子だと本ばかり読んでおりまして、遊びらしい遊びを知りません。<break time='450ms'/>父親の大旦那、これを頼もしいと思う反面、あんまり真面目過ぎるのも考えものだ、いずれ身代を継ぐにしても、多少は世間の水を潜らせておかんと、かえって危なっかしいと案じておりました。<break time='500ms'/>そこで出入りの源兵衛と太助という二人の若い衆に、こっそり相談を持ちかけます。<break time='600ms'/></prosody></speak>" },
  { id:'p3', title:"③二人の計略", ssml:true, text:"<speak><prosody rate='108%' pitch='0st'>若旦那を一つ、遊びの味を覚えさせておくれと頼まれた源兵衛と太助、これはひと肌脱がねばと知恵を絞ります。<break time='450ms'/>まともに吉原に行こうと誘っても、堅物の時次郎が承知するはずもございません。<break time='450ms'/></prosody><prosody rate='112%' pitch='+1st'>日本堤のお稲荷様に、お籠りのお参りに参りましょう。夜通し祈願すれば、商売繁盛間違いなし。<break time='500ms'/></prosody><prosody rate='108%' pitch='0st'>と持ちかけました。信心深い時次郎、これにはまんまと乗ってしまい、<break time='300ms'/></prosody><prosody rate='102%' pitch='0st'>それはぜひ参りたい。<break time='400ms'/></prosody><prosody rate='108%' pitch='0st'>と、喜んで供に付いてまいります。<break time='600ms'/></prosody></speak>" },
  { id:'p4', title:"④動揺する若旦那", ssml:true, text:"<speak><prosody rate='108%' pitch='0st'>ところが案内されたのは、お稲荷様どころか吉原のお馴染みの見世。煌々と灯りの点いた廓の中、化粧をした女たちがずらりと居並ぶのを見て、時次郎は仰天いたしました。<break time='450ms'/></prosody><prosody rate='118%' pitch='+1st'>これは一体どういうことだ、こんな不埒な場所に来るとは聞いていない。<break time='450ms'/></prosody><prosody rate='108%' pitch='0st'>と真っ青になって震え出す始末。<break time='350ms'/></prosody><prosody rate='105%' pitch='-1st'>さあさあ、若旦那、お参りはこの奥で。<break time='400ms'/></prosody><prosody rate='108%' pitch='0st'>などと源兵衛たちにおだてられても、頑として動こうとせず、<break time='350ms'/></prosody><prosody rate='118%' pitch='+1st'>わたしは帰る、こんなところにいられるものか。<break time='450ms'/></prosody><prosody rate='108%' pitch='0st'>と半べそをかいて騒ぎ立てます。それでもどうにか座敷に押し込められ、浦里という花魁があてがわれることになりました。<break time='600ms'/></prosody></speak>" },
  { id:'p5', title:"⑤一夜明けての豹変", ssml:true, text:"<speak><prosody rate='108%' pitch='0st'>その晩は震えるばかりだった時次郎でしたが、翌朝になってみると、これがどうしたことでしょう。すっかり様子が変わっております。浦里の膝に頭を乗せ、すっかりくつろいだ顔つきで、<break time='400ms'/></prosody><prosody rate='98%' pitch='-1st'>いや、浦里、お前のような優しい人には会ったことがない。<break time='450ms'/></prosody><prosody rate='108%' pitch='0st'>などと惚気る始末。昨夜あれほど嫌がっていた廓の空気にも、もうすっかり馴染んでしまった様子。迎えに来た源兵衛と太助が、<break time='350ms'/></prosody><prosody rate='105%' pitch='-1st'>若旦那、そろそろお店が開きますし、そろそろお暇いたしましょう。<break time='400ms'/></prosody><prosody rate='108%' pitch='0st'>と声をかけても、時次郎は聞く耳を持ちません。<break time='600ms'/></prosody></speak>" },
  { id:'p6', title:"⑥帰りたがらない若旦那", ssml:true, text:"<speak><prosody rate='100%' pitch='-1st'>なんだ、お前たちは。せっかく浦里といい心持ちでいるのに、水を差すようなことを言うな。<break time='450ms'/></prosody><prosody rate='108%' pitch='0st'>と、時次郎、すっかり色男気取りでございます。源兵衛と太助は困り果てて、<break time='350ms'/></prosody><prosody rate='105%' pitch='-1st'>若旦那、大旦那様が心配しておいでですから。<break time='400ms'/></prosody><prosody rate='108%' pitch='0st'>となだめますが、時次郎は、<break time='300ms'/></prosody><prosody rate='98%' pitch='-1st'>なあに、少々くらい遅れたって構うものか。お前たちだけ先に帰ったらどうだ。<break time='450ms'/></prosody><prosody rate='108%' pitch='0st'>と、逆にのんびり構える始末。とうとう二人の方が、<break time='350ms'/></prosody><prosody rate='120%' pitch='+1st'>お願いですから、若旦那、早く帰りましょう。<break time='450ms'/></prosody><prosody rate='108%' pitch='0st'>と、拝むように急かす羽目になりました。<break time='600ms'/></prosody></speak>" },
  { id:'p7', title:"⑦サゲ", ssml:true, text:"<speak><prosody rate='112%' pitch='+1st'>すっかり呆れた源兵衛、思わずぼやきます。まったく、無理やり連れてきたこっちが、こんなに帰りを急かされるとは思いませんでしたよ。<break time='500ms'/></prosody><prosody rate='95%' pitch='-1st'>すると時次郎、涼しい顔で一言。なあに、心配するな。お前たちは、また今度連れてきてくれればいい。<break time='550ms'/></prosody><prosody rate='105%' pitch='0st'>源兵衛と太助、顔を見合わせて、こりゃあ、とんだ果報者を、とんだ一人前にしちまった、と、ため息をつくのでございました。<break time='900ms'/></prosody></speak>" }
];

const otherScripts = {
  'en': [
    { id:'p1', title:"①まくら", ssml:false, text:"Let me tell you a story. Akegarasu, The Dawn Crow, is the tale of an uptight, bookish young man setting foot in Yoshiwara for the very first time in his life. You know the type, raised on nothing but books, growing into adulthood without a clue about the world. Parents find such sons reassuring in one sense, and a bit worrying in another. Today's tale is a delightful one about just such a young man, who ends up shedding his shell, not once but twice over, in the most unexpected of places." },
    { id:'p2', title:"②若旦那と父の心配", ssml:false, text:"There was a young master named Tokijiro, son of a great merchant house in Nihonbashi. From the day he was born, this Tokijiro had never once set foot in Yoshiwara, nor even been to see a play, an almost impossibly serious young man. Morning to night he did nothing but read the Analects and Mencius, and had no idea what fun even meant. His father, the master of the house, found this reassuring in one way, but worried: being this earnest isn't entirely a good thing, even if he's to inherit the family business, if he never gets a taste of the world he'll be dangerously naive. So he quietly took aside two employees of the household, Genbei and Tasuke, and asked for their help." },
    { id:'p3', title:"③二人の計略", ssml:false, text:"Teach the young master a taste for having fun, that was the request, and Genbei and Tasuke racked their brains, knowing this called for some real effort. Simply inviting him with let's go to Yoshiwara was never going to work on someone as straight-laced as Tokijiro. So they cooked up a scheme instead. Genbei: Let's go keep an all-night vigil praying at the Inari shrine on Nihon-zutsumi. Pray through the night and your business is guaranteed to prosper. Devout as ever, Tokijiro fell for it completely. Tokijiro: By all means, I'd love to go. And he happily tagged along." },
    { id:'p4', title:"④動揺する若旦那", ssml:false, text:"But where they actually led him was not to any shrine, it was a familiar teahouse in Yoshiwara. Seeing the pleasure quarter ablaze with lantern light, rows of painted women lined up before him, Tokijiro was stunned. Tokijiro: What is the meaning of this? Nobody told me we were coming to such a disreputable place! He turned pale and started shaking. Genbei: Now, now, young master, the prayers are held just this way, through here. No amount of coaxing from Genbei and the others could get him to budge. Tokijiro: I'm going home! How could anyone stay in a place like this? He kicked up a fuss, half in tears. Even so, they somehow got him settled into a room, where he was paired off with a courtesan named Urazato." },
    { id:'p5', title:"⑤一夜明けての豹変", ssml:false, text:"That night, Tokijiro did nothing but tremble, but by the next morning, something had changed entirely. There he was, head resting on Urazato's lap, looking utterly at ease. Tokijiro: Ah, Urazato, I've never met anyone as kind as you. Gushing like a man head over heels. The very atmosphere of the pleasure quarter he'd so despised the night before, he now seemed completely at home in. When Genbei and Tasuke arrived to fetch him. Genbei: Young master, the shop will be opening soon, shall we be on our way? Tokijiro wouldn't hear a word of it." },
    { id:'p6', title:"⑥帰りたがらない若旦那", ssml:false, text:"Tokijiro: What's gotten into you two? Don't go spoiling the mood, just when Urazato and I were having such a lovely time. He'd become a regular ladies' man overnight. Genbei and Tasuke, at their wits' end, tried to soothe him. Genbei: Young master, your father will be worried. But Tokijiro just waved them off. Tokijiro: Bah, what does it matter if we're a little late? Why don't you two go on home without me? Settling in as if he had all the time in the world. In the end, it was the two of them who found themselves pleading. Genbei: Please, young master, let's hurry home!" },
    { id:'p7', title:"⑦サゲ", ssml:false, text:"Utterly exasperated, Genbei couldn't help muttering. Genbei: Honestly, we're the ones who dragged him here, and now we're the ones begging him to hurry home. Tokijiro, cool as can be, had just one thing to say. Tokijiro: Oh, don't worry about it. You two can just bring me again next time. Genbei and Tasuke looked at each other and sighed: well, we certainly turned a lucky innocent into a real grown man, didn't we." }
  ],
  'fr': [
    { id:'p1', title:"①まくら", ssml:false, text:"Laissez-moi vous raconter une histoire. Akegarasu, Le Corbeau de l'Aube, c'est l'histoire d'un jeune homme guindé et studieux qui met les pieds à Yoshiwara pour la toute première fois de sa vie. Vous connaissez le genre, élevé uniquement dans les livres, devenu adulte sans la moindre idée du monde. Les parents trouvent ces fils-là rassurants d'un côté, et un peu inquiétants de l'autre. Voici aujourd'hui une histoire réjouissante sur un tel jeune homme, qui finit par se déniaiser, pas une fois mais deux, dans l'endroit le plus inattendu qui soit." },
    { id:'p2', title:"②若旦那と父の心配", ssml:false, text:"Il y avait un jeune maître nommé Tokijiro, fils d'une grande maison de commerce de Nihonbashi. Depuis sa naissance, ce Tokijiro n'avait jamais mis les pieds à Yoshiwara, ni même assisté à une pièce de théâtre, un jeune homme d'un sérieux presque irréel. Du matin au soir, il ne faisait que lire les Entretiens de Confucius et Mencius, sans la moindre idée de ce qu'était s'amuser. Son père, le maître de maison, trouvait cela rassurant d'un côté, mais s'inquiétait : être aussi sérieux n'est pas forcément une bonne chose, même s'il doit hériter de l'affaire familiale, s'il ne goûte jamais au monde, il restera dangereusement naïf. Il prit donc discrètement à part deux employés de la maison, Genbei et Tasuke, pour leur demander de l'aide." },
    { id:'p3', title:"③二人の計略", ssml:false, text:"Apprends au jeune maître le goût du plaisir, telle était la demande, et Genbei et Tasuke se creusèrent la tête, sachant que cela demanderait de vrais efforts. L'inviter simplement en disant allons à Yoshiwara n'aurait jamais fonctionné sur quelqu'un d'aussi rigide que Tokijiro. Ils montèrent donc un plan. Genbei : Allons faire une veillée de prière toute la nuit au sanctuaire Inari de Nihon-zutsumi. Prier toute la nuit garantit la prospérité des affaires. Toujours aussi pieux, Tokijiro mordit à l'hameçon sans se douter de rien. Tokijiro : J'aimerais beaucoup y aller. Et il les suivit de bon cœur." },
    { id:'p4', title:"④動揺する若旦那", ssml:false, text:"Mais l'endroit où on le mena n'était en réalité aucun sanctuaire, c'était une maison de thé bien connue de Yoshiwara. En voyant le quartier illuminé de lanternes, des rangées de femmes fardées alignées devant lui, Tokijiro fut abasourdi. Tokijiro : Qu'est-ce que cela signifie ? Personne ne m'avait dit qu'on venait dans un endroit aussi scandaleux ! Il devint blanc comme un linge et se mit à trembler. Genbei : Allons, allons, jeune maître, les prières se font justement par ici, tout au fond. Aucune flatterie de Genbei et des autres ne put le faire bouger. Tokijiro : Je rentre chez moi ! Comment pourrait-on rester dans un endroit pareil ? Il fit une scène, à moitié en larmes. Malgré tout, on parvint à le pousser dans une chambre, où on lui attribua une courtisane nommée Urazato." },
    { id:'p5', title:"⑤一夜明けての豹変", ssml:false, text:"Cette nuit-là, Tokijiro n'avait fait que trembler, mais le lendemain matin, tout avait changé du tout au tout. Le voilà, la tête posée sur les genoux d'Urazato, l'air parfaitement à l'aise. Tokijiro : Ah, Urazato, je n'ai jamais rencontré personne d'aussi douce que toi. Il roucoulait comme un homme éperdument amoureux. L'atmosphère même du quartier qu'il avait tant méprisée la veille lui semblait désormais tout à fait familière. Quand Genbei et Tasuke vinrent le chercher. Genbei : Jeune maître, la boutique va bientôt ouvrir, ne devrions-nous pas y aller ? Tokijiro ne voulut rien entendre." },

    { id:'p7', title:"⑦サゲ", ssml:false, text:"Complètement dépassé, Genbei ne put s'empêcher de marmonner. Genbei : Franchement, c'est nous qui l'avons traîné ici de force, et voilà que c'est nous qui le supplions de rentrer vite. Tokijiro, imperturbable, n'eut qu'une chose à répondre. Tokijiro : Oh, ne vous en faites pas. Vous n'aurez qu'à me ramener une prochaine fois. Genbei et Tasuke se regardèrent et soupirèrent : eh bien, nous avons vraiment transformé un innocent chanceux en un homme fait, dis donc." }
  ],

const otherLangs = ['en','fr','es'];
const allAudio = {};
let otherDone = 0;
const OTHER_TOTAL = 21;

function initJaUI() {
  const container = document.getElementById('ja-parts');
  jaScripts.forEach((p, i) => {
    container.innerHTML += `
      <div class="part-row">
        <div class="part-title">${p.title}</div>
        <div>
          <div class="part-status" id="ja-status-${p.id}">未生成</div>
          <audio id="ja-audio-${p.id}"></audio>
        </div>
        <button class="btn btn-blue" onclick="generateJaPart(${i})">▶ 生成</button>
        <button class="btn btn-red" id="ja-play-${p.id}" onclick="playJaPart('${p.id}')" disabled>▷ 再生</button>
        <button class="btn btn-green" id="ja-dl-${p.id}" onclick="downloadJaPart(${i})" disabled>⬇ DL</button>
      </div>`;
  });
}

function initOtherUI() {
  const container = document.getElementById('lang-blocks');
  otherLangs.forEach(lang => {
    const parts = otherScripts[lang];
    const badges = parts.map(p => `<span class="part-badge" id="badge-${lang}-${p.id}" onclick="retryOtherPart('${lang}','${p.id}')" title="クリックで生成/再試行">${p.title}</span>`).join('');
    container.innerHTML += `
      <div class="lang-block">
        <div class="lang-title">${langConfig[lang].name} <span style="font-size:11px;color:#888;font-weight:normal;">${langConfig[lang].voice}</span></div>
        <div class="lang-progress">${badges}</div>
        <div class="lang-status" id="lang-status-${lang}">待機中</div>
      </div>`;
  });
}

async function callTTS(langCode, voiceName, text, isSSML) {
  const key = document.getElementById('apiKey').value.trim();
  if (!key) { throw new Error('APIキーが未入力です'); }
  const body = {
    input: isSSML ? { ssml: text } : { text },
    voice: { languageCode: langCode, name: voiceName },
    audioConfig: { audioEncoding: 'MP3' }
  };
  const res = await fetch(
    `https://texttospeech.googleapis.com/v1/text:synthesize?key=${key}`,
    { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
  );
  const data = await res.json();
  if (!data.audioContent) {
    const msg = (data.error && data.error.message) ? `[${data.error.status || res.status}] ${data.error.message}` : `HTTPエラー ${res.status}: ${JSON.stringify(data)}`;
    throw new Error(msg);
  }
  return data.audioContent;
}

async function generateJaPart(idx) {
  const p = jaScripts[idx];
  const status = document.getElementById(`ja-status-${p.id}`);
  status.textContent = '生成中...';
  status.className = 'part-status active';
  try {
    const b64 = await callTTS('ja-JP', 'ja-JP-Chirp3-HD-Charon', p.text, p.ssml);
    allAudio[`ja-${p.id}`] = b64;
    const audio = document.getElementById(`ja-audio-${p.id}`);
    audio.src = 'data:audio/mp3;base64,' + b64;
    status.textContent = '✅ 完成！';
    status.className = 'part-status done';
    document.getElementById(`ja-play-${p.id}`).disabled = false;
    document.getElementById(`ja-dl-${p.id}`).disabled = false;
    updateJaProgress();
  } catch (e) {
    status.textContent = '❌ ' + e.message;
    status.className = 'part-status error';
    status.title = e.message;
  }
}

function playJaPart(id) {
  document.getElementById(`ja-audio-${id}`).play();
}

function downloadJaPart(idx) {
  const p = jaScripts[idx];
  const key = `ja-${p.id}`;
  if (!allAudio[key]) return;
  const a = document.createElement('a');
  a.href = 'data:audio/mp3;base64,' + allAudio[key];
  a.download = `ja_p${idx+1}.mp3`;
  a.click();
}

async function generateAllJa() {
  for (let i = 0; i < jaScripts.length; i++) {
    await generateJaPart(i);
    await new Promise(r => setTimeout(r, 300));
  }
}

async function downloadAllJa() {
  for (let i = 0; i < jaScripts.length; i++) {
    const key = `ja-${jaScripts[i].id}`;
    if (!allAudio[key]) continue;
    const a = document.createElement('a');
    a.href = 'data:audio/mp3;base64,' + allAudio[key];
    a.download = `ja_p${i+1}.mp3`;
    a.click();
    await new Promise(r => setTimeout(r, 200));
  }
}

function updateJaProgress() {
  const done = jaScripts.filter(p => allAudio[`ja-${p.id}`]).length;
  document.getElementById('ja-bar').style.width = (done / jaScripts.length * 100) + '%';
  document.getElementById('ja-label').textContent = `${done} / ${jaScripts.length} パート完了`;
  if (done === jaScripts.length) {
    document.getElementById('dl-all-ja').disabled = false;
    document.getElementById('ja-label').textContent = `✅ 日本語 全${jaScripts.length}パート完成！`;
  }
}

async function startAll() {
  const key = document.getElementById('apiKey').value.trim();
  if (!key) { alert('APIキーを入力してください'); return; }
  document.getElementById('start-all').disabled = true;
  otherDone = 0;
  let lastError = '';
  for (const lang of otherLangs) {
    const parts = otherScripts[lang];
    document.getElementById(`lang-status-${lang}`).textContent = '生成中...';
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      const badge = document.getElementById(`badge-${lang}-${p.id}`);
      badge.className = 'part-badge active';
      try {
        const b64 = await callTTS(langConfig[lang].langCode, langConfig[lang].voice, p.text, p.ssml);
        allAudio[`${lang}-${p.id}`] = b64;
        badge.className = 'part-badge done';
        badge.title = '✅ 生成済み（クリックで再生成）';
        otherDone++;
        document.getElementById('all-bar').style.width = (otherDone / OTHER_TOTAL * 100) + '%';
        document.getElementById('all-label').textContent = `生成中... (${otherDone} / ${OTHER_TOTAL})`;
      } catch(e) {
        badge.className = 'part-badge error';
        badge.title = e.message + '（クリックで再試行）';
        lastError = `${langConfig[lang].name} ${p.title}: ${e.message}`;
      }
      await new Promise(r => setTimeout(r, 300));
    }
    document.getElementById(`lang-status-${lang}`).textContent = '✅ 完了';
  }
  document.getElementById('all-label').textContent = lastError
    ? `⚠️ ${otherDone} / ${OTHER_TOTAL} 件成功。失敗あり（赤いバッジをクリックで再試行）。最後のエラー: ${lastError}`
    : `✅ 全${otherDone}ファイル生成完了！`;
  document.getElementById('start-all').disabled = false;
  document.getElementById('dl-all').disabled = false;
}

async function retryOtherPart(lang, id) {
  const parts = otherScripts[lang];
  const idx = parts.findIndex(p => p.id === id);
  if (idx === -1) return;
  const p = parts[idx];
  const badge = document.getElementById(`badge-${lang}-${id}`);
  badge.className = 'part-badge active';
  try {
    const b64 = await callTTS(langConfig[lang].langCode, langConfig[lang].voice, p.text, p.ssml);
    allAudio[`${lang}-${id}`] = b64;
    badge.className = 'part-badge done';
    badge.title = '✅ 生成済み（クリックで再生成）';
    document.getElementById('dl-all').disabled = false;
    const a = document.createElement('a');
    a.href = 'data:audio/mp3;base64,' + b64;
    a.download = `${lang}_p${idx+1}.mp3`;
    a.click();
  } catch(e) {
    badge.className = 'part-badge error';
    badge.title = e.message + '（クリックで再試行）';
    alert(`${langConfig[lang].name} ${p.title} の生成に失敗しました。

${e.message}`);
  }
}

async function downloadAll() {
  const langs = ['ja', ...otherLangs];
  const allScripts = { ja: jaScripts, ...otherScripts };
  for (const lang of langs) {
    const parts = allScripts[lang];
    for (let i = 0; i < parts.length; i++) {
      const key = `${lang}-${parts[i].id}`;
      if (!allAudio[key]) continue;
      const a = document.createElement('a');
      a.href = 'data:audio/mp3;base64,' + allAudio[key];
      a.download = `${lang}_p${i+1}.mp3`;
      a.click();
      await new Promise(r => setTimeout(r, 200));
    }
  }
}

initJaUI();
initOtherUI();
</script>
