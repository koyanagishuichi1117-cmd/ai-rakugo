const jaScripts = [
  { id:'p1', title:"①まくら", ssml:true, text:"<speak><prosody rate=\"105%\" pitch=\"0st\">え〜、一席申し上げますが。<break time=\"500ms\"/>子供というのは正直なもので、親の弱みをちゃんと心得ておりましてね。<break time=\"400ms\"/>「ダメ」と言われてもしつこく粘れば、そのうち親が根負けするというのを、ちゃんと知ってるんですな。<break time=\"500ms\"/>今日は、そんな親子の駆け引きが見物の、初天神という噺を一つ。<break time=\"600ms\"/></prosody></speak>" },
  { id:'p2', title:"②お参りに行こう", ssml:true, text:"<speak><prosody rate=\"105%\" pitch=\"0st\">正月二十五日は、その年最初の天神さまのご縁日、いわゆる初天神でございます。町中が賑やかになるってんで、息子の金坊が父親にせがみます。<break time=\"400ms\"/></prosody><prosody rate=\"120%\" pitch=\"+2st\">ねぇ父ちゃん、今日は天神さまのお祭りだろ、僕も連れてってよ！<break time=\"350ms\"/></prosody><prosody rate=\"95%\" pitch=\"-2st\">よせよせ、お前を連れてくと、露店の前で何か買え買え言い出すに決まってらい。<break time=\"400ms\"/></prosody><prosody rate=\"125%\" pitch=\"+2st\">そんなこと言わない、言わないから！ねぇ、お願い、連れてって、連れてって！<break time=\"400ms\"/></prosody><prosody rate=\"105%\" pitch=\"0st\">と、こう足に絡み付いて離れません。父親も根が甘いもんですから、とうとう<break time=\"200ms\"/></prosody><prosody rate=\"95%\" pitch=\"-2st\">仕方ないな。<break time=\"300ms\"/></prosody><prosody rate=\"105%\" pitch=\"0st\">と連れて出る羽目になりました。<break time=\"600ms\"/></prosody></speak>" },
  { id:'p3', title:"③飴玉と団子", ssml:true, text:"<speak><prosody rate=\"105%\" pitch=\"0st\">境内に着くなり、金坊はさっそく飴細工の屋台を見付けました。<break time=\"400ms\"/></prosody><prosody rate=\"122%\" pitch=\"+2st\">わあ、りんご飴だ！父ちゃん、あれ買って！<break time=\"350ms\"/></prosody><prosody rate=\"95%\" pitch=\"-2st\">ほら見ろ、言わないこっちゃない。来て早々それか。<break time=\"400ms\"/></prosody><prosody rate=\"122%\" pitch=\"+2st\">だって美味しそうなんだもん！ねぇねぇ！<break time=\"400ms\"/></prosody><prosody rate=\"100%\" pitch=\"0st\">父親は仕方なく財布を開いて、りんご飴を一つ買ってやりました。すると今度は団子屋の前で足を止めます。<break time=\"400ms\"/></prosody><prosody rate=\"120%\" pitch=\"+2st\">あ、お団子も美味しそう！<break time=\"350ms\"/></prosody><prosody rate=\"95%\" pitch=\"-2st\">こら、さっき飴を買ったばかりだろう。<break time=\"350ms\"/></prosody><prosody rate=\"122%\" pitch=\"+2st\">飴と団子は別腹だい！<break time=\"400ms\"/></prosody><prosody rate=\"100%\" pitch=\"0st\">父親はぶつぶつ言いながらも、結局また財布の紐を緩めるのでございました。<break time=\"600ms\"/></prosody></speak>" },
  { id:'p4', title:"④凧をねだる", ssml:true, text:"<speak><prosody rate=\"105%\" pitch=\"0st\">お参りを済ませて帰ろうとしたところ、今度は凧を売る屋台の前で、金坊がぴたりと止まってしまいました。<break time=\"400ms\"/></prosody><prosody rate=\"122%\" pitch=\"+2st\">父ちゃん、あの凧買って！お願い！<break time=\"350ms\"/></prosody><prosody rate=\"95%\" pitch=\"-2st\">ダメだダメだ、飴も団子も買ってやったろう、凧まではキリがない。<break time=\"400ms\"/></prosody><prosody rate=\"125%\" pitch=\"+2st\">や〜だ！買ってくれなきゃ動かないもん！<break time=\"400ms\"/></prosody><prosody rate=\"103%\" pitch=\"0st\">と、地面に座り込んでダダをこねる始末。周りの目もあって、父親はとうとう根負けしましてね。<break time=\"400ms\"/></prosody><prosody rate=\"95%\" pitch=\"-1st\">わかった、わかったよ。買ってやるから、その代わり、あとで父ちゃんにも揚げさせろよ。<break time=\"350ms\"/></prosody><prosody rate=\"120%\" pitch=\"+2st\">うん、いいよ！<break time=\"400ms\"/></prosody><prosody rate=\"103%\" pitch=\"0st\">こうして凧も買ってもらい、二人は近くの空き地へと向かいました。<break time=\"600ms\"/></prosody></speak>" },
  { id:'p5', title:"⑤父ちゃん夢中", ssml:true, text:"<speak><prosody rate=\"105%\" pitch=\"0st\">空き地に着くと、父親は<break time=\"200ms\"/></prosody><prosody rate=\"110%\" pitch=\"-1st\">まずは父ちゃんがお手本を見せてやろう。<break time=\"300ms\"/></prosody><prosody rate=\"105%\" pitch=\"0st\">と、糸を持って走り出しました。すると凧がふわりと風に乗って、するすると空高くあがっていきます。<break time=\"400ms\"/></prosody><prosody rate=\"118%\" pitch=\"0st\">おお、あがったあがった！こりゃ気持ちいいぞ！<break time=\"350ms\"/></prosody><prosody rate=\"122%\" pitch=\"+2st\">父ちゃん、僕にも貸して！<break time=\"350ms\"/></prosody><prosody rate=\"115%\" pitch=\"0st\">ちょ、ちょっと待て、もうちょっとだけ、もうちょっとだけだから。<break time=\"400ms\"/></prosody><prosody rate=\"105%\" pitch=\"0st\">そう言いながら、父親はどんどん夢中になっていきます。糸を引いては緩め、空を見上げてはしゃぐその姿は、まるで子供そのもの。<break time=\"400ms\"/></prosody><prosody rate=\"125%\" pitch=\"+2st\">ねぇってば！僕の凧なんだよ！<break time=\"350ms\"/></prosody><prosody rate=\"110%\" pitch=\"-1st\">うるさいな、静かにしてろ！今いいところなんだから。<break time=\"600ms\"/></prosody></speak>" },
  { id:'p6', title:"⑥サゲ", ssml:true, text:"<speak><prosody rate=\"105%\" pitch=\"0st\">日が傾き始めても、父親は凧から目を離そうとしません。息子そっちのけで、糸を引いては<break time=\"150ms\"/></prosody><prosody rate=\"115%\" pitch=\"0st\">それそれ、<break time=\"200ms\"/></prosody><prosody rate=\"105%\" pitch=\"0st\">緩めては<break time=\"150ms\"/></prosody><prosody rate=\"115%\" pitch=\"0st\">おっとっと、<break time=\"200ms\"/></prosody><prosody rate=\"105%\" pitch=\"0st\">と、すっかり大人気ない熱中ぶり。金坊はすっかり蚊帳の外で、地面にしゃがんで退屈そうにしております。<break time=\"400ms\"/></prosody><prosody rate=\"100%\" pitch=\"+1st\">ねぇ父ちゃん、そろそろ僕にも代わってよぉ。<break time=\"350ms\"/></prosody><prosody rate=\"115%\" pitch=\"0st\">ダメだダメだ、まだまだ！ほら見ろ、あんなに高くあがって、いい眺めだろう！<break time=\"400ms\"/></prosody><prosody rate=\"95%\" pitch=\"0st\">もういいよ、飽きた……<break time=\"400ms\"/></prosody><prosody rate=\"105%\" pitch=\"0st\">それでも父親は聞く耳を持たず、空を見上げてニコニコと凧を揚げ続けます。とうとう金坊、ぽつりとこう漏らしました。<break time=\"500ms\"/></prosody><prosody rate=\"92%\" pitch=\"-1st\">あ〜あ、こんなことなら……父ちゃんなんかと来なきゃよかった。<break time=\"700ms\"/></prosody><prosody rate=\"102%\" pitch=\"0st\">誘ったのは息子の方なのに、いざ来てみれば父親の方がすっかり夢中になってしまって、息子が置いてけぼり。何ともほほえましい、親子の噺でございました。<break time=\"800ms\"/></prosody></speak>" }
];

const otherScripts = {
  'en': [
    { id:'p1', title:"①まくら", ssml:false, text:"Let me tell you a story. Children are honest creatures at heart, and they know exactly where their parents are weak. Even after being told \"no,\" they know that if they just keep whining long enough, sooner or later the parent will cave in. Today's tale is all about watching that little tug-of-war play out between a father and his son, at the shrine festival called Hatsutenjin." },
    { id:'p2', title:"②お参りに行こう", ssml:false, text:"The twenty-fifth day of the New Year is the first shrine festival of Tenjin that year — the so-called Hatsutenjin. With the whole town buzzing with excitement, the son, little Kinbo, begged his father. \"Hey, Pop, today's the Tenjin festival, right? Take me along too!\" \"Forget it, forget it — if I take you, you'll start whining to buy something at every stall, I just know it.\" \"I won't say that, I promise I won't! Please, take me, take me!\" And he clung to his father's leg and wouldn't let go. Being soft-hearted at the core, the father finally sighed, \"Well, guess there's no helping it,\" and ended up taking the boy along." },
    { id:'p3', title:"③飴玉と団子", ssml:false, text:"The moment they reached the shrine grounds, Kinbo spotted a candy-apple stall. \"Wow, candy apples! Pop, buy me one!\" \"See, told you so. We just got here and already?\" \"But it looks so good! Please, please!\" The father sighed and opened his wallet, buying him a candy apple. Then the boy stopped in front of a dumpling stall. \"Ooh, those dumplings look good too!\" \"Hey now, you just got the candy apple.\" \"Candy and dumplings go in different stomachs!\" Grumbling the whole time, the father ended up loosening his purse strings once again." },
    { id:'p4', title:"④凧をねだる", ssml:false, text:"Having finished their prayers and about to head home, Kinbo suddenly stopped dead in front of a kite stall. \"Pop, buy me that kite! Please!\" \"No way, no way, I already bought you candy and dumplings — there's no end to it if I start buying kites too.\" \"No fair! I'm not moving until you buy it for me!\" And he plopped down on the ground and threw a tantrum right there. With onlookers watching, the father finally gave in. \"All right, all right. I'll buy it — but in exchange, let me fly it too, later.\" \"Sure, okay!\" And so the kite was bought, and the two of them headed off to a nearby empty lot." },
    { id:'p5', title:"⑤父ちゃん夢中", ssml:false, text:"Once at the empty lot, the father said, \"First let your old man show you how it's done,\" and took off running with the string in hand. The kite caught the wind and went sailing smoothly up into the sky. \"Whoa, it's up, it's up! This feels amazing!\" \"Pop, let me have a turn too!\" \"J-just wait a second, just a little bit longer, just a little bit longer.\" As he said this, the father grew more and more absorbed, tugging the string and letting it slack, gazing up at the sky in sheer delight — looking every bit like a child himself. \"Hey, I'm talking to you! It's MY kite!\" \"Quiet down, will you! I'm at the good part right now.\"" },
    { id:'p6', title:"⑥サゲ", ssml:false, text:"Even as the sun began to sink, the father still wouldn't take his eyes off the kite. Completely ignoring his son, he tugged the string — \"there, there!\" — and let it slacken — \"whoa, whoa!\" — utterly absorbed in a most childish way. Kinbo, left out entirely, crouched on the ground looking thoroughly bored. \"Hey, Pop, isn't it about time you let me have a turn?\" \"No way, not yet, not yet! Look at that, it's up so high, what a great view!\" \"Forget it, I'm bored...\" Still, the father paid him no mind at all, grinning up at the sky as he kept flying the kite. Finally, Kinbo muttered under his breath: \"Ugh, if I'd known it would turn out like this... I shouldn't have bothered bringing Pop along.\" It was the son who'd begged to come in the first place, but once they got there, it was the father who became completely absorbed, leaving his own boy behind — a charmingly funny little tale of a father and son." }
  ],
  'fr': [
    { id:'p1', title:"①まくら", ssml:false, text:"Laissez-moi vous raconter une histoire. Les enfants sont des créatures franches, et ils savent exactement où leurs parents sont faibles. Même après s'être fait dire « non », ils savent que s'ils insistent assez longtemps, tôt ou tard le parent finira par céder. L'histoire d'aujourd'hui, c'est justement ce petit bras de fer entre un père et son fils, lors de la fête du sanctuaire appelée Hatsutenjin." },
    { id:'p2', title:"②お参りに行こう", ssml:false, text:"Le vingt-cinquième jour du Nouvel An est la première fête du sanctuaire de Tenjin de l'année — le fameux Hatsutenjin. Avec toute la ville en effervescence, le fils, le petit Kinbo, supplia son père. « Dis, papa, c'est la fête de Tenjin aujourd'hui, non ? Emmène-moi aussi ! » « Laisse tomber, laisse tomber — si je t'emmène, tu vas te mettre à réclamer d'acheter quelque chose à chaque étal, j'en suis sûr. » « Je ne dirai pas ça, je te promets que non ! S'il te plaît, emmène-moi, emmène-moi ! » Et il s'accrocha à la jambe de son père sans vouloir lâcher prise. Ayant le cœur tendre au fond, le père finit par soupirer : « Bon, tant pis », et se retrouva à emmener le garçon." },
    { id:'p3', title:"③飴玉と団子", ssml:false, text:"À peine arrivés dans l'enceinte du sanctuaire, Kinbo repéra un étal de pommes d'amour. « Waouh, des pommes d'amour ! Papa, achète-m'en une ! » « Tu vois, je te l'avais bien dit. On vient à peine d'arriver et voilà déjà. » « Mais ça a l'air tellement bon ! S'il te plaît, s'il te plaît ! » Le père soupira et ouvrit son porte-monnaie, lui achetant une pomme d'amour. Puis le garçon s'arrêta devant un étal de boulettes de riz. « Oh, ces boulettes ont l'air bonnes aussi ! » « Dis donc, tu viens tout juste d'avoir ta pomme d'amour. » « Les bonbons et les boulettes, ça va dans des estomacs différents ! » Grommelant tout du long, le père finit par desserrer les cordons de sa bourse une fois de plus." },
    { id:'p4', title:"④凧をねだる", ssml:false, text:"Leurs prières terminées et prêts à rentrer, Kinbo s'arrêta net devant un étal de cerfs-volants. « Papa, achète-moi ce cerf-volant ! S'il te plaît ! » « Pas question, pas question, je t'ai déjà acheté des bonbons et des boulettes — si je commence à acheter des cerfs-volants aussi, ça n'en finira jamais. » « C'est pas juste ! Je ne bouge pas tant que tu ne me l'achètes pas ! » Et il se laissa tomber par terre pour faire un caprice, en plein devant tout le monde. Sous le regard des passants, le père finit par céder. « D'accord, d'accord. Je te l'achète — mais en échange, laisse-moi le faire voler aussi, plus tard. » « D'accord, oui ! » Et c'est ainsi que le cerf-volant fut acheté, et tous deux se dirigèrent vers un terrain vague à proximité." },
    { id:'p5', title:"⑤父ちゃん夢中", ssml:false, text:"Arrivé au terrain vague, le père dit : « Laisse d'abord ton vieux père te montrer comment on fait », et se mit à courir, ficelle en main. Le cerf-volant prit le vent et monta doucement, très haut dans le ciel. « Ouah, il vole, il vole ! C'est vraiment génial ! » « Papa, laisse-moi essayer aussi ! » « A-attends une seconde, encore un petit peu, encore un tout petit peu. » Tout en disant cela, le père devenait de plus en plus absorbé, tirant sur la ficelle puis la relâchant, levant les yeux vers le ciel avec un ravissement pur — ressemblant en tout point à un enfant lui-même. « Hé, je te parle ! C'est MON cerf-volant ! » « Silence, tais-toi ! Je suis au meilleur moment là. »" },
    { id:'p6', title:"⑥サゲ", ssml:false, text:"Même quand le soleil commença à décliner, le père ne pouvait toujours pas détacher ses yeux du cerf-volant. Ignorant complètement son fils, il tirait sur la ficelle — « allez, allez ! » — et la relâchait — « oh là là ! » — totalement absorbé, d'une manière on ne peut plus enfantine. Kinbo, complètement mis de côté, s'accroupissait par terre, l'air profondément ennuyé. « Dis, papa, ce n'est pas bientôt mon tour ? » « Pas question, pas encore, pas encore ! Regarde ça, il est si haut, quelle belle vue ! » « Laisse tomber, je m'ennuie... » Pourtant, le père ne lui prêtait aucune attention, souriant vers le ciel tout en continuant de faire voler le cerf-volant. Finalement, Kinbo murmura : « Ah là là, si j'avais su que ça finirait comme ça... je n'aurais pas dû prendre la peine d'amener papa. » C'était pourtant le fils qui avait supplié de venir au départ, mais une fois sur place, c'est le père qui devint complètement absorbé, laissant son propre garçon de côté — une histoire de père et fils charmante et amusante." }
  ],

    { id:'p6', title:"⑥サゲ", ssml:false, text:"Aunque el sol empezaba a ponerse, el padre seguía sin poder apartar la vista de la cometa. Ignorando por completo a su hijo, tiraba del hilo, «¡vamos, vamos!», y lo aflojaba, «¡ay, ay!», completamente absorto de la manera más infantil. Kinbo, totalmente dejado de lado, se agachaba en el suelo con cara de profundo aburrimiento. «Oye, papá, ¿no me toca ya a mí?» «¡Ni hablar, todavía no, todavía no! Mira eso, qué alto está, ¡qué vista tan bonita!» «Déjalo, ya me aburrí...» Aun así, el padre no le prestaba ninguna atención, sonriendo hacia el cielo mientras seguía volando la cometa. Finalmente, Kinbo murmuró para sus adentros: «Ay, si hubiera sabido que iba a terminar así... no debí haberme molestado en traer a papá.» Fue el hijo quien rogó venir en primer lugar, pero una vez allí, fue el padre quien se quedó completamente absorto, dejando atrás a su propio hijo, una entrañable y graciosa historia de padre e hijo." }

const otherLangs = ['en','fr','es'];
const allAudio = {};
let otherDone = 0;
const OTHER_TOTAL = 18;

function initJaUI() {
  const container = document.getElementById('ja-parts');
  jaScripts.forEach((p, i) => {
    container.innerHTML += `
      <div class="part-row">
        <div class="part-title">${p.title}</div>
        <div>
          <div class="part-status" id="ja-status-${p.id}">未生成</div>
          <audio id="ja-audio-${p.id}"></audio>
        </div>
        <button class="btn btn-blue" onclick="generateJaPart(${i})">▶ 生成</button>
        <button class="btn btn-red" id="ja-play-${p.id}" onclick="playJaPart('${p.id}')" disabled>▷ 再生</button>
        <button class="btn btn-green" id="ja-dl-${p.id}" onclick="downloadJaPart(${i})" disabled>⬇ DL</button>
      </div>`;
  });
}

function initOtherUI() {
  const container = document.getElementById('lang-blocks');
  otherLangs.forEach(lang => {
    const parts = otherScripts[lang];
    const badges = parts.map(p => `<span class="part-badge" id="badge-${lang}-${p.id}" onclick="retryOtherPart('${lang}','${p.id}')" title="クリックで生成/再試行">${p.title}</span>`).join('');
    container.innerHTML += `
      <div class="lang-block">
        <div class="lang-title">${langConfig[lang].name} <span style="font-size:11px;color:#888;font-weight:normal;">${langConfig[lang].voice}</span></div>
        <div class="lang-progress">${badges}</div>
        <div class="lang-status" id="lang-status-${lang}">待機中</div>
      </div>`;
  });
}

async function callTTS(langCode, voiceName, text, isSSML) {
  const key = document.getElementById('apiKey').value.trim();
  if (!key) { throw new Error('APIキーが未入力です'); }
  const body = {
    input: isSSML ? { ssml: text } : { text },
    voice: { languageCode: langCode, name: voiceName },
    audioConfig: { audioEncoding: 'MP3' }
  };
  const res = await fetch(
    `https://texttospeech.googleapis.com/v1/text:synthesize?key=${key}`,
    { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
  );
  const data = await res.json();
  if (!data.audioContent) {
    const msg = (data.error && data.error.message) ? `[${data.error.status || res.status}] ${data.error.message}` : `HTTPエラー ${res.status}: ${JSON.stringify(data)}`;
    throw new Error(msg);
  }
  return data.audioContent;
}

async function generateJaPart(idx) {
  const p = jaScripts[idx];
  const status = document.getElementById(`ja-status-${p.id}`);
  status.textContent = '生成中...';
  status.className = 'part-status active';
  try {
    const b64 = await callTTS('ja-JP', 'ja-JP-Chirp3-HD-Charon', p.text, p.ssml);
    allAudio[`ja-${p.id}`] = b64;
    const audio = document.getElementById(`ja-audio-${p.id}`);
    audio.src = 'data:audio/mp3;base64,' + b64;
    status.textContent = '✅ 完成！';
    status.className = 'part-status done';
    document.getElementById(`ja-play-${p.id}`).disabled = false;
    document.getElementById(`ja-dl-${p.id}`).disabled = false;
    updateJaProgress();
  } catch (e) {
    status.textContent = '❌ ' + e.message;
    status.className = 'part-status error';
    status.title = e.message;
  }
}

function playJaPart(id) {
  document.getElementById(`ja-audio-${id}`).play();
}

function downloadJaPart(idx) {
  const p = jaScripts[idx];
  const key = `ja-${p.id}`;
  if (!allAudio[key]) return;
  const a = document.createElement('a');
  a.href = 'data:audio/mp3;base64,' + allAudio[key];
  a.download = `ja_p${idx+1}.mp3`;
  a.click();
}

async function generateAllJa() {
  for (let i = 0; i < jaScripts.length; i++) {
    await generateJaPart(i);
    await new Promise(r => setTimeout(r, 300));
  }
}

async function downloadAllJa() {
  for (let i = 0; i < jaScripts.length; i++) {
    const key = `ja-${jaScripts[i].id}`;
    if (!allAudio[key]) continue;
    const a = document.createElement('a');
    a.href = 'data:audio/mp3;base64,' + allAudio[key];
    a.download = `ja_p${i+1}.mp3`;
    a.click();
    await new Promise(r => setTimeout(r, 200));
  }
}

function updateJaProgress() {
  const done = jaScripts.filter(p => allAudio[`ja-${p.id}`]).length;
  document.getElementById('ja-bar').style.width = (done / jaScripts.length * 100) + '%';
  document.getElementById('ja-label').textContent = `${done} / ${jaScripts.length} パート完了`;
  if (done === jaScripts.length) {
    document.getElementById('dl-all-ja').disabled = false;
    document.getElementById('ja-label').textContent = `✅ 日本語 全${jaScripts.length}パート完成！`;
  }
}

async function startAll() {
  const key = document.getElementById('apiKey').value.trim();
  if (!key) { alert('APIキーを入力してください'); return; }
  document.getElementById('start-all').disabled = true;
  otherDone = 0;
  let lastError = '';
  for (const lang of otherLangs) {
    const parts = otherScripts[lang];
    document.getElementById(`lang-status-${lang}`).textContent = '生成中...';
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      const badge = document.getElementById(`badge-${lang}-${p.id}`);
      badge.className = 'part-badge active';
      try {
        const b64 = await callTTS(langConfig[lang].langCode, langConfig[lang].voice, p.text, p.ssml);
        allAudio[`${lang}-${p.id}`] = b64;
        badge.className = 'part-badge done';
        badge.title = '✅ 生成済み（クリックで再生成）';
        otherDone++;
        document.getElementById('all-bar').style.width = (otherDone / OTHER_TOTAL * 100) + '%';
        document.getElementById('all-label').textContent = `生成中... (${otherDone} / ${OTHER_TOTAL})`;
      } catch(e) {
        badge.className = 'part-badge error';
        badge.title = e.message + '（クリックで再試行）';
        lastError = `${langConfig[lang].name} ${p.title}: ${e.message}`;
      }
      await new Promise(r => setTimeout(r, 300));
    }
    document.getElementById(`lang-status-${lang}`).textContent = '✅ 完了';
  }
  document.getElementById('all-label').textContent = lastError
    ? `⚠️ ${otherDone} / ${OTHER_TOTAL} 件成功。失敗あり（赤いバッジをクリックで再試行）。最後のエラー: ${lastError}`
    : `✅ 全${otherDone}ファイル生成完了！`;
  document.getElementById('start-all').disabled = false;
  document.getElementById('dl-all').disabled = false;
}

async function retryOtherPart(lang, id) {
  const parts = otherScripts[lang];
  const idx = parts.findIndex(p => p.id === id);
  if (idx === -1) return;
  const p = parts[idx];
  const badge = document.getElementById(`badge-${lang}-${id}`);
  badge.className = 'part-badge active';
  try {
    const b64 = await callTTS(langConfig[lang].langCode, langConfig[lang].voice, p.text, p.ssml);
    allAudio[`${lang}-${id}`] = b64;
    badge.className = 'part-badge done';
    badge.title = '✅ 生成済み（クリックで再生成）';
    document.getElementById('dl-all').disabled = false;
    const a = document.createElement('a');
    a.href = 'data:audio/mp3;base64,' + b64;
    a.download = `${lang}_p${idx+1}.mp3`;
    a.click();
  } catch(e) {
    badge.className = 'part-badge error';
    badge.title = e.message + '（クリックで再試行）';
    alert(`${langConfig[lang].name} ${p.title} の生成に失敗しました。

${e.message}`);
  }
}

async function downloadAll() {
  const langs = ['ja', ...otherLangs];
  const allScripts = { ja: jaScripts, ...otherScripts };
  for (const lang of langs) {
    const parts = allScripts[lang];
    for (let i = 0; i < parts.length; i++) {
      const key = `${lang}-${parts[i].id}`;
      if (!allAudio[key]) continue;
      const a = document.createElement('a');
      a.href = 'data:audio/mp3;base64,' + allAudio[key];
      a.download = `${lang}_p${i+1}.mp3`;
      a.click();
      await new Promise(r => setTimeout(r, 200));
    }
  }
}

initJaUI();
initOtherUI();
</script>
