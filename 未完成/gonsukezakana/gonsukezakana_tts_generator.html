const jaScripts = [
  { id:'p1', title:"①まくら", ssml:true, text:"<speak><prosody rate=\"106%\" pitch=\"0st\">え〜、一席申し上げますが。正直者は損をする、なんてことを申しますが、いえいえ、正直に生きるのが一番でございます。<break time=\"500ms\"/>とは言うものの、あんまり馬鹿正直すぎますと、かえって話がややこしくなることもございましてね。<break time=\"400ms\"/>世の旦那衆という者は、たまに御贔屓のお方のところへ忍んで行きたいがために、いろいろと知恵を絞るものでございますが、その道具に使われる奉公人がまた、生まれついての正直者だったりすると、これがとんだ騒動になる。<break time=\"500ms\"/>今日はそんな、とびきり正直な田舎者の権助という奉公人が、旦那様の色恋沙汰の尻拭いをさせられて、とんだ大騒動になるという、ちょいと間の抜けたお話を一席。<break time=\"700ms\"/></prosody></speak>" },
  { id:'p2', title:"②旦那の企み", ssml:true, text:"<speak><prosody rate=\"106%\" pitch=\"0st\">ある商家の旦那、実は町の向こうに贔屓にしているお方がおりまして、これがどうにも頭から離れない。かといって、女房に怪しまれずに家を空けるのは容易なことではございません。そこで旦那、ある日のこと、にこにこ顔で女房に持ちかけます。<break time=\"500ms\"/></prosody><prosody rate=\"100%\" pitch=\"+1st\">おかみさん、今日はいい天気だ。たまには権助を連れて、舟で釣りにでも行っておいでな。<break time=\"500ms\"/></prosody><prosody rate=\"110%\" pitch=\"0st\">実はこれ、旦那の魂胆でございまして、女房を外へ出しておいて、その隙にこっそり贔屓のお方のところへしけこもうという寸法。女房は何も知らず、まあ、それは結構ですことと、支度を始めます。<break time=\"600ms\"/></prosody></speak>" },
  { id:'p3', title:"③権助への言いつけ", ssml:true, text:"<speak><prosody rate=\"106%\" pitch=\"0st\">旦那、権助を裏へ呼びつけて、こっそり耳打ち。<break time=\"400ms\"/></prosody><prosody rate=\"95%\" pitch=\"-1st\">いいか権助、お前は今日、お上さんのお供をして舟で釣りに行くんだ。もし誰かに、旦那はどこへ行ったと聞かれたら、旦那様も一緒に魚釣りに行きましたと、そう言うんだぞ。わかったな。<break time=\"500ms\"/></prosody><prosody rate=\"118%\" pitch=\"+1st\">へえ、旦那様も御一緒に魚釣りへ、と申せばよろしいので。<break time=\"400ms\"/></prosody><prosody rate=\"95%\" pitch=\"-1st\">そうだ、そう言っておけばいい。<break time=\"400ms\"/></prosody><prosody rate=\"108%\" pitch=\"0st\">権助は根っからの正直者、二つ返事で引き受けますが、生まれてこの方、人を騙すなどという器用な真似をしたことがございません。<break time=\"700ms\"/></prosody></speak>" },
  { id:'p4', title:"④嘘を本当にしようとする", ssml:true, text:"<speak><prosody rate=\"106%\" pitch=\"0st\">女房と権助、舟で本当に出掛けます。ところが権助、旦那の嘘を本当のことにしておかなくちゃと生真面目に考え、女房に向かってこう言い出します。<break time=\"450ms\"/></prosody><prosody rate=\"112%\" pitch=\"-1st\">さあ、奥様、旦那様も魚釣りへ行ったと申し上げにゃなりませんので、今日は本当に魚を釣らなくてはいけません。<break time=\"450ms\"/></prosody><prosody rate=\"106%\" pitch=\"0st\">と言って、慣れない竿を振り回し、本気で釣りに没頭してしまいます。女房は権助の様子がどうも妙だと気付き始めます。<break time=\"400ms\"/></prosody><prosody rate=\"100%\" pitch=\"0st\">おや、権助や、そんなに一生懸命にならなくてもいいんだよ。<break time=\"400ms\"/></prosody><prosody rate=\"118%\" pitch=\"-1st\">いえ、そういうわけには参りません!<break time=\"500ms\"/></prosody></speak>" },
  { id:'p5', title:"⑤ばれる遣り取り", ssml:true, text:"<speak><prosody rate=\"106%\" pitch=\"0st\">女房、権助の態度から何かを勘付き始め、鎌をかけて尋ねます。<break time=\"400ms\"/></prosody><prosody rate=\"98%\" pitch=\"0st\">権助や、旦那様は今日、どちらへおいでなのだえ。<break time=\"450ms\"/></prosody><prosody rate=\"128%\" pitch=\"+1st\">へえ、旦那様は、あの…その、なんですが…魚釣りに、あ、いえ、それは私どもで、旦那様は…あの、御贔屓の…<break time=\"500ms\"/></prosody><prosody rate=\"104%\" pitch=\"0st\">としどろもどろになって、かえって墓穴を掘り、隠し事があることも、女の影があることも、全部ばらしてしまいます。<break time=\"400ms\"/></prosody><prosody rate=\"95%\" pitch=\"0st\">ほほう、御贔屓の、ねえ。<break time=\"400ms\"/></prosody><prosody rate=\"130%\" pitch=\"+2st\">あっ! い、いえ、今のは何でもございません!<break time=\"600ms\"/></prosody><prosody rate=\"100%\" pitch=\"0st\">と真っ青になりますが、時すでに遅し。<break time=\"600ms\"/></prosody></speak>" },
  { id:'p6', title:"⑥サゲ", ssml:true, text:"<speak><prosody rate=\"104%\" pitch=\"0st\">女房、すべてを察して、静かに権助に言います。<break time=\"400ms\"/></prosody><prosody rate=\"96%\" pitch=\"0st\">なるほど、よくわかったよ。権助、お前は正直で結構だけどねぇ。<break time=\"450ms\"/></prosody><prosody rate=\"112%\" pitch=\"+1st\">へえ、あたしは旦那様の仰る通り、ちゃんと魚釣りに行ったと申し上げましたが。<break time=\"450ms\"/></prosody><prosody rate=\"96%\" pitch=\"0st\">ああ、それは本当のことだろうさ。魚釣りに行ったのは、あたしとお前だけ。旦那が食いついたのは、どうやら別の魚だったようだね。<break time=\"700ms\"/></prosody><prosody rate=\"100%\" pitch=\"0st\">と、にっこり笑って舟の上で釣竿を置いたという、これがサゲでございます。<break time=\"600ms\"/></prosody></speak>" }

const otherScripts = {
  'en': [
    { id:'p1', title:"①まくら", ssml:false, text:"Well now, let me tell you a story. They say honest people always lose out in the end — but no, no, living honestly is truly the best way to live. That said, when someone is honest to the point of sheer foolishness, it can twist a simple situation into an awful tangle. You see, a certain kind of gentleman likes, now and then, to sneak off to visit a lady he's fond of, and dreams up all sorts of clever schemes to manage it — but when the servant he uses as his tool happens to be honest to the bone, it all turns into an almighty mess. Today's tale is about just such a servant: an artlessly honest country fellow named Gonsuke, forced to cover up his master's little romance, with hilariously disastrous results." },
    { id:'p2', title:"②旦那の企み", ssml:false, text:"There was a certain merchant who, truth be told, had a lady he was fond of clear across town, and he simply couldn't get her out of his head. But slipping out of the house without arousing his wife's suspicion was no easy matter. So one day, putting on his sweetest smile, he made a suggestion to her. \"My dear, it's such fine weather today. Why don't you take Gonsuke along and go out fishing on a boat for once?\" In truth, this was all a scheme — get his wife out of the house, and in that gap, sneak off himself to see his sweetheart. His wife, suspecting nothing at all, says \"Oh, how lovely,\" and begins getting ready to go." },
    { id:'p3', title:"③権助への言いつけ", ssml:false, text:"The master calls Gonsuke around back and whispers to him in secret. \"Now listen, Gonsuke. Today you're going along with the mistress as her escort on a fishing boat. If anyone asks where I've gone, you're to say, 'The master went fishing along with us too.' Say exactly that, understand?\" \"Yessir, so I'm to say the master went along fishing too, is that right?\" \"That's it, just say that and you'll be fine.\" Gonsuke, an honest man through and through, agrees without a second thought — but the truth is, in his whole life, he has never once managed the delicate art of deceiving anybody." },
    { id:'p4', title:"④嘘を本当にしようとする", ssml:false, text:"The mistress and Gonsuke really do set out on the boat. But Gonsuke, taking his master's lie with dead seriousness, decides that they simply must \"make it true\" — and turns to the mistress with this declaration: \"Now then, ma'am, since we're going to have to say the master went fishing too, we really do have to catch some fish today.\" And with that, he starts flailing about with a fishing pole he's never used in his life, throwing himself with total earnestness into actually catching fish. The mistress begins to notice that something about Gonsuke is rather odd. \"Now, now, Gonsuke, you needn't work quite so hard at it.\" \"No ma'am, that simply won't do!\"" },
    { id:'p5', title:"⑤ばれる遣り取り", ssml:false, text:"The mistress starts to sense something is off in Gonsuke's manner, and casts out a leading question. \"Say, Gonsuke, where has the master really gone off to today?\" Gonsuke, being far too honest for his own good, can't get the words out fast enough, and stammers: \"Yes ma'am, the master is, um... that is, well... gone fishing, ah, no, that's us, the master is... um, off at the place of that lady he's fond of...\" And in his stumbling confusion, he digs his own grave completely, giving away both the fact that there was something being hidden and the fact that there's another woman involved. \"Oh ho. 'The lady he's fond of,' is it?\" \"Ah! N-no, that, that was nothing, I didn't say anything!\" Gonsuke turns pale as a sheet — but it's already far too late." },
    { id:'p6', title:"⑥サゲ", ssml:false, text:"The mistress, having pieced it all together, says quietly to Gonsuke: \"I see. Now I understand perfectly. Gonsuke, being honest is a fine thing, you know.\" \"Yes ma'am, and just as the master told me, I properly said we'd gone fishing.\" \"Ah, well, that much is true enough. The only ones who actually went fishing today were you and me. It seems the master's the one who took the bait — from an entirely different fish.\" And with a quiet smile, she sets down her fishing pole there in the boat. And that, ladies and gentlemen, is the punchline." }
  ],
  'fr': [
    { id:'p1', title:"①まくら", ssml:false, text:"Eh bien, laissez-moi vous conter une histoire. On dit que les honnêtes gens sont toujours perdants — mais non, non, vivre honnêtement reste la meilleure des choses. Cela dit, quand quelqu'un est honnête au point d'en être bête, cela peut transformer une situation toute simple en un embrouillamini terrible. Voyez-vous, certains messieurs aiment, de temps à autre, aller retrouver en cachette une dame qu'ils apprécient, et inventent mille stratagèmes astucieux pour y parvenir — mais quand le serviteur dont ils se servent comme outil se trouve être honnête jusqu'à la moelle, tout tourne au désastre le plus cocasse. L'histoire d'aujourd'hui parle justement d'un tel serviteur : un paysan d'une honnêteté maladroite nommé Gonsuke, forcé de couvrir la petite idylle de son maître, avec des résultats aussi désastreux qu'hilarants." },
    { id:'p2', title:"②旦那の企み", ssml:false, text:"Il y avait un certain marchand qui, à vrai dire, avait une dame qu'il aimait bien de l'autre côté de la ville, et il n'arrivait tout simplement pas à se l'ôter de l'esprit. Mais quitter la maison sans éveiller les soupçons de sa femme n'était pas chose facile. Alors un jour, arborant son plus doux sourire, il lui fit une suggestion. « Ma chère, quel beau temps aujourd'hui. Pourquoi n'emmènerais-tu pas Gonsuke faire une sortie en barque pour pêcher, pour une fois ? » En vérité, tout cela n'était qu'un stratagème — faire sortir sa femme de la maison, et profiter de cette absence pour filer en douce voir sa bien-aimée. Sa femme, ne soupçonnant rien du tout, dit « Oh, quelle bonne idée », et commence à se préparer." },
    { id:'p3', title:"③権助への言いつけ", ssml:false, text:"Le maître appelle Gonsuke derrière la maison et lui chuchote en secret. « Écoute bien, Gonsuke. Aujourd'hui, tu accompagnes madame en bateau pour la pêche. Si quelqu'un te demande où je suis allé, tu diras : « Le maître est venu pêcher avec nous aussi. » Dis exactement cela, compris ? » « Oui monsieur, donc je dois dire que le maître est venu pêcher avec nous aussi, c'est bien ça ? » « C'est cela, dis simplement ça et tout ira bien. » Gonsuke, honnête jusqu'à la moelle, accepte sans la moindre hésitation — mais la vérité, c'est que de toute sa vie, il n'a jamais réussi l'art délicat de tromper qui que ce soit." },
    { id:'p4', title:"④嘘を本当にしようとする", ssml:false, text:"La maîtresse de maison et Gonsuke partent réellement en barque. Mais Gonsuke, prenant le mensonge de son maître on ne peut plus au sérieux, décide qu'il faut absolument « le rendre vrai » — et se tourne vers elle avec cette déclaration : « Bon, madame, puisqu'il faudra dire que le maître est aussi venu pêcher, il faut vraiment que nous attrapions du poisson aujourd'hui. » Sur ce, il se met à agiter frénétiquement une canne à pêche qu'il n'a jamais utilisée de sa vie, se jetant avec un sérieux total dans la pêche véritable. La maîtresse commence à remarquer que quelque chose cloche chez Gonsuke. « Voyons, Gonsuke, tu n'as pas besoin de t'y mettre avec autant d'ardeur. » « Non madame, cela ne peut pas convenir ! »" },
    { id:'p5', title:"⑤ばれる遣り取り", ssml:false, text:"La maîtresse commence à sentir que quelque chose cloche dans l'attitude de Gonsuke, et lance une question insidieuse. « Dis-moi, Gonsuke, où est vraiment allé le maître aujourd'hui ? » Gonsuke, bien trop honnête pour son propre bien, ne parvient pas à trouver ses mots assez vite et bafouille : « Oui madame, le maître est, euh... c'est-à-dire, eh bien... parti pêcher, ah, non, ça c'est nous, le maître est... euh, chez cette dame qu'il apprécie... » Et dans sa confusion balbutiante, il se creuse lui-même sa tombe, révélant à la fois qu'il y avait quelque chose de caché et qu'une autre femme était impliquée. « Oh, tiens donc. « Cette dame qu'il apprécie », vraiment ? » « Ah ! N-non, ça, ce n'était rien, je n'ai rien dit ! » Gonsuke devient blanc comme un linge — mais il est déjà bien trop tard." },
    { id:'p6', title:"⑥サゲ", ssml:false, text:"La maîtresse, ayant tout reconstitué, dit calmement à Gonsuke : « Je vois. Maintenant je comprends parfaitement. Gonsuke, être honnête, c'est une belle qualité, tu sais. » « Oui madame, et exactement comme me l'a dit le maître, j'ai bien dit qu'on était allés pêcher. » « Ah, eh bien, cela au moins est bien vrai. Les seuls à être vraiment allés pêcher aujourd'hui, c'est toi et moi. On dirait que c'est le maître qui a mordu à l'hameçon — mais pour un tout autre poisson. » Et avec un sourire tranquille, elle repose sa canne à pêche là, dans la barque. Et voilà, mesdames et messieurs, la chute de l'histoire." }
  ],
  'es': [
    { id:'p1', title:"①まくら", ssml:false, text:"Bueno, déjenme contarles una historia. Dicen que la gente honesta siempre sale perdiendo — pero no, no, vivir con honestidad sigue siendo lo mejor. Dicho esto, cuando alguien es honesto hasta el punto de la necedad, puede convertir una situación sencilla en un enredo terrible. Verán, cierto tipo de caballero gusta, de vez en cuando, de escaparse a escondidas para ver a una dama que le agrada, e inventa toda clase de artimañas para lograrlo — pero cuando el sirviente al que usa como herramienta resulta ser honesto hasta la médula, todo se convierte en un desastre de lo más cómico. La historia de hoy trata justamente de un sirviente así: un campesino de una honestidad torpe llamado Gonsuke, obligado a encubrir el pequeño romance de su amo, con resultados tan desastrosos como hilarantes." },
    { id:'p2', title:"②旦那の企み", ssml:false, text:"Había cierto comerciante que, a decir verdad, tenía una dama que le gustaba al otro lado de la ciudad, y sencillamente no podía quitársela de la cabeza. Pero salir de casa sin despertar las sospechas de su esposa no era tarea fácil. Así que un día, con su sonrisa más dulce, le hizo una sugerencia. «Querida, hace un tiempo espléndido hoy. ¿Por qué no llevas a Gonsuke y sales a pescar en un bote, para variar?» En realidad, todo esto era una artimaña: sacar a su esposa de casa y, en ese hueco, escabullirse él para ver a su amada. Su esposa, sin sospechar nada, dice «Ay, qué buena idea», y comienza a prepararse." },
    { id:'p3', title:"③権助への言いつけ", ssml:false, text:"El amo llama a Gonsuke detrás de la casa y le susurra en secreto. «Escucha bien, Gonsuke. Hoy acompañarás a la señora en un bote de pesca. Si alguien te pregunta adónde fui, dirás: «El amo también vino a pescar con nosotros.» Di exactamente eso, ¿entendido?» «Sí, señor, entonces debo decir que el amo también vino a pescar con nosotros, ¿verdad?» «Eso es, di solo eso y todo saldrá bien.» Gonsuke, honesto hasta la médula, acepta sin pensarlo dos veces — pero la verdad es que, en toda su vida, jamás ha logrado el delicado arte de engañar a nadie." },
    { id:'p4', title:"④嘘を本当にしようとする", ssml:false, text:"La señora y Gonsuke salen de verdad en el bote. Pero Gonsuke, tomándose la mentira de su amo con total seriedad, decide que hay que «hacerla realidad» — y se dirige a ella con esta declaración: «Bien, señora, ya que habrá que decir que el amo también vino a pescar, hoy tenemos que pescar de verdad.» Y dicho esto, se pone a agitar frenéticamente una caña de pescar que jamás ha usado en su vida, entregándose con total seriedad a pescar de verdad. La señora empieza a notar que algo anda raro con Gonsuke. «Vamos, Gonsuke, no hace falta que te esfuerces tanto.» «No, señora, ¡eso no puede ser!»" },
    { id:'p5', title:"⑤ばれる遣り取り", ssml:false, text:"La señora empieza a notar que algo no encaja en la actitud de Gonsuke, y lanza una pregunta capciosa. «Dime, Gonsuke, ¿adónde ha ido realmente el amo hoy?» Gonsuke, demasiado honesto para su propio bien, no logra encontrar las palabras a tiempo y balbucea: «Sí, señora, el amo está, eh... es decir, bueno... se fue a pescar, ah, no, eso somos nosotros, el amo está... eh, donde esa dama que le gusta...» Y en su confusión tartamudeante, cava su propia tumba por completo, revelando tanto que había algo oculto como que había otra mujer de por medio. «Vaya, vaya. ¿«Esa dama que le gusta», eh?» «¡Ah! N-no, eso, eso no fue nada, ¡no dije nada!» Gonsuke se pone pálido como un papel — pero ya es demasiado tarde." },
    { id:'p6', title:"⑥サゲ", ssml:false, text:"La señora, habiendo atado cabos, le dice tranquilamente a Gonsuke: «Ya veo. Ahora lo entiendo perfectamente. Gonsuke, ser honesto es una buena cualidad, ¿sabes?» «Sí, señora, y tal como me dijo el amo, dije correctamente que habíamos ido a pescar.» «Ah, bueno, eso sí que es verdad. Los únicos que de verdad fueron a pescar hoy fuimos tú y yo. Parece que el amo es quien mordió el anzuelo — pero de un pez muy distinto.» Y con una sonrisa tranquila, deja la caña de pescar allí, en el bote. Y ese, damas y caballeros, es el remate del cuento." }
  ]
};

const otherLangs = ['en','fr','es'];
const allAudio = {};
let otherDone = 0;
const OTHER_TOTAL = 18;

function initJaUI() {
  const container = document.getElementById('ja-parts');
  jaScripts.forEach((p, i) => {
    container.innerHTML += `
      <div class="part-row">
        <div class="part-title">${p.title}</div>
        <div>
          <div class="part-status" id="ja-status-${p.id}">未生成</div>
          <audio id="ja-audio-${p.id}"></audio>
        </div>
        <button class="btn btn-blue" onclick="generateJaPart(${i})">▶ 生成</button>
        <button class="btn btn-red" id="ja-play-${p.id}" onclick="playJaPart('${p.id}')" disabled>▷ 再生</button>
        <button class="btn btn-green" id="ja-dl-${p.id}" onclick="downloadJaPart(${i})" disabled>⬇ DL</button>
      </div>`;
  });
}

function initOtherUI() {
  const container = document.getElementById('lang-blocks');
  otherLangs.forEach(lang => {
    const parts = otherScripts[lang];
    const badges = parts.map(p => `<span class="part-badge" id="badge-${lang}-${p.id}" onclick="retryOtherPart('${lang}','${p.id}')" title="クリックで生成/再試行">${p.title}</span>`).join('');
    container.innerHTML += `
      <div class="lang-block">
        <div class="lang-title">${langConfig[lang].name} <span style="font-size:11px;color:#888;font-weight:normal;">${langConfig[lang].voice}</span></div>
        <div class="lang-progress">${badges}</div>
        <div class="lang-status" id="lang-status-${lang}">待機中</div>
      </div>`;
  });
}

async function callTTS(langCode, voiceName, text, isSSML) {
  const key = document.getElementById('apiKey').value.trim();
  if (!key) { throw new Error('APIキーが未入力です'); }
  const body = {
    input: isSSML ? { ssml: text } : { text },
    voice: { languageCode: langCode, name: voiceName },
    audioConfig: { audioEncoding: 'MP3' }
  };
  const res = await fetch(
    `https://texttospeech.googleapis.com/v1/text:synthesize?key=${key}`,
    { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
  );
  const data = await res.json();
  if (!data.audioContent) {
    const msg = (data.error && data.error.message) ? `[${data.error.status || res.status}] ${data.error.message}` : `HTTPエラー ${res.status}: ${JSON.stringify(data)}`;
    throw new Error(msg);
  }
  return data.audioContent;
}

async function generateJaPart(idx) {
  const p = jaScripts[idx];
  const status = document.getElementById(`ja-status-${p.id}`);
  status.textContent = '生成中...';
  status.className = 'part-status active';
  try {
    const b64 = await callTTS('ja-JP', 'ja-JP-Chirp3-HD-Charon', p.text, p.ssml);
    allAudio[`ja-${p.id}`] = b64;
    const audio = document.getElementById(`ja-audio-${p.id}`);
    audio.src = 'data:audio/mp3;base64,' + b64;
    status.textContent = '✅ 完成！';
    status.className = 'part-status done';
    document.getElementById(`ja-play-${p.id}`).disabled = false;
    document.getElementById(`ja-dl-${p.id}`).disabled = false;
    updateJaProgress();
  } catch (e) {
    status.textContent = '❌ ' + e.message;
    status.className = 'part-status error';
    status.title = e.message;
  }
}

function playJaPart(id) {
  document.getElementById(`ja-audio-${id}`).play();
}

function downloadJaPart(idx) {
  const p = jaScripts[idx];
  const key = `ja-${p.id}`;
  if (!allAudio[key]) return;
  const a = document.createElement('a');
  a.href = 'data:audio/mp3;base64,' + allAudio[key];
  a.download = `ja_p${idx+1}.mp3`;
  a.click();
}

async function generateAllJa() {
  for (let i = 0; i < jaScripts.length; i++) {
    await generateJaPart(i);
    await new Promise(r => setTimeout(r, 300));
  }
}

async function downloadAllJa() {
  for (let i = 0; i < jaScripts.length; i++) {
    const key = `ja-${jaScripts[i].id}`;
    if (!allAudio[key]) continue;
    const a = document.createElement('a');
    a.href = 'data:audio/mp3;base64,' + allAudio[key];
    a.download = `ja_p${i+1}.mp3`;
    a.click();
    await new Promise(r => setTimeout(r, 200));
  }
}

function updateJaProgress() {
  const done = jaScripts.filter(p => allAudio[`ja-${p.id}`]).length;
  document.getElementById('ja-bar').style.width = (done / jaScripts.length * 100) + '%';
  document.getElementById('ja-label').textContent = `${done} / ${jaScripts.length} パート完了`;
  if (done === jaScripts.length) {
    document.getElementById('dl-all-ja').disabled = false;
    document.getElementById('ja-label').textContent = `✅ 日本語 全${jaScripts.length}パート完成！`;
  }
}

async function startAll() {
  const key = document.getElementById('apiKey').value.trim();
  if (!key) { alert('APIキーを入力してください'); return; }
  document.getElementById('start-all').disabled = true;
  otherDone = 0;
  let lastError = '';
  for (const lang of otherLangs) {
    const parts = otherScripts[lang];
    document.getElementById(`lang-status-${lang}`).textContent = '生成中...';
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      const badge = document.getElementById(`badge-${lang}-${p.id}`);
      badge.className = 'part-badge active';
      try {
        const b64 = await callTTS(langConfig[lang].langCode, langConfig[lang].voice, p.text, p.ssml);
        allAudio[`${lang}-${p.id}`] = b64;
        badge.className = 'part-badge done';
        badge.title = '✅ 生成済み（クリックで再生成）';
        otherDone++;
        document.getElementById('all-bar').style.width = (otherDone / OTHER_TOTAL * 100) + '%';
        document.getElementById('all-label').textContent = `生成中... (${otherDone} / ${OTHER_TOTAL})`;
      } catch(e) {
        badge.className = 'part-badge error';
        badge.title = e.message + '（クリックで再試行）';
        lastError = `${langConfig[lang].name} ${p.title}: ${e.message}`;
      }
      await new Promise(r => setTimeout(r, 300));
    }
    document.getElementById(`lang-status-${lang}`).textContent = '✅ 完了';
  }
  document.getElementById('all-label').textContent = lastError
    ? `⚠️ ${otherDone} / ${OTHER_TOTAL} 件成功。失敗あり（赤いバッジをクリックで再試行）。最後のエラー: ${lastError}`
    : `✅ 全${otherDone}ファイル生成完了！`;
  document.getElementById('start-all').disabled = false;
  document.getElementById('dl-all').disabled = false;
}

async function retryOtherPart(lang, id) {
  const parts = otherScripts[lang];
  const idx = parts.findIndex(p => p.id === id);
  if (idx === -1) return;
  const p = parts[idx];
  const badge = document.getElementById(`badge-${lang}-${id}`);
  badge.className = 'part-badge active';
  try {
    const b64 = await callTTS(langConfig[lang].langCode, langConfig[lang].voice, p.text, p.ssml);
    allAudio[`${lang}-${id}`] = b64;
    badge.className = 'part-badge done';
    badge.title = '✅ 生成済み（クリックで再生成）';
    document.getElementById('dl-all').disabled = false;
    const a = document.createElement('a');
    a.href = 'data:audio/mp3;base64,' + b64;
    a.download = `${lang}_p${idx+1}.mp3`;
    a.click();
  } catch(e) {
    badge.className = 'part-badge error';
    badge.title = e.message + '（クリックで再試行）';
    alert(`${langConfig[lang].name} ${p.title} の生成に失敗しました。

${e.message}`);
  }
}

async function downloadAll() {
  const langs = ['ja', ...otherLangs];
  const allScripts = { ja: jaScripts, ...otherScripts };
  for (const lang of langs) {
    const parts = allScripts[lang];
    for (let i = 0; i < parts.length; i++) {
      const key = `${lang}-${parts[i].id}`;
      if (!allAudio[key]) continue;
      const a = document.createElement('a');
      a.href = 'data:audio/mp3;base64,' + allAudio[key];
      a.download = `${lang}_p${i+1}.mp3`;
      a.click();
      await new Promise(r => setTimeout(r, 200));
    }
  }
}

initJaUI();
initOtherUI();
</script>
