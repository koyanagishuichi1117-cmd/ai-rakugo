// UI初期化
function initUI() {
  const container = document.getElementById('lang-blocks');
  container.innerHTML = '';
  langOrder.forEach(lang => {
    const parts = scripts[lang];
    const badges = parts.map(p => `<span class="part-badge" id="badge-${lang}-${p.id}">${p.title}</span>`).join('');
    container.innerHTML += `
      <div class="lang-block">
        <div class="lang-title">${langConfig[lang].name} <span style="font-size:11px;color:#888;font-weight:normal;">${langConfig[lang].voice}</span></div>
        <div class="lang-progress">${badges}</div>
        <div class="lang-status" id="lang-status-${lang}">待機中</div>
      </div>`;
  });
}

async function callTTS(lang, text, isSSML) {
  const key = document.getElementById('apiKey').value.trim();
  const cfg = langConfig[lang];
  const body = {
    input: isSSML ? { ssml: text } : { text },
    voice: { languageCode: cfg.langCode, name: cfg.voice },
    audioConfig: { audioEncoding: 'MP3' }
  };
  const res = await fetch(
    `https://texttospeech.googleapis.com/v1/text:synthesize?key=${key}`,
    { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
  );
  const data = await res.json();
  if (!data.audioContent) throw new Error(JSON.stringify(data));
  return data.audioContent;
}

  totalDone = 0;
  document.getElementById('start-btn').disabled = true;
  document.getElementById('dl-btn').disabled = true;
  document.getElementById('overall-label').textContent = '生成中... (0 / 42)';

  for (const lang of langOrder) {
    const parts = scripts[lang];
    document.getElementById(`lang-status-${lang}`).textContent = '生成中...';

    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      const badge = document.getElementById(`badge-${lang}-${p.id}`);
      badge.className = 'part-badge active';

      try {
        const b64 = await callTTS(lang, p.text, p.ssml);
        allAudio[`${lang}-${p.id}`] = b64;
        badge.className = 'part-badge done';
        totalDone++;
        const pct = Math.round(totalDone / TOTAL * 100);
        document.getElementById('overall-bar').style.width = pct + '%';
        document.getElementById('overall-label').textContent = `生成中... (${totalDone} / ${TOTAL})`;
      } catch(e) {
        badge.className = 'part-badge error';
        badge.style.cursor = 'pointer';
        badge.title = 'クリックでリトライ';
        badge.onclick = async () => {
          badge.className = 'part-badge active';
          try {
            const b64 = await callTTS(lang, p.text, p.ssml);
            allAudio[`${lang}-${p.id}`] = b64;
            badge.className = 'part-badge done';
            badge.onclick = null;
            totalDone++;
            document.getElementById('overall-label').textContent = `✅ 全${totalDone} / 35ファイル生成完了！`;
          } catch(e) {
            badge.className = 'part-badge error';
          }
        };
        document.getElementById(`lang-status-${lang}`).textContent = `❌ エラー: ${p.title}`;
      }

      await new Promise(r => setTimeout(r, 300));
    }
    document.getElementById(`lang-status-${lang}`).textContent = '✅ 完了';
  }

  document.getElementById('overall-label').textContent = `✅ 全${totalDone} / 35ファイル生成完了！`;
  document.getElementById('start-btn').disabled = false;
  document.getElementById('dl-btn').disabled = false;
}

async function downloadAll() {
  const keys = Object.keys(allAudio);
  if (keys.length === 0) { alert('先に生成してください'); return; }

  // 言語ごとにまとめてDL
  // ファイル名: tokisoba_ja_p1.mp3 など（フォルダ構成: tokisoba/ja/p1.mp3 を意識）
  for (const lang of langOrder) {
    const parts = scripts[lang];
    for (let i = 0; i < parts.length; i++) {
      const key = `${lang}-${parts[i].id}`;
      if (!allAudio[key]) continue;
      const a = document.createElement('a');
      a.href = 'data:audio/mp3;base64,' + allAudio[key];
      // フォルダ構成がわかるようにファイル名に言語を含める
      a.download = `${lang}_p${i+1}.mp3`;
      a.click();
      await new Promise(r => setTimeout(r, 200));
    }
  }

  alert('ダウンロード完了！\n\n全ファイルを落語デモ_v3.htmlと同じフォルダに入れてください！');
}

initUI();
</script>
