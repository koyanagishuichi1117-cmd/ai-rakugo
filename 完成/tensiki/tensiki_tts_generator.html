  { id:'p2', title:"②和尚と珍念", ssml:true, text:"<speak><prosody rate=\"108%\" pitch=\"0st\">町の、とある寺に、少々もの知り顔の和尚さまがおりまして。<break time=\"400ms\"/>ある日、風邪をこじらせて寝込んでしまい、かかりつけの玄庵先生というお医者さまを呼びました。<break time=\"400ms\"/>玄庵先生、和尚の脈を取りながら、こう尋ねます。<break time=\"400ms\"/></prosody><prosody rate=\"100%\" pitch=\"-1st\">和尚さま、近頃、転失気はございますかな？<break time=\"500ms\"/></prosody><prosody rate=\"108%\" pitch=\"0st\">和尚は「てんしき」と聞いて、はてなんのことやら、さっぱり分かりません。<break time=\"300ms\"/>しかし、ここで「存じません」と言っては、一寺の住職の沽券に関わる。<break time=\"300ms\"/>そこで澄ました顔でこう答えました。<break time=\"400ms\"/></prosody><prosody rate=\"95%\" pitch=\"-2st\">ああ、転失気か。実はそれが、<sub alias=\"にさんにちまえ\">二、三日前</sub>にひとつ、割れましてな。<break time=\"500ms\"/></prosody><prosody rate=\"108%\" pitch=\"0st\">玄庵先生、妙な顔をしながらも「さようでございますか」と、そのまま帰っていきました。<break time=\"400ms\"/>和尚、医者が帰ったとたん、急に不安になってまいります。<break time=\"300ms\"/>「割れた」などと、知ったかぶりで答えてしまったが、いったい転失気とは何なのか。<break time=\"300ms\"/>捨て置くわけにもまいりません。<break time=\"300ms\"/>そこで、そばにいた小僧の珍念を呼びつけました。<break time=\"700ms\"/></prosody></speak>" },
  { id:'p3', title:"③医者への使い", ssml:true, text:"<speak><prosody rate=\"95%\" pitch=\"-2st\">珍念、珍念や。ちょいとお使いを頼まれておくれ。<break time=\"400ms\"/></prosody><prosody rate=\"120%\" pitch=\"+2st\">へえ、なんでございましょう。<break time=\"400ms\"/></prosody><prosody rate=\"95%\" pitch=\"-2st\">玄庵先生のところへ行ってな転失気とはなんでございますかと、聞いてまいれ。<break time=\"300ms\"/>ああ、それから、これは和尚が知りたがっていたとは言うでないぞ。お前が知りたくて聞きに来た、ということにしておくのだぞ。<break time=\"500ms\"/></prosody><prosody rate=\"120%\" pitch=\"+2st\">はい、かしこまりました。<break time=\"500ms\"/></prosody><prosody rate=\"110%\" pitch=\"0st\">珍念、素直な子でございますから、言われた通り、玄庵先生のお宅まで、とことこと出かけてまいりました。<break time=\"400ms\"/></prosody><prosody rate=\"122%\" pitch=\"+2st\">先生、先生。お伺いしたいことがございます。転失気とは、いったいなんでございますか？<break time=\"500ms\"/></prosody><prosody rate=\"108%\" pitch=\"0st\">玄庵先生、この問いを聞いて、ピンときました。<break time=\"300ms\"/>さては、さっきの和尚、知ったかぶりをしおったな。<break time=\"700ms\"/></prosody></speak>" },
  { id:'p4', title:"④医者のからかい", ssml:true, text:"<speak><prosody rate=\"106%\" pitch=\"0st\">玄庵先生、内心にやりとしながらも、和尚の恥をあらわに笑ってやるほど、野暮な男ではございません。<break time=\"300ms\"/>かえって、この機会に一つ、からかってやろうと思いつきました。<break time=\"500ms\"/></prosody><prosody rate=\"98%\" pitch=\"-1st\">珍念や、よく聞きに来た。転失気というのはな、目には見えぬ尊いものでな。<break time=\"400ms\"/>そうさな、酒の席で使う、あの盃のことを言うのじゃ。それも、大層珍しい、値打ちのある盃でな。<break time=\"500ms\"/></prosody><prosody rate=\"120%\" pitch=\"+2st\">へえ〜、盃でございますか。それは知りませんでした。<break time=\"400ms\"/></prosody><prosody rate=\"98%\" pitch=\"-1st\">よいか、和尚さまにも、そうお伝え申せ。ついでに、先生も転失気を三つほどお持ちだそうです、とでも言うておくとよい。<break time=\"500ms\"/></prosody><prosody rate=\"120%\" pitch=\"+2st\">はい、かしこまりました。ありがとう存じます。<break time=\"500ms\"/></prosody><prosody rate=\"110%\" pitch=\"0st\">珍念、すっかり感心して、寺への帰り道を急ぎました。<break time=\"700ms\"/></prosody></speak>" },
  { id:'p5', title:"⑤和尚、知ったかぶり", ssml:true, text:"<speak><prosody rate=\"108%\" pitch=\"0st\">寺に戻った珍念、さっそく和尚に申し上げます。<break time=\"400ms\"/></prosody><prosody rate=\"120%\" pitch=\"+2st\"><sub alias=\"おしょうさま\">和尚さま</sub>、ただいま戻りました。転失気とは、酒を飲む盃のことだそうにございます。大層珍しい、値打ちのある盃だとか。<break time=\"500ms\"/></prosody><prosody rate=\"108%\" pitch=\"0st\">和尚、これを聞いて、内心ほっと胸をなでおろします。<break time=\"300ms\"/>なるほど、盃か。それなら割れたと言うても、辻褄が合う。<break time=\"500ms\"/></prosody><prosody rate=\"95%\" pitch=\"-2st\">うむ、うむ。さすがはわし、よう知っておったであろう。<break time=\"500ms\"/></prosody><prosody rate=\"108%\" pitch=\"0st\">すっかり気をよくした和尚、その日の午後に訪ねてきた<sub alias=\"となりてら\">隣寺</sub>の和尚にも、得意げにこの話を披露いたします。<break time=\"400ms\"/></prosody><prosody rate=\"95%\" pitch=\"-2st\">いやなに、転失気と申しましてな、あれはたいそう値打ちのある盃でしてな。手前も三つほど持っておりましたが、この間、一つ割ってしまいましてな。<break time=\"500ms\"/></prosody><prosody rate=\"108%\" pitch=\"0st\">隣の和尚も、ほほう〜〜、それは惜しいことを、と感心して聞いておりました。<break time=\"700ms\"/></prosody></speak>" },
  { id:'p6', title:"⑥サゲ", ssml:true, text:"<speak><prosody rate=\"106%\" pitch=\"0st\">そこへちょうど、様子見にとやってきたのが、当の玄庵先生でございます。<break time=\"500ms\"/></prosody><prosody rate=\"95%\" pitch=\"-2st\">これはこれは先生、良いところへ。先生も転失気をお持ちだそうで。手前も三つほどございましたが、先日、一つ、すかしてしまいましてな。<break time=\"500ms\"/></prosody><prosody rate=\"105%\" pitch=\"0st\">玄庵先生、これを聞いて、噴き出しそうになるのをぐっとこらえます。<break time=\"400ms\"/></prosody><prosody rate=\"98%\" pitch=\"-1st\">和尚さま、盃を、すかす、とは、また妙な言い方でございますな。<break time=\"500ms\"/></prosody><prosody rate=\"106%\" pitch=\"0st\">そこへ、そばに控えていた珍念が、無邪気な顔でひとこと。<break time=\"400ms\"/></prosody><prosody rate=\"120%\" pitch=\"+2st\">先生、この間教わった通りにお伝えしましたよ。転失気は盃だって。<break time=\"500ms\"/></prosody><prosody rate=\"106%\" pitch=\"0st\">玄庵先生、とうとうこらえきれずに大笑い。<break time=\"400ms\"/></prosody><prosody rate=\"100%\" pitch=\"-1st\">いやいや和尚さま、盃が、すかす、わけがございません。すかしてしまうのは、盃ではのうて……近頃、お腹の具合はいかがで？<break time=\"600ms\"/></prosody><prosody rate=\"105%\" pitch=\"0st\">和尚、真っ赤になって、しどろもどろ。<break time=\"300ms\"/></prosody><prosody rate=\"92%\" pitch=\"-2st\">い、いや、その……それを申されると、面目次第もございません。<break time=\"600ms\"/></prosody><prosody rate=\"100%\" pitch=\"0st\">というわけで、知ったかぶりが知ったかぶりを呼び、とんだ落ちがついたところで、一席、これにてお開きとさせていただきます。<break time=\"900ms\"/></prosody></speak>" }

const otherScripts = {
  'en': [
    { id:'p1', title:"①まくら", ssml:false, text:"Let me tell you a story. In this world, there's a certain kind of person who just can't stand to admit they don't know something. If they'd only say 'I don't know,' that would be the end of it — but because they can't bring themselves to say those words, they end up piling embarrassment on top of embarrassment. Doctors, priests, it makes no difference — everyone's the same in this regard. Today's tale is about exactly that: a case of not-knowing piled on not-knowing, until it turns into an almighty mess." },
    { id:'p2', title:"②和尚と珍念", ssml:false, text:"In a certain town temple lived a priest who fancied himself quite knowledgeable. One day he caught a bad cold and took to his bed, so he called in his regular doctor, a man named Gen'an. While taking the priest's pulse, Doctor Gen'an asked: Doctor: \"Reverend, have you had a tenshiki lately?\" The priest had never heard the word 'tenshiki' in his life and had no idea what it meant. But admitting 'I don't know' would damage the dignity of a temple's head priest. So, putting on a composed face, he answered: Priest: \"Ah, tenshiki — well, as it happens, one of mine broke just two or three days ago.\" Gen'an gave a puzzled look but simply said, \"I see,\" and left. The moment the doctor was gone, the priest grew anxious — he'd bluffed his way through with that answer about something 'breaking,' but what on earth was a tenshiki, really? He couldn't just leave it be, so he called over the young acolyte at his side, a boy named Chinnen." },
    { id:'p3', title:"③医者への使い", ssml:false, text:"Priest: \"Chinnen, oh Chinnen. I need you to run a little errand for me.\" Chinnen: \"Yes sir, what is it?\" Priest: \"Go to Doctor Gen'an's house and ask him, 'What is a tenshiki?' Oh, and one more thing — don't say it's me who wants to know. Let him think you're the one who's curious.\" Chinnen: \"Yes sir, understood.\" Chinnen was an obedient boy, so he did exactly as told and trotted off to Doctor Gen'an's house. Chinnen: \"Doctor, Doctor! I have something I'd like to ask you. What in the world is a tenshiki?\" The moment Gen'an heard the question, it clicked for him at once. (Ha — so that priest was bluffing earlier after all...)" },
    { id:'p4', title:"④医者のからかい", ssml:false, text:"Doctor Gen'an smirked to himself, but he wasn't crude enough to expose the priest's ignorance outright and laugh in his face. Instead, he thought he'd have a bit of fun with the situation. Gen'an: \"Well now, Chinnen, good of you to come ask. A tenshiki, you see, is a precious thing invisible to the eye... yes, it's the little cup used for sake at a banquet. And a rather rare, valuable cup at that.\" Chinnen: \"Ohh, a sake cup! I never knew that.\" Gen'an: \"Now, be sure to tell the priest exactly that. And while you're at it, add that the doctor himself owns about three tenshiki as well.\" Chinnen: \"Yes sir, understood. Thank you very much.\" Thoroughly impressed, Chinnen hurried back along the road to the temple." },
    { id:'p5', title:"⑤和尚、知ったかぶり", ssml:false, text:"Back at the temple, Chinnen wasted no time reporting to the priest. Chinnen: \"Reverend, I'm back. A tenshiki is apparently a cup for drinking sake — a rather rare and valuable one at that.\" Hearing this, the priest secretly breathed a sigh of relief. (Ah, a cup, is it. Then my line about it 'breaking' actually holds together after all.) Priest: \"Mm, yes, indeed. Just as I thought — I knew it all along, didn't I.\" Thoroughly pleased with himself, the priest, when a neighboring temple's priest came to visit that afternoon, proudly showed off this bit of knowledge. Priest: \"Oh, it's nothing much, but there's this thing called a tenshiki — a most valuable sort of sake cup. I myself owned about three, but I'm afraid I broke one of them the other day.\" The visiting priest listened, impressed. \"My, my, what a shame that is.\"" },
    { id:'p6', title:"⑥サゲ", ssml:false, text:"Just then, who should arrive to check on the priest's condition but Doctor Gen'an himself. Priest: \"Well, well, Doctor, perfect timing. I hear you own a tenshiki yourself. I had about three of my own, but I'm afraid I let one slip out just the other day.\" Hearing this, Gen'an had to fight down the urge to burst out laughing. Gen'an: \"Reverend... 'let one slip out' is a rather odd way to describe a cup, isn't it?\" At that moment, Chinnen, sitting quietly nearby, piped up with innocent honesty. Chinnen: \"Doctor, I told him exactly what you taught me the other day — that a tenshiki is a cup!\" At last, Gen'an couldn't hold it in any longer and burst out laughing. Gen'an: \"Now, now, Reverend, a cup can't very well 'slip out.' What slips out isn't a cup at all... tell me, how has your stomach been feeling lately?\" The priest turned bright red and stammered helplessly. Priest: \"W-well, ah, that is... if you put it that way, I have no face left to show.\" And so, with one bluff calling forth another bluff, the whole thing came tumbling down to its punchline — and on that note, I'll bring this story to a close." }

    { id:'p1', title:"①まくら", ssml:false, text:"Laissez-moi vous raconter une histoire. Dans ce monde, il existe une certaine sorte de personne qui ne supporte tout simplement pas d'admettre son ignorance. S'ils disaient simplement « je ne sais pas », tout s'arrêterait là — mais comme ils n'arrivent pas à prononcer ces mots, ils s'enfoncent dans un embarras toujours plus grand. Médecins, moines, peu importe leur rang, tous pareils. L'histoire d'aujourd'hui parle justement de cela : une ignorance qui s'empile sur une autre, jusqu'à devenir un joyeux désastre." },
    { id:'p2', title:"②和尚と珍念", ssml:false, text:"Dans le temple d'une certaine ville vivait un moine qui se croyait très savant. Un jour, un mauvais rhume le cloua au lit, et il fit venir son médecin habituel, un certain docteur Gen'an. Tout en prenant son pouls, le docteur Gen'an lui demanda : Médecin : « Révérend, avez-vous eu un tenshiki récemment ? » Le moine n'avait jamais entendu ce mot de sa vie et n'en avait pas la moindre idée. Mais avouer « je ne sais pas » aurait entaché la dignité d'un père supérieur. Alors, prenant un air posé, il répondit : Moine : « Ah, un tenshiki — eh bien, justement, l'un des miens s'est brisé il y a deux ou trois jours. » Gen'an eut un air perplexe mais se contenta de dire « Je vois » avant de partir. À peine le médecin parti, le moine se mit à paniquer : il avait bluffé avec cette histoire de chose « brisée », mais qu'était donc, au juste, un tenshiki ? Impossible de laisser cela ainsi. Il appela donc le jeune novice à ses côtés, un garçon nommé Chinnen." },

const otherLangs = ['en','fr','es'];
const allAudio = {};
let otherDone = 0;
const OTHER_TOTAL = 18;

function initJaUI() {
  const container = document.getElementById('ja-parts');
  jaScripts.forEach((p, i) => {
    container.innerHTML += `
      <div class="part-row">
        <div class="part-title">${p.title}</div>
        <div>
          <div class="part-status" id="ja-status-${p.id}">未生成</div>
          <audio id="ja-audio-${p.id}"></audio>
        </div>
        <button class="btn btn-blue" onclick="generateJaPart(${i})">▶ 生成</button>
        <button class="btn btn-red" id="ja-play-${p.id}" onclick="playJaPart('${p.id}')" disabled>▷ 再生</button>
        <button class="btn btn-green" id="ja-dl-${p.id}" onclick="downloadJaPart(${i})" disabled>⬇ DL</button>
      </div>`;
  });
}

function initOtherUI() {
  const container = document.getElementById('lang-blocks');
  otherLangs.forEach(lang => {
    const parts = otherScripts[lang];
    const badges = parts.map(p => `<span class="part-badge" id="badge-${lang}-${p.id}" onclick="retryOtherPart('${lang}','${p.id}')" title="クリックで生成/再試行">${p.title}</span>`).join('');
    container.innerHTML += `
      <div class="lang-block">
        <div class="lang-title">${langConfig[lang].name} <span style="font-size:11px;color:#888;font-weight:normal;">${langConfig[lang].voice}</span></div>
        <div class="lang-progress">${badges}</div>
        <div class="lang-status" id="lang-status-${lang}">待機中</div>
      </div>`;
  });
}

async function callTTS(langCode, voiceName, text, isSSML) {
  const key = document.getElementById('apiKey').value.trim();
  if (!key) { throw new Error('APIキーが未入力です'); }
  const body = {
    input: isSSML ? { ssml: text } : { text },
    voice: { languageCode: langCode, name: voiceName },
    audioConfig: { audioEncoding: 'MP3' }
  };
  const res = await fetch(
    `https://texttospeech.googleapis.com/v1/text:synthesize?key=${key}`,
    { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
  );
  const data = await res.json();
  if (!data.audioContent) {
    const msg = (data.error && data.error.message) ? `[${data.error.status || res.status}] ${data.error.message}` : `HTTPエラー ${res.status}: ${JSON.stringify(data)}`;
    throw new Error(msg);
  }
  return data.audioContent;
}

async function generateJaPart(idx) {
  const p = jaScripts[idx];
  const status = document.getElementById(`ja-status-${p.id}`);
  status.textContent = '生成中...';
  status.className = 'part-status active';
  try {
    const b64 = await callTTS('ja-JP', 'ja-JP-Chirp3-HD-Charon', p.text, p.ssml);
    allAudio[`ja-${p.id}`] = b64;
    const audio = document.getElementById(`ja-audio-${p.id}`);
    audio.src = 'data:audio/mp3;base64,' + b64;
    status.textContent = '✅ 完成！';
    status.className = 'part-status done';
    document.getElementById(`ja-play-${p.id}`).disabled = false;
    document.getElementById(`ja-dl-${p.id}`).disabled = false;
    updateJaProgress();
  } catch (e) {
    status.textContent = '❌ ' + e.message;
    status.className = 'part-status error';
    status.title = e.message;
  }
}

function playJaPart(id) {
  document.getElementById(`ja-audio-${id}`).play();
}

function downloadJaPart(idx) {
  const p = jaScripts[idx];
  const key = `ja-${p.id}`;
  if (!allAudio[key]) return;
  const a = document.createElement('a');
  a.href = 'data:audio/mp3;base64,' + allAudio[key];
  a.download = `ja_p${idx+1}.mp3`;
  a.click();
}

async function generateAllJa() {
  for (let i = 0; i < jaScripts.length; i++) {
    await generateJaPart(i);
    await new Promise(r => setTimeout(r, 300));
  }
}

async function downloadAllJa() {
  for (let i = 0; i < jaScripts.length; i++) {
    const key = `ja-${jaScripts[i].id}`;
    if (!allAudio[key]) continue;
    const a = document.createElement('a');
    a.href = 'data:audio/mp3;base64,' + allAudio[key];
    a.download = `ja_p${i+1}.mp3`;
    a.click();
    await new Promise(r => setTimeout(r, 200));
  }
}

function updateJaProgress() {
  const done = jaScripts.filter(p => allAudio[`ja-${p.id}`]).length;
  document.getElementById('ja-bar').style.width = (done / jaScripts.length * 100) + '%';
  document.getElementById('ja-label').textContent = `${done} / ${jaScripts.length} パート完了`;
  if (done === jaScripts.length) {
    document.getElementById('dl-all-ja').disabled = false;
    document.getElementById('ja-label').textContent = `✅ 日本語 全${jaScripts.length}パート完成！`;
  }
}

async function startAll() {
  const key = document.getElementById('apiKey').value.trim();
  if (!key) { alert('APIキーを入力してください'); return; }
  document.getElementById('start-all').disabled = true;
  otherDone = 0;
  let lastError = '';
  for (const lang of otherLangs) {
    const parts = otherScripts[lang];
    document.getElementById(`lang-status-${lang}`).textContent = '生成中...';
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      const badge = document.getElementById(`badge-${lang}-${p.id}`);
      badge.className = 'part-badge active';
      try {
        const b64 = await callTTS(langConfig[lang].langCode, langConfig[lang].voice, p.text, p.ssml);
        allAudio[`${lang}-${p.id}`] = b64;
        badge.className = 'part-badge done';
        badge.title = '✅ 生成済み（クリックで再生成）';
        otherDone++;
        document.getElementById('all-bar').style.width = (otherDone / OTHER_TOTAL * 100) + '%';
        document.getElementById('all-label').textContent = `生成中... (${otherDone} / ${OTHER_TOTAL})`;
      } catch(e) {
        badge.className = 'part-badge error';
        badge.title = e.message + '（クリックで再試行）';
        lastError = `${langConfig[lang].name} ${p.title}: ${e.message}`;
      }
      await new Promise(r => setTimeout(r, 300));
    }
    document.getElementById(`lang-status-${lang}`).textContent = '✅ 完了';
  }
  document.getElementById('all-label').textContent = lastError
    ? `⚠️ ${otherDone} / ${OTHER_TOTAL} 件成功。失敗あり（赤いバッジをクリックで再試行）。最後のエラー: ${lastError}`
    : `✅ 全${otherDone}ファイル生成完了！`;
  document.getElementById('start-all').disabled = false;
  document.getElementById('dl-all').disabled = false;
}

async function retryOtherPart(lang, id) {
  const parts = otherScripts[lang];
  const idx = parts.findIndex(p => p.id === id);
  if (idx === -1) return;
  const p = parts[idx];
  const badge = document.getElementById(`badge-${lang}-${id}`);
  badge.className = 'part-badge active';
  try {
    const b64 = await callTTS(langConfig[lang].langCode, langConfig[lang].voice, p.text, p.ssml);
    allAudio[`${lang}-${id}`] = b64;
    badge.className = 'part-badge done';
    badge.title = '✅ 生成済み（クリックで再生成）';
    document.getElementById('dl-all').disabled = false;
    const a = document.createElement('a');
    a.href = 'data:audio/mp3;base64,' + b64;
    a.download = `${lang}_p${idx+1}.mp3`;
    a.click();
  } catch(e) {
    badge.className = 'part-badge error';
    badge.title = e.message + '（クリックで再試行）';
    alert(`${langConfig[lang].name} ${p.title} の生成に失敗しました。

${e.message}`);
  }
}

async function downloadAll() {
  const langs = ['ja', ...otherLangs];
  const allScripts = { ja: jaScripts, ...otherScripts };
  for (const lang of langs) {
    const parts = allScripts[lang];
    for (let i = 0; i < parts.length; i++) {
      const key = `${lang}-${parts[i].id}`;
      if (!allAudio[key]) continue;
      const a = document.createElement('a');
      a.href = 'data:audio/mp3;base64,' + allAudio[key];
      a.download = `${lang}_p${i+1}.mp3`;
      a.click();
      await new Promise(r => setTimeout(r, 200));
    }
  }
}

initJaUI();
initOtherUI();
</script>
